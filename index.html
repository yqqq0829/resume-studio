    'Tableau', 'Power BI', 'Pandas', 'NumPy', '机器学习', '深度学习', '算法', 'NLP', '推荐系统',
    'Axure', 'Figma', 'Sketch', 'PRD', '用户研究', '竞品分析', '数据分析', 'A/B 测试', 'A/B测试',
    '增长', '留存', '转化', 'GMV', 'DAU', 'MAU', 'ROI', '用户增长', '活动策划', '内容运营',
    '项目管理', '敏捷', 'Scrum', 'PMP', '团队管理', '跨部门协作', '需求分析', '沟通协调', '领导力',
    'Photoshop', 'Illustrator', 'UI设计', 'UX', '交互设计', '视觉设计', '品牌设计',
    'CET-6', 'CET-4', '雅思', '托福', '英语流利',
    '财务分析', '审计', '税务', '成本控制', '预算管理', '法务', '合规', '供应链', '采购', '人力资源'
  ];

  // 简历中的强动词（用于判断要点质量）
  var STRONG_VERBS = ['主导', '负责', '牵头', '搭建', '设计', '推动', '落地', '实现', '建立',
    '优化', '重构', '提升', '降低', '缩短', '拓展', '整合', '制定', '统筹', '带领', '管理',
    '开发', '建设', '上线', '迭代', '沉淀', '梳理', '引入', '改造', '支撑', '保障'];

  var STOP_WORDS = ['的', '了', '和', '与', '或', '在', '对', '为', '是', '有', '能够', '要求',
    '负责', '具备', '熟悉', '掌握', '精通', '了解', '优先', '以上', '相关', '工作', '岗位',
    '职位', '公司', '我们', '你', '以及', '等', '进行', '参与', '完成', '根据', '通过'];

  var EDU_RANK = { '高中': 1, '大专': 2, '专科': 2, '本科': 3, '学士': 3, '硕士': 4, '研究生': 4, '博士': 5 };

  /* ================================================================
     二、工具
     ================================================================ */

  function textOf(doc) {
    var parts = [];
    var p = doc.profile;
    parts.push(p.name, p.title, p.city, p.summary);

    (doc.data.education || []).forEach(function (it) {
      parts.push(it.school, it.major, it.degree, it.courses, it.desc, it.gpa);
    });
    (doc.data.experience || []).forEach(function (it) {
      parts.push(it.company, it.role, it.city, it.desc, it.bullets);
    });
    (doc.data.projects || []).forEach(function (it) {
      parts.push(it.name, it.role, it.tech, it.desc, it.bullets);
    });
    (doc.data.skills || []).forEach(function (it) { parts.push(it.name); });
    (doc.data.certificates || []).forEach(function (it) { parts.push(it.name, it.issuer); });
    (doc.data.languages || []).forEach(function (it) { parts.push(it.name, it.level); });
    (doc.data.custom || []).forEach(function (it) { parts.push(it.title, it.sub, it.desc, it.bullets); });

    return parts.filter(Boolean).join('\n');
  }

  function countChars(doc) {
    return textOf(doc).replace(/\s/g, '').length;
  }

  function allBullets(doc) {
    var out = [];
    ['experience', 'projects', 'custom'].forEach(function (k) {
      (doc.data[k] || []).forEach(function (it) {
        U.lines(it.bullets).forEach(function (l) { out.push(l); });
        U.lines(it.desc).forEach(function (l) { out.push(l); });
      });
    });
    return out;
  }

  function hasNumber(s) {
    return /[0-9０-９]/.test(s);
  }

  /** 是否包含量化成果
   *  算法统一收敛到 RS.util.isQuantified，避免两处实现漂移（口径未变） */
  function isQuantified(s) {
    return RS.util.isQuantified(s);
  }

  /** 是否以强动词开头 */
  function startsWithVerb(s) {
    for (var i = 0; i < STRONG_VERBS.length; i++) {
      if (s.indexOf(STRONG_VERBS[i]) === 0) return true;
      if (s.indexOf(STRONG_VERBS[i]) > -1 && s.indexOf(STRONG_VERBS[i]) < 4) return true;
    }
    return false;
  }

  function monthsBetween(start, end) {
    var s = String(start || '').match(/(\d{4})\D*(\d{1,2})?/);
    var e = String(end || '').match(/(\d{4})\D*(\d{1,2})?/);
    if (!s || !e) return 0;
    var sy = parseInt(s[1], 10), sm = parseInt(s[2] || '1', 10);
    var ey = parseInt(e[1], 10), em = parseInt(e[2] || '12', 10);
    return Math.max(0, (ey - sy) * 12 + (em - sm));
  }

  function nowYM() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1);
  }

  var CITY_LIST = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '南京', '西安',
    '苏州', '天津', '重庆', '长沙', '郑州', '青岛', '厦门', '合肥', '福州', '济南',
    '大连', '宁波', '无锡', '东莞', '佛山', '珠海', '昆明', '南昌', '贵阳', '太原',
    '石家庄', '沈阳', '哈尔滨', '长春', '兰州', '乌鲁木齐', '海口', '三亚'];

  /* ================================================================
     三、JD 解析
     ================================================================ */

  /* ------------------------------------------------------------------
     中文分词：优先用 Intl.Segmenter（能正确切出「数据分析」「用户增长」这类词），
     不支持时降级为 n-gram 粗匹配。降级方案会产生「负责中台产」这类碎片，
     所以只在老浏览器里使用。
     ------------------------------------------------------------------ */
  var _segmenter = null;
  function tokenizeCN(text) {
    if (!text) return [];

    if (window.Intl && typeof window.Intl.Segmenter === 'function') {
      try {
        if (!_segmenter) _segmenter = new window.Intl.Segmenter('zh-CN', { granularity: 'word' });
        var out = [];
        var it = _segmenter.segment(text);
        for (var s of it) {
          if (s.isWordLike) out.push(s.segment);
        }
        return out;
      } catch (e) { /* 落到降级分支 */ }
    }

    // 降级：连续汉字按 2~4 字滑窗切分
    return text.match(/[\u4e00-\u9fa5]{2,4}/g) || [];
  }

  function parseJD(jd) {
    var raw = String(jd || '');
    var text = raw.replace(/\s+/g, ' ');
    var lower = text.toLowerCase();

    var found = [];
    var seen = {};

    // 1. 词典命中
    SKILL_DICT.forEach(function (w) {
      if (lower.indexOf(w.toLowerCase()) > -1 && !seen[w]) {
        seen[w] = 1;
        found.push({ word: w, weight: 3, type: 'skill' });
      }
    });

    // 2. "熟悉/掌握/精通/具备/要求" 后的短语
    var re = /(?:熟悉|掌握|精通|了解|具备|要求|需要|会使用|熟练使用)([\u4e00-\u9fa5A-Za-z0-9+#./\s]{2,18})/g;
    var m;
    while ((m = re.exec(text)) !== null) {
      var seg = m[1].split(/[，,。；;、\s]/)[0].trim();
      if (seg.length >= 2 && seg.length <= 14 && !seen[seg] && STOP_WORDS.indexOf(seg) < 0) {
        seen[seg] = 1;
        found.push({ word: seg, weight: 2, type: 'phrase' });
      }
    }

    // 3. 中文高频词兜底
    var freq = {};
    var cn = tokenizeCN(text);
    cn.forEach(function (w) {
      if (STOP_WORDS.indexOf(w) > -1) return;
      if (/^\d+$/.test(w)) return;
      freq[w] = (freq[w] || 0) + 1;
    });
    Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; }).slice(0, 12).forEach(function (w) {
      if (seen[w]) return;
      if (freq[w] < 2) return;
      seen[w] = 1;
      found.push({ word: w, weight: 1, type: 'term' });
    });

    // 年限要求
    var yearsReq = null;
    var ym = text.match(/(\d+)\s*[-~至到]\s*(\d+)\s*年/) || text.match(/(\d+)\s*年以上/);
    if (ym) yearsReq = ym[2] ? { min: parseInt(ym[1], 10), max: parseInt(ym[2], 10) }
      : { min: parseInt(ym[1], 10), max: 99 };

    // 学历要求
    var eduReq = null;
    var em = text.match(/(博士|硕士|研究生|本科|学士|大专|专科)/);
    if (em) eduReq = EDU_RANK[em[1]] || null;

    // 城市
    var cityReq = '';
    for (var i = 0; i < CITY_LIST.length; i++) {
      if (text.indexOf(CITY_LIST[i]) > -1) { cityReq = CITY_LIST[i]; break; }
    }

    return {
      raw: raw,
      keywords: found,
      years: yearsReq,
      edu: eduReq,
      city: cityReq,
      hasJD: text.trim().length >= 20
    };
  }

  /* ================================================================
     四、五个维度评分
     ================================================================ */

  /* ---- 1. 排版规范（100） ---- */
  function scoreLayout(doc, ctx) {
    var findings = [];
    var actions = [];
    var score = 100;

    var pages = ctx.pages || 1;
    var chars = countChars(doc);
    var bullets = allBullets(doc);

    // 页数
    if (pages === 1) {
      findings.push({ t: 'good', s: '篇幅为 1 页，符合招聘方快速浏览习惯' });
    } else if (pages === 2) {
      score -= 8;
      findings.push({ t: 'warn', s: '篇幅为 2 页，第二页内容偏少时建议压缩至 1 页' });
      actions.push('把次要经历精简或合并，争取压缩到 1 页');
    } else {
      score -= 20;
      findings.push({ t: 'bad', s: '篇幅达到 ' + pages + ' 页，明显超出常规预期' });
      actions.push('只保留与目标岗位相关的近 5–8 年经历，其余做合并');
    }

    // 总字数
    if (chars < 300) {
      score -= 18;
      findings.push({ t: 'bad', s: '全文仅约 ' + chars + ' 字，信息量偏少' });
      actions.push('补充每段经历的职责与成果，建议全文 600–1200 字');
    } else if (chars < 600) {
      score -= 8;
      findings.push({ t: 'warn', s: '全文约 ' + chars + ' 字，略显单薄' });
      actions.push('为每段经历补充 1–2 条量化成果');
    } else if (chars > 1600) {
      score -= 10;
      findings.push({ t: 'warn', s: '全文约 ' + chars + ' 字，信息密度偏高' });
      actions.push('删掉与岗位无关的描述，每条要点控制在 60 字内');
    } else {
      findings.push({ t: 'good', s: '全文约 ' + chars + ' 字，信息密度适中' });
    }

    // 要点长度
    if (bullets.length) {
      var longOnes = bullets.filter(function (b) { return b.replace(/\s/g, '').length > 60; }).length;
      var shortOnes = bullets.filter(function (b) { return b.replace(/\s/g, '').length < 8; }).length;
      if (longOnes / bullets.length > 0.3) {
        score -= 10;
        findings.push({ t: 'warn', s: longOnes + ' 条要点超过 60 字，阅读成本高' });
        actions.push('把长句拆成「动作 + 对象 + 结果」的短句，单条不超过 60 字');
      }
      if (shortOnes > bullets.length * 0.3) {
        score -= 6;
        findings.push({ t: 'warn', s: shortOnes + ' 条要点过短，信息不足' });
        actions.push('过短的要点补充具体做法或结果');
      }
      if (longOnes / bullets.length <= 0.3 && shortOnes <= bullets.length * 0.3) {
        findings.push({ t: 'good', s: '要点长度分布合理，便于扫读' });
      }
    }

    // 时间格式一致性
    var badDates = 0, dateCount = 0;
    ['education', 'experience', 'projects'].forEach(function (k) {
      (doc.data[k] || []).forEach(function (it) {
        ['start', 'end'].forEach(function (f) {
          if (!it[f]) return;
          dateCount++;
          if (!/^\d{4}-\d{2}$/.test(it[f])) badDates++;
        });
      });
    });
    if (dateCount && badDates) {
      score -= 8;
      findings.push({ t: 'warn', s: badDates + ' 处时间格式不统一' });
      actions.push('统一为「YYYY.MM」，如 2021.03–2023.08');
    } else if (dateCount) {
      findings.push({ t: 'good', s: '时间格式统一' });
    }

    // 模块数量
    var modCount = 0;
    ['education', 'experience', 'projects', 'skills', 'certificates', 'languages', 'custom'].forEach(function (k) {
      if ((doc.data[k] || []).length && doc.visible[k]) modCount++;
    });
    if (modCount < 3) {
      score -= 10;
      findings.push({ t: 'bad', s: '仅启用 ' + modCount + ' 个内容模块，结构过于单薄' });
      actions.push('至少补齐教育、经历、技能三类模块');
    }

    // 排版参数
    var st = doc.style;
    if (st.fontSize < 11 || st.fontSize > 16) {
      score -= 4;
      findings.push({ t: 'warn', s: '正文字号 ' + st.fontSize + 'px 偏离舒适区间（11–15px）' });
    }
    if (st.lineHeight < 1.4) {
      score -= 4;
      findings.push({ t: 'warn', s: '行距偏紧（' + st.lineHeight + '），影响可读性' });
      actions.push('行距调整到 1.55–1.75');
    }
    if (st.margin < 10) {
      score -= 3;
      findings.push({ t: 'warn', s: '页边距偏小，打印时容易被裁切' });
    }

    return {
      id: 'layout', name: '排版规范',
      score: Math.max(0, Math.min(100, Math.round(score))),
      basis: ['页数与篇幅', '信息密度与字数', '要点长度分布', '时间格式一致性', '模块数量', '字号/行距/页边距'],
      findings: findings, actions: actions
    };
  }

  /* ---- 2. 内容完整（100） ---- */
  function scoreCompleteness(doc) {
    var p = doc.profile;
    var findings = [];
    var actions = [];
    var score = 0;
    var total = 0;

    var checks = [
      { ok: !!p.name, w: 10, okMsg: '姓名已填写', badMsg: '缺少姓名', act: '在第一行填写真实姓名' },
      { ok: !!p.phone, w: 10, okMsg: '手机号已填写', badMsg: '缺少手机号', act: '补充可联系的手机号' },
      { ok: !!p.email, w: 10, okMsg: '邮箱已填写', badMsg: '缺少邮箱', act: '补充常用邮箱（建议用姓名拼音）' },
      { ok: !!p.city, w: 5, okMsg: '所在城市已填写', badMsg: '缺少所在城市', act: '补充所在城市，便于 HR 判断通勤/到岗' },
      { ok: !!p.title, w: 10, okMsg: '目标职位已填写', badMsg: '缺少目标职位', act: '填写与投递岗位一致的目标职位' }
    ];

    checks.forEach(function (c) {
      total += c.w;
      if (c.ok) { score += c.w; findings.push({ t: 'good', s: c.okMsg }); }
      else { findings.push({ t: 'bad', s: c.badMsg }); actions.push(c.act); }
    });

    // 个人简介
    total += 10;
    var sumLen = (p.summary || '').replace(/\s/g, '').length;
    if (sumLen >= 40) { score += 10; findings.push({ t: 'good', s: '个人简介已撰写（' + sumLen + ' 字）' }); }
    else if (sumLen > 0) {
      score += 5;
      findings.push({ t: 'warn', s: '个人简介仅 ' + sumLen + ' 字，信息量不足' });
      actions.push('把简介写到 60–120 字，含年限、方向、一项代表成果');
    } else {
      findings.push({ t: 'bad', s: '缺少个人简介' });
      actions.push('补写 3–4 行简介：几年经验 + 擅长方向 + 一个量化成果');
    }

    // 教育
    total += 15;
    var edu = doc.data.education || [];
    var eduOk = edu.length && edu.every(function (it) { return it.school && it.start; });
    if (eduOk && edu.length) { score += 15; findings.push({ t: 'good', s: '教育背景完整（' + edu.length + ' 条）' }); }
    else if (edu.length) {
      score += 7;
      findings.push({ t: 'warn', s: '教育背景信息不完整（缺学校或时间）' });
      actions.push('补齐学校的入学与毕业时间、专业、学历');
    } else {
      findings.push({ t: 'bad', s: '缺少教育背景' });
      actions.push('补充最高学历的学校、专业、学历与起止时间');
    }

    // 经历
    total += 15;
    var exp = doc.data.experience || [];
    var prj = doc.data.projects || [];
    if (exp.length + prj.length >= 2) {
      score += 15;
      findings.push({ t: 'good', s: '工作/项目经历共 ' + (exp.length + prj.length) + ' 条，数量充足' });
    } else if (exp.length + prj.length === 1) {
      score += 9;
      findings.push({ t: 'warn', s: '仅 1 条经历，竞争力有限' });
      actions.push('补充第二段经历（实习、项目、社团均可）');
    } else {
      findings.push({ t: 'bad', s: '缺少工作或项目经历' });
      actions.push('至少写一段与目标岗位相关的经历');
    }

    // 技能
    total += 10;
    var sk = doc.data.skills || [];
    if (sk.length >= 3) { score += 10; findings.push({ t: 'good', s: '技能 ' + sk.length + ' 项' }); }
    else if (sk.length) {
      score += 5;
      findings.push({ t: 'warn', s: '技能仅 ' + sk.length + ' 项' });
      actions.push('补充到 5–8 项，覆盖岗位要求的核心技能');
    } else {
      findings.push({ t: 'bad', s: '缺少技能模块' });
      actions.push('补充专业技能，优先写 JD 中出现的技能词');
    }

    // 时间完整性
    total += 5;
    var noEnd = exp.filter(function (it) { return !it.end && !it.current; }).length;
    if (noEnd) {
      score -= 3;
      findings.push({ t: 'warn', s: noEnd + ' 段工作经历缺少结束时间' });
      actions.push('为已离职的经历补充结束时间，在职的勾选「至今」');
    } else {
      score += 5;
    }

    var pct = total ? Math.round(score / total * 100) : 0;
    return {
      id: 'complete', name: '内容完整',
      score: Math.max(0, Math.min(100, pct)),
      basis: ['联系方式五项', '个人简介字数', '教育背景完整度', '经历数量', '技能数量', '时间完整性'],
      findings: findings, actions: actions
    };
  }

  /* ---- 3. 岗位匹配（100） ---- */
  function scoreMatch(doc, jdInfo) {
    var findings = [];
    var actions = [];

    if (!jdInfo || !jdInfo.hasJD) {
      return {
        id: 'match', name: '岗位匹配',
        score: 0, unavailable: true, jdMissing: true,
        basis: ['JD 关键词覆盖率', '职位名称一致性'],
        findings: [{ t: 'warn', s: '未提供岗位描述（JD），无法计算匹配度' }],
        actions: ['粘贴目标岗位的招聘描述后重新评测']
      };
    }

    var full = textOf(doc).toLowerCase();
    var hits = [];
    var miss = [];
    var gotW = 0, totalW = 0;

    jdInfo.keywords.forEach(function (k) {
      totalW += k.weight;
      if (full.indexOf(k.word.toLowerCase()) > -1) {
        gotW += k.weight;
        hits.push(k.word);
      } else {
        miss.push(k.word);
      }
    });

    var cover = totalW ? Math.round(gotW / totalW * 100) : 0;
    var score = cover;

    findings.push({
      t: cover >= 70 ? 'good' : cover >= 45 ? 'warn' : 'bad',
      s: '关键词覆盖率 ' + cover + '%（命中 ' + hits.length + ' / ' + jdInfo.keywords.length + '）'
    });

    if (hits.length) {
      findings.push({ t: 'good', s: '已命中：' + hits.slice(0, 10).join('、') });
    }
    if (miss.length) {
      findings.push({ t: 'bad', s: '未命中：' + miss.slice(0, 12).join('、') });
      actions.push('把「' + miss.slice(0, 5).join('、') + '」自然融入经历或技能，前提是你确实具备');
    }

    // 职位名称一致性
    var title = (doc.profile.title || '').toLowerCase();
    var jdKeywords = jdInfo.keywords.filter(function (k) { return k.type === 'skill'; }).map(function (k) { return k.word.toLowerCase(); });
    if (title) {
      var titleHit = jdKeywords.some(function (w) { return title.indexOf(w) > -1; });
      if (!titleHit) {
        score = Math.max(0, score - 6);
        findings.push({ t: 'warn', s: '目标职位「' + doc.profile.title + '」与 JD 用词未对齐' });
        actions.push('把目标职位改成与招聘信息一致的名称，便于 ATS 与 HR 一眼识别');
      } else {
        findings.push({ t: 'good', s: '目标职位与 JD 用词一致' });
      }
    }

    return {
      id: 'match', name: '岗位匹配',
      score: Math.max(0, Math.min(100, Math.round(score))),
      basis: ['JD 关键词覆盖加权（技能词权重 3 / 要求短语 2 / 高频词 1）', '目标职位与 JD 用词一致性'],
      findings: findings, actions: actions,
      detail: { hits: hits, miss: miss, cover: cover }
    };
  }

  /* ---- 4. 需求适配（100） ---- */
  function scoreFit(doc, jdInfo) {
    var findings = [];
    var actions = [];
    var score = 0;
    var total = 0;

    /* 年限 */
    var exp = doc.data.experience || [];
    var spanStart = '', spanEnd = '';
    exp.forEach(function (it) {
      if (it.start && (!spanStart || it.start < spanStart)) spanStart = it.start;
      var e = it.current ? nowYM() : it.end;
      if (e && (!spanEnd || e > spanEnd)) spanEnd = e;
    });
    var years = spanStart && spanEnd ? Math.round(monthsBetween(spanStart, spanEnd) / 12 * 10) / 10 : 0;

    total += 30;
    if (!jdInfo || !jdInfo.hasJD || !jdInfo.years) {
      if (years > 0) { score += 24; findings.push({ t: 'good', s: '累计工作经历约 ' + years + ' 年' }); }
      else { findings.push({ t: 'warn', s: '未能从经历中推算工作年限' }); }
    } else {
      var req = jdInfo.years;
      if (years >= req.min && years <= req.max) {
        score += 30;
        findings.push({ t: 'good', s: '工作年限 ' + years + ' 年，与要求（' + req.min + '–' + (req.max > 90 ? '不限' : req.max) + ' 年）吻合' });
      } else if (years > req.max && req.max < 90) {
        score += 18;
        findings.push({ t: 'warn', s: '工作年限 ' + years + ' 年，高于要求上限，需强调性价比与稳定性' });
        actions.push('在简介中说明为什么愿意接受该岗位，弱化"资历过高"的顾虑');
      } else {
        score += Math.max(6, Math.round(30 * years / Math.max(1, req.min)));
        findings.push({ t: 'bad', s: '工作年限 ' + years + ' 年，低于要求 ' + req.min + ' 年' });
        actions.push('用项目经验、实习、开源贡献补足经验密度');
      }
    }

    /* 学历 */
    total += 25;
    var maxEdu = 0;
    (doc.data.education || []).forEach(function (it) {
      var r = EDU_RANK[it.degree] || 0;
      if (r > maxEdu) maxEdu = r;
    });
    if (!jdInfo || !jdInfo.hasJD || !jdInfo.edu) {
      if (maxEdu) { score += 20; findings.push({ t: 'good', s: '已填写学历信息' }); }
      else { findings.push({ t: 'warn', s: '缺少学历信息' }); }
    } else if (maxEdu >= jdInfo.edu) {
      score += 25;
      findings.push({ t: 'good', s: '学历满足要求' });
    } else {
      score += 10;
      findings.push({ t: 'bad', s: '学历低于岗位要求' });
      actions.push('用证书、项目成果或相关经验弥补学历差距，并突出实操能力');
    }

    /* 城市 */
    total += 20;
    var city = doc.profile.city || '';
    if (!jdInfo || !jdInfo.hasJD || !jdInfo.city) {
      if (city) { score += 16; findings.push({ t: 'good', s: '已填写所在城市' }); }
    } else if (city && (city.indexOf(jdInfo.city) > -1 || jdInfo.city.indexOf(city) > -1)) {
      score += 20;
      findings.push({ t: 'good', s: '所在城市与岗位地点一致（' + jdInfo.city + '）' });
    } else {
      score += 6;
      findings.push({ t: 'warn', s: '所在城市（' + (city || '未填') + '）与岗位地点（' + jdInfo.city + '）不同' });
      actions.push('若接受异地，在简介中注明「可接受异地 / 可即时到岗」');
    }

    /* 行业与职级 */
    total += 25;
    var industryHit = 0;
    var jdText = jdInfo && jdInfo.raw ? jdInfo.raw : '';
    var companyNames = exp.map(function (it) { return it.company || ''; }).join(' ');
    if (jdText && companyNames) {
      var inter = jdInfo.keywords.filter(function (k) { return companyNames.indexOf(k.word) > -1; });
      industryHit = inter.length;
    }
    if (industryHit >= 2) {
      score += 22;
      findings.push({ t: 'good', s: '公司/业务与 JD 关键词有 ' + industryHit + ' 处交集，行业相关性较好' });
    } else if (companyNames) {
      score += 12;
      findings.push({ t: 'warn', s: '行业相关信号偏弱' });
      if (jdInfo && jdInfo.hasJD) {
        actions.push('在经历描述中点明业务领域，让跨行业经验可被直接理解');
      }
    }

    return {
      id: 'fit', name: '需求适配',
      score: total ? Math.max(0, Math.min(100, Math.round(score / total * 100))) : 0,
      basis: ['工作年限 vs JD 年限要求', '最高学历 vs 学历门槛', '所在城市 vs 岗位地点', '行业相关性'],
      findings: findings, actions: actions,
      detail: { years: years }
    };
  }

  /* ---- 5. 板块完善（100） ---- */
  function scoreSection(doc) {
    var findings = [];
    var actions = [];
    var score = 100;
    var bullets = allBullets(doc);

    // 量化密度
    var quantified = bullets.filter(isQuantified).length;
    var qRate = bullets.length ? quantified / bullets.length : 0;
    if (!bullets.length) {
      score -= 30;
      findings.push({ t: 'bad', s: '没有任何经历要点，无法体现成果' });
      actions.push('每段经历至少写 2–3 条要点，结构为「动作 + 对象 + 结果」');
    } else if (qRate < 0.3) {
      score -= 20;
      findings.push({ t: 'bad', s: '仅 ' + Math.round(qRate * 100) + '% 的要点含量化数据' });
      actions.push('为目标结果补上数字：提升多少 %、覆盖多少用户、节省多少时间');
    } else if (qRate < 0.6) {
      score -= 8;
      findings.push({ t: 'warn', s: Math.round(qRate * 100) + '% 的要点含量化，仍有提升空间' });
      actions.push('把「明显提升」这类模糊表述替换为具体数字');
    } else {
      findings.push({ t: 'good', s: '量化成果密度良好（' + Math.round(qRate * 100) + '%）' });
    }

    // 强动词
    var verbCount = bullets.filter(startsWithVerb).length;
    var vRate = bullets.length ? verbCount / bullets.length : 0;
    if (bullets.length && vRate < 0.4) {
      score -= 12;
      findings.push({ t: 'warn', s: '要点开头多为非动作描述，冲击力不足' });
      actions.push('用「主导 / 搭建 / 优化 / 推动」等强动词开头');
    } else if (bullets.length) {
      findings.push({ t: 'good', s: '要点多以致行动词开头' });
    }

    // 各模块条目数
    ['education', 'experience', 'projects'].forEach(function (k) {
      var arr = doc.data[k] || [];
      if (!arr.length) return;
      arr.forEach(function (it, i) {
        var b = U.lines(it.bullets);
        if (k !== 'education' && b.length < 2) {
          score -= 5;
          findings.push({ t: 'warn', s: (RS.fieldDefs[k] ? RS.fieldDefs[k].itemName : k) + '第 ' + (i + 1) + ' 条要点不足 2 项' });
        }
      });
    });

    // 技能分层
    var sk = doc.data.skills || [];
    if (sk.length >= 4) {
      var levels = {};
      sk.forEach(function (s) { levels[s.level] = 1; });
      if (Object.keys(levels).length === 1 && sk.length >= 4) {
        score -= 6;
        findings.push({ t: 'warn', s: '所有技能等级一致，无法区分主次' });
        actions.push('拉开技能等级差异，把最擅长的 2–3 项标为精通');
      }
    }

    // 项目技术栈
    var prj = doc.data.projects || [];
    if (prj.length) {
      var noTech = prj.filter(function (it) { return !it.tech; }).length;
      if (noTech) {
        score -= 6;
        findings.push({ t: 'warn', s: noTech + ' 个项目未填写技术栈/工具' });
        actions.push('技术岗补充技术栈，非技术岗可补「方法与工具」');
      }
    }

    // 证书/语言
    if (!(doc.data.certificates || []).length && !(doc.data.languages || []).length) {
      score -= 4;
      findings.push({ t: 'warn', s: '未填写证书或语言能力' });
      actions.push('有相关证书或外语能力时补充，属于低成本加分项');
    }

    return {
      id: 'section', name: '板块完善',
      score: Math.max(0, Math.min(100, Math.round(score))),
      basis: ['要点量化密度', '强动词使用率', '各经历要点数量', '技能等级分层', '项目技术栈完整性', '证书/语言'],
      findings: findings, actions: actions
    };
  }

  /* ================================================================
     五、综合
     ================================================================ */

  function gradeOf(score) {
    if (score >= 90) return { g: 'A+', t: '优秀', c: 'green' };
    if (score >= 85) return { g: 'A', t: '优秀', c: 'green' };
    if (score >= 80) return { g: 'A-', t: '良好', c: 'green' };
    if (score >= 75) return { g: 'B+', t: '良好', c: 'blue' };
    if (score >= 70) return { g: 'B', t: '合格', c: 'blue' };
    if (score >= 65) return { g: 'B-', t: '合格', c: 'blue' };
    if (score >= 60) return { g: 'C+', t: '待改进', c: 'orange' };
    if (score >= 50) return { g: 'C', t: '待改进', c: 'orange' };
    return { g: 'D', t: '需重写', c: 'red' };
  }

  function analyze(doc, target, extra) {
    var jdInfo = parseJD(target.jd);
    var ctx = { pages: extra && extra.pages ? extra.pages : null };

    if (!ctx.pages) {
      var chars = countChars(doc);
      ctx.pages = Math.max(1, Math.ceil(chars / 950));
      ctx.estimated = true;
    }

    var dims = [
      scoreLayout(doc, ctx),
      scoreCompleteness(doc),
      scoreMatch(doc, jdInfo),
      scoreFit(doc, jdInfo),
      scoreSection(doc)
    ];

    // 匹配维度不可用时（无 JD），重新分配权重
    var active = dims.filter(function (d) { return !d.unavailable; });
    var wSum = 0;
    active.forEach(function (d) {
      var w = 0;
      WEIGHTS.forEach(function (x) { if (x.id === d.id) w = x.weight; });
      wSum += w;
      d._w = w;
    });

    var total = 0;
    active.forEach(function (d) {
      total += d.score * (d._w / wSum);
    });
    total = Math.round(total);

    var g = gradeOf(total);

    // 汇总优先级建议
    var priority = [];
    dims.forEach(function (d) {
      if (d.unavailable) return;
      d.actions.forEach(function (a, i) {
        if (i > 1) return;
        priority.push({ dim: d.name, text: a, weight: d.score });
      });
    });
    priority.sort(function (a, b) { return a.weight - b.weight; });

    return {
      dims: dims,
      total: total,
      grade: g,
      jd: jdInfo,
      ctx: ctx,
      priority: priority.slice(0, 5),
      chars: countChars(doc),
      at: new Date()
    };
  }

  /* ================================================================
     六、环形图
     ================================================================ */

  function scoreColor(s) {
    if (s >= 85) return '#2fbf71';
    if (s >= 70) return '#5b8cff';
    if (s >= 55) return '#f5a524';
    return '#f2555a';
  }

  function ringSVG(score, opt) {
    opt = opt || {};
    var size = opt.size || 120;
    var sw = opt.stroke || Math.max(7, Math.round(size * 0.075));
    var r = (size - sw) / 2;
    var c = 2 * Math.PI * r;
    var s = Math.max(0, Math.min(100, score));
    var offset = c * (1 - s / 100);
    var color = opt.color || scoreColor(s);
    var fs = opt.fontSize || Math.round(size * 0.26);
    var label = opt.label;

    return '<svg class="rv-ring" viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '" ' +
      'role="img" aria-label="' + (label || '') + ' ' + s + ' 分">' +
      '<circle cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" ' +
        'stroke="rgba(255,255,255,.07)" stroke-width="' + sw + '"/>' +
      '<circle class="rv-ring-bar" cx="' + (size / 2) + '" cy="' + (size / 2) + '" r="' + r + '" fill="none" ' +
        'stroke="' + color + '" stroke-width="' + sw + '" stroke-linecap="round" ' +
        'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + c.toFixed(1) + '" ' +
        'transform="rotate(-90 ' + (size / 2) + ' ' + (size / 2) + ')" ' +
        'data-target="' + offset.toFixed(1) + '"/>' +
      '<text x="' + (size / 2) + '" y="' + (size / 2) + '" text-anchor="middle" dominant-baseline="central" ' +
        'font-size="' + fs + '" font-weight="650" fill="#e8ecf3">' + s + '</text>' +
      '<text x="' + (size / 2) + '" y="' + (size / 2 + fs * 0.85) + '" text-anchor="middle" ' +
        'font-size="' + Math.round(fs * 0.36) + '" fill="#8892a2">分</text>' +
    '</svg>';
  }

  /** 让环在插入后动画到目标值 */
  function animateRings(root) {
    var bars = root.querySelectorAll('.rv-ring-bar');
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        for (var i = 0; i < bars.length; i++) {
          bars[i].style.transition = 'stroke-dashoffset .9s cubic-bezier(.25,.9,.3,1)';
          bars[i].style.strokeDashoffset = bars[i].getAttribute('data-target');
        }
      });
    });
    // rAF 不推进时的兜底
    setTimeout(function () {
      for (var i = 0; i < bars.length; i++) {
        if (!bars[i].style.strokeDashoffset) {
          bars[i].style.strokeDashoffset = bars[i].getAttribute('data-target');
        }
      }
    }, 120);
  }

  /* ================================================================

     ================================================================ */

  var rv = {
    source: 'current',
    fileName: '',
    parsedDoc: null,
    company: '',
    role: '',
    jd: '',
    result: null,
    error: '',
    openDim: {}
  };

  var bodyEl = null;

  /* 用户手动忽略的关键词（仅本次会话，不落盘） */
  var ignoredKeywords = {};
  function isIgnored(w) { return !!ignoredKeywords[w]; }

  function findingsHTML(list) {
    return list.map(function (f) {
      var icon = f.t === 'good' ? '✓' : f.t === 'warn' ? '!' : '×';
      return '<li class="rv-f ' + f.t + '"><i>' + icon + '</i><span>' + esc(f.s) + '</span></li>';
    }).join('');
  }

  /* 未命中关键词：可一键加入技能，或标记忽略 */
  function missListHTML(miss) {
    var list = (miss || []).filter(function (w) { return !isIgnored(w); });
    if (!list.length) {
      return '<div class="rv-miss"><p class="rv-miss-empty">关键词已全部覆盖或已忽略</p></div>';
    }
    return '<div class="rv-miss">' +
      '<div class="rv-miss-head">可补充的关键词 <em>点 + 加入技能，点 × 忽略</em></div>' +
      '<div class="rv-miss-wrap">' +
      list.slice(0, 18).map(function (w) {
        return '<span class="rv-miss-item">' +
          '<b>' + esc(w) + '</b>' +
          '<button class="rv-miss-btn add" data-add-skill="' + esc(w) + '" title="加入技能">+</button>' +
          '<button class="rv-miss-btn del" data-ignore-kw="' + esc(w) + '" title="忽略">×</button>' +
        '</span>';
      }).join('') +
      '</div></div>';
  }

  function dimCardHTML(d) {
    var open = !!rv.openDim[d.id];
    var color = scoreColor(d.score);
    var disabled = d.unavailable;

    return '<div class="rv-dim' + (open ? ' open' : '') + (disabled ? ' is-off' : '') + '" data-dim="' + d.id + '">' +
      '<div class="rv-dim-head" data-rv="toggle-dim" data-id="' + d.id + '">' +
        '<span class="rv-dim-ring">' + ringSVG(d.score, { size: 54, stroke: 5, fontSize: 15 }) + '</span>' +
        '<span class="rv-dim-name">' +
          '<b>' + esc(d.name) + '</b>' +
          '<em>' + (disabled ? '需要 JD 才能评分' : d.score >= 75 ? '表现不错' : d.score >= 55 ? '有提升空间' : '需要重点改进') + '</em>' +
        '</span>' +
        '<span class="rv-dim-badge" style="color:' + color + '">' + (disabled ? '—' : d.score) + '</span>' +
        '<span class="rv-chev">' + RS.icons.get('chevron') + '</span>' +
      '</div>' +
      '<div class="rv-dim-body">' +
        '<div class="rv-basis">' +
          '<span class="rv-basis-label">评分依据</span>' +

        '</div>' +
        '<ul class="rv-findings">' + findingsHTML(d.findings) + '</ul>' +
        (d.id === 'match' && d.detail && d.detail.miss ? missListHTML(d.detail.miss) : '') +
        (d.actions.length
          ? '<div class="rv-actions"><span class="rv-actions-label">改进建议</span><ol>' +
            d.actions.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ol></div>'
          : '') +
      '</div>' +
    '</div>';
  }

  /** 综合诊断：避免"好简历被打低分"看起来像误判 */
  function insightText(r) {
    var matchDim = null;
    r.dims.forEach(function (d) { if (d.id === 'match') matchDim = d; });
    if (!matchDim || matchDim.unavailable) return '';

    var others = r.dims.filter(function (d) { return !d.unavailable && d.id !== 'match'; });
    var avg = others.length
      ? others.reduce(function (a, d) { return a + d.score; }, 0) / others.length
      : 0;

    if (matchDim.score < 50 && avg >= 72) {
      return '简历本身质量不错（其余维度均分 ' + Math.round(avg) +
        '），但与目标岗位的关键词重合度偏低。若不是跨岗投递，建议优先按 JD 重写经历描述与技能排序。';
    }
    if (matchDim.score >= 70 && r.total >= 78) {
      return '整体与目标岗位契合度较高，可以投递。投递前再核对联系方式与时间区间是否准确。';
    }
    if (r.total < 55) {
      return '当前版本与可投递状态差距较大，建议先按下方「优先改进」逐条处理，再重新评测一次。';
    }
    return '';
  }

          (!srcCurrent
            ? '<div class="rv-upload">' +
                '<button class="btn sm ghost" data-rv="pick-file">' + RS.icons.get('upload') + (rv.parsedDoc ? '重新选择文件' : '选择文件') + '</button>' +
                '<span class="rv-hint">图片与 PDF 无法在本地解析，请先转为 Word 或文本</span>' +
              '</div>'
            : '') +
        '</div>' +
      '</div>' +

      '<div class="rv-step">' +
        '<div class="rv-step-no">2</div>' +
        '<div class="rv-step-body">' +
          '<h4>这份简历要投递到哪里</h4>' +
          '<p class="rv-step-desc">填写公司与岗位，越具体评分越准；粘贴 JD 可算出关键词匹配度。</p>' +
          '<div class="grid-2">' +
            '<div class="field"><label for="rvCompany">公司名称</label>' +
              '<input class="control" id="rvCompany" data-rvfield="company" value="' + esc(rv.company) + '" placeholder="例如：字节跳动"></div>' +
            '<div class="field"><label for="rvRole">目标岗位</label>' +
              '<input class="control" id="rvRole" data-rvfield="role" value="' + esc(rv.role) + '" placeholder="例如：高级产品经理"></div>' +
            '<div class="field full"><label for="rvJD">岗位描述 JD<span class="rv-opt">选填，但强烈建议</span></label>' +
              '<textarea class="control" id="rvJD" data-rvfield="jd" rows="9" ' +
                'placeholder="把招聘网站上的岗位职责与任职要求整段粘贴进来（至少 20 字）">' + esc(rv.jd) + '</textarea>' +
              '<p class="hint">用于提取关键词、年限、学历、城市等要求，计算匹配度与适配度。</p>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="rv-submit">' +
        '<button class="btn primary" data-rv="run">' + RS.icons.get('sparkle') + '开始评测</button>' +
        '<span class="rv-hint">全程本地计算，不上传任何内容</span>' +
      '</div>';
  }

  function panelHTML() {
    var head = '' +
      '<div class="sect-head" style="margin-bottom:14px">' +
        '<h3><span class="bar"></span>' + (rv.result ? '评测结果' : '简历评测') + '</h3>' +
        (rv.result ? '<button class="btn sm ghost" data-rv="restart">' + RS.icons.get('reset') + '重新评测</button>' : '') +
      '</div>';

    var err = rv.error
      ? '<div class="notice warn">' + RS.icons.get('alert') + '<div>' + esc(rv.error) + '</div></div>'
      : '';

    return head + err + (rv.result ? resultHTML() : formHTML());
  }

  /** 触发主控制器重建当前面板 */
  function render() {
    if (RS.app && RS.app.refreshPanel) {
      RS.app.refreshPanel();
    }
  }

  /* ---------------- 报告与提示词 ---------------- */

  function reportText() {
    var r = rv.result;
    if (!r) return '';
    var L = [];
    L.push('# 简历评测报告');
    L.push('');
    L.push('- 投递目标：' + (rv.company || '未填') + (rv.role ? ' · ' + rv.role : ''));
    L.push('- 评测时间：' + r.at.toLocaleString('zh-CN'));
    L.push('- 综合评分：' + r.total + ' 分（' + r.grade.g + ' · ' + r.grade.t + '）');
    L.push('');
    L.push('## 维度得分');
    L.push('');
    L.push('| 维度 | 得分 |');
    L.push('| --- | --- |');
    r.dims.forEach(function (d) {
      L.push('| ' + d.name + ' | ' + (d.unavailable ? '未评分' : d.score) + ' |');
    });
    L.push('');
    r.dims.forEach(function (d) {
      L.push('## ' + d.name + (d.unavailable ? '（未评分）' : '：' + d.score + ' 分'));
      L.push('');
      L.push('**评分依据**：' + d.basis.join(' / '));
      L.push('');
      d.findings.forEach(function (f) {
        L.push('- ' + (f.t === 'good' ? '✅' : f.t === 'warn' ? '⚠️' : '❌') + ' ' + f.s);
      });
      if (d.actions.length) {
        L.push('');
        L.push('**改进建议**');
        d.actions.forEach(function (a, i) { L.push((i + 1) + '. ' + a); });
      }
      L.push('');
    });
    return L.join('\n');
  }

  function promptText() {
    var r = rv.result;
    if (!r) return '';
    var doc = rv.source === 'current' ? RS.store.state : rv.parsedDoc;
    var L = [];
    L.push('你是资深简历优化专家。请基于以下材料给出更深入的评测与改写建议。');
    L.push('');
    L.push('## 投递目标');
    L.push('公司：' + (rv.company || '未填'));
    L.push('岗位：' + (rv.role || '未填'));
    L.push('');
    L.push('## 岗位描述 JD');
    L.push(rv.jd || '（未提供）');
    L.push('');
    L.push('## 简历内容');
    L.push('```');
    L.push(textOf(doc));
    L.push('```');
    L.push('');
    L.push('## 本地规则引擎已给出的评分');
    r.dims.forEach(function (d) {
      L.push('- ' + d.name + '：' + (d.unavailable ? '未评分' : d.score + ' 分'));
    });
    L.push('- 综合：' + r.total + ' 分（' + r.grade.g + '）');
    L.push('');
    L.push('## 请输出');
    L.push('1. 对上述评分的复核意见（哪些偏严/偏松，为什么）；');
    L.push('2. 三个最能提升匹配度的改写示例（Before → After）；');
    L.push('3. 针对该岗位的 3 个面试追问及准备要点。');
    return L.join('\n');
  }

  function copyText(text, okMsg) {
    if (!text) return;
    var done = function () { RS.app.toast(okMsg, 'ok'); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallback(); });
      return;
    }
    fallback();

    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (e) { RS.app.toast('复制失败，请手动选择文本', 'err'); }
      document.body.removeChild(ta);
    }
  }

  /* ---------------- 交互 ---------------- */

  function runReview() {
    var doc = rv.source === 'current' ? RS.store.state : rv.parsedDoc;
    if (!doc) {
      rv.error = '请先选择要评测的简历文件';
      render();
      return;
    }
    if (!rv.role.trim()) {
      rv.error = '请填写目标岗位，这直接决定匹配度与适配度的计算';
      render();
      return;
    }
    rv.error = '';
    rv.result = analyze(doc, { jd: rv.jd }, {
      pages: rv.source === 'current' ? RS.app.pageCount() : null
    });
    render();

    setTimeout(function () {
      var first = bodyEl.querySelector('.rv-hero');
      if (first) first.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }, 60);
  }

  function pickFile() {
    var input = document.getElementById('rvFile');
    if (!input) {
      input = document.createElement('input');
      input.type = 'file';
      input.id = 'rvFile';
      input.accept = '.docx,.txt,.md,.markdown,.html,.htm,.json';
      input.style.display = 'none';
      input.addEventListener('change', async function () {
        var f = this.files && this.files[0];
        if (!f) return;
        try {
          RS.app.toast('正在解析…', 'info');
          var parsed = await RS.importer.parseFile(f);
          rv.parsedDoc = parsed.doc;
          rv.fileName = f.name;
          rv.source = 'file';
          rv.error = '';
          render();
          RS.app.toast('解析完成，可开始评测', 'ok');
        } catch (e) {
          rv.error = '文件解析失败：' + (e && e.message ? e.message : '未知错误');
          render();
        }
        this.value = '';
      });
      document.body.appendChild(input);
    }
    input.click();
  }

  /** 把 JD 关键词加入技能，并立即重算匹配度 */
  function addSkillFromJD(word) {
    var state = RS.store.state;
    var exists = (state.data.skills || []).some(function (s) { return s.name === word; });
    if (exists) {
      RS.app.toast('技能里已有「' + word + '」', 'info');
      return;
    }
    snapshotSafely();
    state.data.skills.push({ id: U.uid(), name: word, level: '3', group: '' });
    if (!state.visible.skills) state.visible.skills = true;
    RS.app.refreshAll();
    RS.app.toast('已加入技能：' + word, 'ok');
    rerun();
  }

  function snapshotSafely() {
    if (RS.history) RS.history.commit('add-skill');
  }

  /** 重新评测（保持当前目标岗位与 JD） */
  function rerun() {
    if (!rv.result) return;
    var doc = rv.source === 'current' ? RS.store.state : rv.parsedDoc;
    if (!doc) return;
    rv.result = analyze(doc, { jd: rv.jd }, {
      pages: rv.source === 'current' ? RS.app.pageCount() : null
    });
    render();
  }

  function onClick(e) {
    /* 关键词操作优先处理 */
    var addBtn = e.target.closest ? e.target.closest('[data-add-skill]') : null;
    if (addBtn) {
      e.preventDefault();
      addSkillFromJD(addBtn.getAttribute('data-add-skill'));
      return;
    }
    var ignBtn = e.target.closest ? e.target.closest('[data-ignore-kw]') : null;
    if (ignBtn) {
      e.preventDefault();
      ignoredKeywords[ignBtn.getAttribute('data-ignore-kw')] = 1;
      render();
      return;
    }

    var el = e.target.closest ? e.target.closest('[data-rv]') : null;
    if (!el) return;
    var act = el.getAttribute('data-rv');

    switch (act) {
      case 'src-current':
        rv.source = 'current';
        rv.error = '';
        render();
        break;
      case 'src-file':
        rv.source = 'file';
        rv.error = '';
        render();
        break;
      case 'pick-file':
        pickFile();
        break;
      case 'run':
        runReview();
        break;
      case 'restart':
        rv.result = null;
        rv.error = '';
        render();
        break;
      case 'toggle-dim':
        var id = el.getAttribute('data-id');
        var card = el.parentNode;
        rv.openDim[id] = !rv.openDim[id];
        card.classList.toggle('open', !!rv.openDim[id]);
        break;
      case 'copy-report':
        copyText(reportText(), '评测报告已复制');
        break;
      case 'copy-prompt':
        copyText(promptText(), 'AI 提示词已复制，可粘贴到对话中');
        break;
      default:
        break;
    }
  }

  function onInput(e) {
    var el = e.target.closest ? e.target.closest('[data-rvfield]') : null;
    if (!el) return;
    var k = el.getAttribute('data-rvfield');
    if (k === 'company' || k === 'role' || k === 'jd') {
      rv[k] = el.value;
    }
  }

  /* ================================================================
     八、对外
     ================================================================ */

  RS.reviewer = {
    analyze: analyze,
    parseJD: parseJD,
    ringSVG: ringSVG,

    /** 由 editor 面板调用，返回 HTML 字符串 */
    html: panelHTML,

    /** 面板 HTML 插入后调用：绑定事件 + 环形图动画 */
    afterRender: function () {
      bodyEl = document.getElementById('panelBody');
      if (!bodyEl) return;

      if (!bodyEl.__rvBound) {
        bodyEl.__rvBound = true;
        bodyEl.addEventListener('click', onClick);
        bodyEl.addEventListener('input', onInput);
      }
      if (rv.result) animateRings(bodyEl);
    },

    reset: function () {
      rv.result = null;
      rv.error = '';
    }
  };

})(window);

</script>
<script>
/* ==== app.js ==== */
/* ==================================================================
   主控制器：初始化 / 渲染调度 / 事件委托 / 缩放 / 快捷键
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;
  var esc = U.escapeHtml;

  /* ---------------- DOM ---------------- */
  var stack, holder, scrollEl, bodyEl, actionsEl, navScroll;
  var panelTitleEl, panelDescEl, pageInfoEl, tplNameEl, zoomLabelEl;
  var saveDotEl, saveTextEl;

  /* ---------------- 运行时状态 ---------------- */
  var currentPanelId = 'profile';
  var zoom = 1;
  var zoomMode = 'fit';
  var pageCount = 0;
  var isBooting = true;

  var UNIT_MAP = {
    'style.fontSize': 'px',
    'style.lineHeight': '',
    'style.gap': 'px',
    'style.margin': 'mm',
    'style.nameSpacing': 'px',
    'style.photoSize': 'mm'
  };

  function $(id) { return document.getElementById(id); }

  /* ---------------- 提示 ---------------- */
  function toast(msg, type) {
    var wrap = $('toastWrap');
    if (!wrap) return;
    var iconName = 'info';
    if (type === 'ok') iconName = 'check';
    else if (type === 'err' || type === 'warn') iconName = 'alert';

    var node = document.createElement('div');
    node.className = 'toast ' + (type || '');
    node.innerHTML = RS.icons.get(iconName) + '<span>' + esc(msg) + '</span>';
    wrap.appendChild(node);

    setTimeout(function () {
      node.classList.add('hide');
      setTimeout(function () {
        if (node.parentNode) node.parentNode.removeChild(node);
      }, 220);
    }, 2600);
  }

  /* ---------------- 界面主题（不影响纸张） ---------------- */
  var UI_THEME_KEY = 'resume-studio:ui:theme';

  function applyUiTheme(mode) {
    var light = mode === 'light';
    if (light) document.documentElement.setAttribute('data-ui-theme', 'light');
    else document.documentElement.removeAttribute('data-ui-theme');

    var btn = document.getElementById('uiThemeBtn');
    if (btn) {
      var label = btn.querySelector('span');
      if (label) label.textContent = light ? '深色界面' : '浅色界面';
    }
    try { window.localStorage.setItem(UI_THEME_KEY, light ? 'light' : 'dark'); } catch (e) { }
  }

  function restoreUiTheme() {
    var saved = 'dark';
    try { saved = window.localStorage.getItem(UI_THEME_KEY) || 'dark'; } catch (e) { }
    applyUiTheme(saved);
  }

  /* ---------------- 撤销 / 重做 ----------------
     实际历史栈在 RS.history（store.js 内），这里只做调用与提示。
     snapshot() 保留为薄封装：结构操作前调用一次 = 立即入栈一步。 */
  function snapshot(label) {
    if (RS.history) RS.history.commit(label || 'edit');
  }

  function undo() {
    if (!RS.history) return;
    if (!RS.history.canUndo()) {
      toast('没有可撤销的操作', 'warn');
      return;
    }
    if (RS.history.undo()) {
      RS.app.refreshAll();
      toast('已撤销', 'ok');
    }
  }

  function redo() {
    if (!RS.history) return;
    if (!RS.history.canRedo()) {
      toast('没有可重做的操作', 'warn');
      return;
    }
    if (RS.history.redo()) {
      RS.app.refreshAll();
      toast('已重做', 'ok');
    }
  }

  /** 同步撤销/重做按钮的可用状态 */
  function syncHistoryButtons() {
    var u = document.getElementById('undoBtn');
    var r = document.getElementById('redoBtn');
    var can = RS.history || {};
    if (u) u.disabled = !(can.canUndo && can.canUndo());
    if (r) r.disabled = !(can.canRedo && can.canRedo());
  }

  /* ---------------- 保存状态 ---------------- */
  function updateSaveLine(kind) {
    if (!saveDotEl || !saveTextEl) return;
    if (kind === 'saving') {
      saveDotEl.classList.add('saving');
      saveTextEl.textContent = '正在保存…';
    } else {
      saveDotEl.classList.remove('saving');
      var t = RS.store.lastSavedAt;
      if (t) {
        var p = function (n) { return n < 10 ? '0' + n : '' + n; };
        saveTextEl.textContent = '已保存 ' + p(t.getHours()) + ':' + p(t.getMinutes()) + ':' + p(t.getSeconds());
      } else {
        saveTextEl.textContent = RS.store.storageAvailable ? '尚未保存' : '本地存储不可用';
      }
    }
  }

  /* ---------------- 样式变量注入 ---------------- */
  function applyStyleVars() {
    var s = RS.store.state.style;
    // 主题三色统一由 RS.theme 推导（内部带「deep 与白字对比度」守卫）
    var th = RS.theme ? RS.theme.derive(s.accent) : {
      accent: s.accent,
      soft: U.tint(s.accent, 0.88),
      deep: U.shade(s.accent, 0.3)
    };
    stack.style.setProperty('--doc-accent', th.accent);
    stack.style.setProperty('--doc-accent-soft', th.soft);
    stack.style.setProperty('--doc-accent-deep', th.deep);
    stack.style.setProperty('--doc-font', RS.fontStack(s.font));
    stack.style.setProperty('--doc-size', s.fontSize + 'px');
    stack.style.setProperty('--doc-lh', String(s.lineHeight));
    stack.style.setProperty('--doc-gap', s.gap + 'px');
    // 姓名字距：由 renderStyles 按 lang 规则取用（max(用户值, 语言默认)）
    stack.style.setProperty('--doc-name-spacing', (parseFloat(s.nameSpacing) || 0) + 'px');
    stack.style.setProperty('--doc-margin', s.margin + 'mm');
    stack.style.setProperty('--photo-size', s.photoSize + 'mm');

    stack.setAttribute('data-template', s.template);
    stack.setAttribute('data-heading', s.heading);
    stack.setAttribute('data-bullet', s.bullet);
    // 打印分页策略：整模块不拆页（paginate 读取此属性）
    stack.setAttribute('data-keep-section', s.keepSection ? '1' : '0');
  }

  /* ---------------- 预览渲染 ---------------- */
  // 渲染合并：rAF 优先，同时用 setTimeout 兜底。
  // 理由：后台标签页 / 无刷新环境中 rAF 可能不触发，仅靠 rAF 会导致预览不更新。
  var previewPending = false;
  var previewRafId = null;
  var previewTimerId = null;

  function flushPreview() {
    if (!previewPending) return;
    previewPending = false;
    if (previewRafId) { window.cancelAnimationFrame(previewRafId); previewRafId = null; }
    if (previewTimerId) { window.clearTimeout(previewTimerId); previewTimerId = null; }
    renderPreview();
  }

  function renderPreview(force) {
    // 实时编辑会话期间冻结重绘，否则光标会随 DOM 重建而丢失
    if (!force && RS.inline && RS.inline.isActive()) return;

    // 自动排序：在渲染前就地重排 state，保证 data-edit-path 索引与数组一致
    if (RS.store.state.style.autoSort) RS.store.autoSortItems();

    var keepScroll = scrollEl ? scrollEl.scrollTop : 0;

    applyStyleVars();
    var blocks = RS.render.build(RS.store.state);
    var res = RS.paginate.run(blocks, stack);
    pageCount = res.pageCount;

    if (pageInfoEl) {
      pageInfoEl.textContent = '共 ' + pageCount + ' 页';
    }
    if (tplNameEl) {
      tplNameEl.textContent = RS.templates.get(RS.store.state.style.template).name;
    }

    applyZoom();

    if (scrollEl) scrollEl.scrollTop = keepScroll;
    if (RS.inline) RS.inline.afterRender();
    // 内容教练：量化覆盖与页数建议（渲染在预览栏，不进纸张）
    if (RS.coach) RS.coach.update();

    if (res.overflow) {
      if (!renderPreview._warned) {
        renderPreview._warned = true;
        var isTwoCol = RS.store.state.style.template === 'two-column';
        toast(isTwoCol
          ? '双栏模板建议单页内容，当前内容已溢出，建议精简或改用单栏模板'
          : '有条目超过一整页，建议拆分或精简内容', 'warn');
      }
    } else {
      renderPreview._warned = false;
    }
  }

  function schedulePreview() {
    if (previewPending) return;
    previewPending = true;
    previewRafId = window.requestAnimationFrame(flushPreview);
    previewTimerId = window.setTimeout(flushPreview, 60);
  }

  /* ---------------- 缩放 ---------------- */
  function applyZoom() {
    if (!stack) return;
    var rawW = stack.offsetWidth || 794;
    var rawH = stack.offsetHeight || 1123;

    stack.style.transform = 'translateX(-50%) scale(' + zoom + ')';

    holder.style.width = Math.round(rawW * zoom) + 'px';
    holder.style.height = Math.round(rawH * zoom) + 'px';

    if (zoomLabelEl) {
      zoomLabelEl.textContent = Math.round(zoom * 100) + '%';
    }
  }

  function computeFit() {
    if (!scrollEl) return 1;
    var avail = scrollEl.clientWidth - 56;
    var rawW = stack.offsetWidth || 794;
    var z = avail / rawW;
    return Math.max(0.35, Math.min(1.2, z));
  }

  function setZoom(next, manual) {
    // 缩放会改变文本命中坐标，先结束编辑会话更稳妥
    if (RS.inline && RS.inline.isActive()) RS.inline.exit();
    zoom = Math.max(0.3, Math.min(2, next));
    if (manual) zoomMode = 'manual';
    applyZoom();
  }

  /* ---------------- 导航 ---------------- */
  function renderNav() {
    if (!navScroll) return;
    var state = RS.store.state;
    var html = '';

    RS.editor.panels.forEach(function (group) {
      html += '<div class="nav-group"><div class="nav-group-label"><span>' +
        esc(group.group) + '</span></div>';

      group.items.forEach(function (item) {
        var badge = '';
        var off = '';

        if (item.id === 'profile') {
          badge = '';
        } else if (item.id === 'templates') {
          badge = '<span class="nv-badge">' + RS.templates.all().length + '</span>';
        } else if (item.id === 'order') {
          var visCount = 0;
          state.order.forEach(function (id) { if (state.visible[id]) visCount++; });
          badge = '<span class="nv-badge">' + visCount + '</span>';
        } else if (item.id === 'style' || item.id === 'export') {
          badge = '';
        } else if (state.data[item.id]) {
          var n = (state.data[item.id] || []).length;
          badge = '<span class="nv-badge">' + n + '</span>';
          if (!state.visible[item.id]) off = ' is-off';
        }

        html += '<button class="nav-item' + off +
          (item.id === currentPanelId ? ' active' : '') +
          '" data-panel="' + item.id + '" data-tip="' + esc(item.name) + '"' +
          ' title="' + esc(item.name) + '">' +
          '<i data-ico="' + item.icon + '"></i>' +
          '<span class="nv-label">' + esc(item.name) + '</span>' +
          badge +
        '</button>';
      });

      html += '</div>';
    });

    navScroll.innerHTML = html;
    RS.icons.hydrate(navScroll);
  }

  /* ---------------- 简历变体 ---------------- */
  function renderVariants() {
    var sel = document.getElementById('variantSelect');
    if (!sel || !RS.variants) return;

    var list = RS.variants.list();
    var active = RS.variants.active();

    sel.innerHTML = list.map(function (v) {
      return '<option value="' + U.escapeHtml(v.id) + '"' +
        (v.id === active ? ' selected' : '') + '>' + U.escapeHtml(v.name) + '</option>';
    }).join('');

    var del = document.querySelector('[data-act="variant-del"]');
    if (del) del.disabled = list.length <= 1;
  }

  function switchVariant(id) {
    if (!RS.variants) return;
    var list = RS.variants.list();
    var target = list.filter(function (v) { return v.id === id; })[0];
    if (!target) return;
    if (!RS.variants.switchTo(id)) return;

    RS.app.refreshAll();
    renderVariants();
    toast('已切换到「' + target.name + '」', 'ok');
  }

  /* ---------------- 面板 ---------------- */
  function renderPanel() {
    var state = RS.store.state;
    var meta = RS.editor.findPanel(currentPanelId);
    if (!meta) return;

    panelTitleEl.textContent = meta.name;
    panelDescEl.textContent = meta.desc;
    actionsEl.innerHTML = RS.editor.renderActions(currentPanelId, state);
    RS.icons.hydrate(actionsEl);

    bodyEl.innerHTML = RS.editor.render(currentPanelId, state);
    RS.icons.hydrate(bodyEl);

    if (currentPanelId === 'review' && RS.reviewer) RS.reviewer.afterRender();
    // 字段级实时提示（字数、手机/邮箱格式校验）
    if (RS.coach) RS.coach.syncFieldHints(bodyEl);
  }

  function refreshPanel(keepScroll) {
    var sc = keepScroll ? bodyEl.scrollTop : 0;
    renderPanel();
    if (keepScroll) bodyEl.scrollTop = sc;
  }

  function switchPanel(id) {
    // 「一键导入」不是编辑面板，而是打开导入向导
    if (id === 'import') {
      if (RS.importer && RS.importer.open) RS.importer.open();
      return;
    }

    if (currentPanelId === id) return;
    currentPanelId = id;

    var items = document.querySelectorAll('.nav-item');
    Array.prototype.forEach.call(items, function (el) {
      el.classList.toggle('active', el.getAttribute('data-panel') === id);
    });

    refreshPanel(false);
  }

  /* ---------------- 结构操作后统一提交 ---------------- */
  function commit(opts) {
    opts = opts || {};
    if (opts.panel) refreshPanel(true);
    if (opts.nav) renderNav();
    schedulePreview();
    RS.store.touch();
    // 结构操作完成后再入栈：快照必须是「操作后」的状态
    if (RS.history) RS.history.commit('op');
  }

  /* ---------------- 条目操作 ---------------- */
  function addItem(secId) {
    var def = RS.fieldDefs[secId];
    if (!def) return;
    snapshot();
    var item = def.blank();
    RS.store.state.data[secId].push(item);
    RS.editor.setCardOpen(item.id, true);
    if (!RS.store.state.visible[secId]) {
      RS.store.state.visible[secId] = true;
    }
    commit({ panel: true, nav: true });
    // 滚动到新卡片
    setTimeout(function () {
      var cards = bodyEl.querySelectorAll('.card');
      if (cards.length) {
        cards[cards.length - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }, 60);
  }

  function delItem(secId, idx) {
    var list = RS.store.state.data[secId];
    if (!list || !list[idx]) return;
    snapshot();
    var removed = list.splice(idx, 1)[0];
    commit({ panel: true, nav: true });
    toast('已删除「' + (RS.fieldDefs[secId].title(removed) || '条目') + '」，可按 Ctrl+Z 撤销', 'ok');
  }

  function dupItem(secId, idx) {
    var list = RS.store.state.data[secId];
    if (!list || !list[idx]) return;
    snapshot();
    var copy = U.clone(list[idx]);
    copy.id = U.uid();
    list.splice(idx + 1, 0, copy);
    RS.editor.setCardOpen(copy.id, true);
    commit({ panel: true, nav: true });
  }

  function moveItem(secId, idx, dir) {
    var list = RS.store.state.data[secId];
    if (!list) return;
    var target = idx + dir;
    if (target < 0 || target >= list.length) return;
    snapshot();
    var tmp = list[idx];
    list[idx] = list[target];
    list[target] = tmp;
    commit({ panel: true, nav: true });
  }

  function moveModule(secId, dir) {
    var order = RS.store.state.order;
    var idx = order.indexOf(secId);
    var target = idx + dir;
    if (idx < 0 || target < 0 || target >= order.length) return;
    snapshot();
    order.splice(idx, 1);
    order.splice(target, 0, secId);
    commit({ panel: true, nav: true });
  }

  /* ---------------- 照片 ---------------- */
  function compressImage(file, maxWidth, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var w = img.width;
        var h = img.height;
        if (!w || !h) { toast('图片尺寸异常', 'err'); return; }
        if (w > maxWidth) {
          h = Math.round(h * maxWidth / w);
          w = maxWidth;
        }
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        try {
          cb(canvas.toDataURL('image/jpeg', 0.86));
        } catch (err) {
          toast('图片处理失败', 'err');
        }
      };
      img.onerror = function () { toast('图片读取失败', 'err'); };
      img.src = String(e.target.result);
    };
    reader.onerror = function () { toast('文件读取失败', 'err'); };
    reader.readAsDataURL(file);
  }

  /* ---------------- 全局动作 ---------------- */
  function handleAction(act, el) {
    var state = RS.store.state;
    var secId = el.getAttribute('data-sec');
    var idx = parseInt(el.getAttribute('data-idx'), 10);

    switch (act) {
      /* 结构 */
      case 'add-item': addItem(secId); break;
      case 'del-item': delItem(secId, idx); break;
      case 'dup-item': dupItem(secId, idx); break;
      case 'move-up': moveItem(secId, idx, -1); break;
      case 'move-down': moveItem(secId, idx, 1); break;
      case 'move-module': moveModule(secId, parseInt(el.getAttribute('data-dir'), 10)); break;

      case 'toggle-card': {
        var card = el.closest('.card');
        if (!card) break;
        var open = !card.classList.contains('open');
        card.classList.toggle('open', open);
        RS.editor.setCardOpen(card.getAttribute('data-id'), open);
        break;
      }

      case 'toggle-vis': {
        snapshot();
        state.visible[secId] = !state.visible[secId];
        commit({ panel: true, nav: true });
        break;
      }

      /* 模板 */
      case 'set-template': {
        var tplId = el.getAttribute('data-tpl');
        if (state.style.template === tplId) break;
        snapshot();
        RS.templates.applyTo(state.style, tplId);
        commit({ panel: true, nav: true });
        toast('已切换为「' + RS.templates.get(tplId).name + '」', 'ok');
        break;
      }

      case 'apply-tpl-accent': {
        state.style.accent = el.getAttribute('data-color');
        commit({ panel: true });
        break;
      }

      /* 样式 */
      case 'set-swatch': {
        state.style.accent = el.getAttribute('data-val');
        commit({ panel: true });
        break;
      }
      case 'set-font': {
        state.style.font = el.getAttribute('data-val');
        commit({ panel: true });
        break;
      }
      case 'set-heading': {
        state.style.heading = el.getAttribute('data-val');
        commit({ panel: true });
        break;
      }
      case 'set-photo-shape': {
        state.style.photoShape = el.getAttribute('data-val');
        commit({ panel: true });
        break;
      }
      case 'set-bullet': {
        state.style.bullet = el.getAttribute('data-val');
        commit({ panel: true });
        break;
      }
      case 'set-skill-style': {
        state.style.skillStyle = el.getAttribute('data-val');
        commit({ panel: true });
        break;
      }
      case 'set-cert-cols': {
        state.style.certCols = parseInt(el.getAttribute('data-val'), 10);
        commit({ panel: true });
        break;
      }
      case 'set-keep-section': {
        state.style.keepSection = el.getAttribute('data-val') === '1';
        commit({ panel: true });
        break;
      }
      case 'variant-add': {
        if (!RS.variants) break;
        var defName = '变体 ' + (RS.variants.count() + 1);
        var inputName = defName;
        try {
          var asked = window.prompt('新变体名称（如：英文版 / 技术岗）', defName);
          if (asked === null) break;
          if (String(asked).trim()) inputName = String(asked).trim();
        } catch (e) { /* 环境不支持 prompt 时用默认名 */ }
        RS.variants.add(inputName);
        RS.app.refreshAll();
        renderVariants();
        toast('已创建变体「' + inputName + '」，当前内容已复制一份', 'ok');
        break;
      }
      case 'variant-del': {
        if (!RS.variants) break;
        var cnt = RS.variants.count();
        if (cnt <= 1) {
          toast('至少要保留一个变体', 'warn');
          break;
        }
        var curName = (RS.variants.list().filter(function (v) {
          return v.id === RS.variants.active();
        })[0] || {}).name || '当前变体';
        if (!window.confirm('删除变体「' + curName + '」？该变体的内容将一并删除，且不可撤销。')) break;
        RS.variants.remove(RS.variants.active());
        RS.app.refreshAll();
        renderVariants();
        toast('已删除变体', 'ok');
        break;
      }
      case 'toggle-ui-theme': {
        var isLight = document.documentElement.getAttribute('data-ui-theme') === 'light';
        applyUiTheme(isLight ? 'dark' : 'light');
        break;
      }
      case 'set-grayscale': {
        var gray = el.getAttribute('data-val') === '1';
        document.documentElement.classList.toggle('ui-grayscale', gray);
        try {
          window.localStorage.setItem('resume-studio:ui:grayscale', gray ? '1' : '0');
        } catch (e) { /* 忽略 */ }
        commit({ panel: true });
        break;
      }
      case 'set-auto-sort': {
        state.style.autoSort = el.getAttribute('data-val') === '1';
        if (state.style.autoSort) RS.store.autoSortItems();
        commit({ panel: true });
        break;
      }
      case 'reset-style': {
        snapshot();
        var tpl = state.style.template;
        state.style = RS.store.blankDoc().style;
        state.style.template = tpl;
        commit({ panel: true, nav: true });
        toast('排版设置已恢复默认', 'ok');
        break;
      }

      /* 照片 */
      case 'pick-photo': {
        var input = $('photoInput');
        if (input) input.click();
        break;
      }
      case 'remove-photo': {
        snapshot();
        state.profile.photo = '';
        commit({ panel: true });
        break;
      }

      /* 输出 */
      case 'print': RS.exporter.print(stack); break;
      case 'export-html': RS.exporter.exportHTML(stack, state); break;
      case 'export-html-ats': {
        RS.exporter.exportHTML(stack, state, { ats: true });
        break;
      }
      case 'export-md': RS.exporter.exportMarkdown(state); break;
      case 'export-doc': RS.exporter.exportDoc(stack, state); break;
      case 'export-text': RS.exporter.exportText(state); break;
      case 'export-json': RS.exporter.exportJSON(state); break;
      case 'import': {
        var fi = $('fileInput');
        if (fi) fi.click();
        break;
      }

      /* 数据管理 */
      case 'load-sample': {
        snapshot();
        RS.store.loadSample();
        RS.app.refreshAll();
        toast('已载入示例内容', 'ok');
        break;
      }
      case 'clear-all': {
        snapshot();
        RS.store.clearAll();
        RS.app.refreshAll();
        toast('已清空，可按 Ctrl+Z 撤销', 'ok');
        break;
      }

      /* 历史 */
      case 'undo': undo(); break;
      case 'redo': redo(); break;

      /* 实时编辑 */
      case 'exit-inline': {
        if (RS.inline) RS.inline.exit();
        break;
      }

      default:
        break;
    }
  }

  /* ---------------- 输入处理 ---------------- */
  function handleInput(target) {
    var path = target.getAttribute && target.getAttribute('data-path');
    if (!path) return;

    var state = RS.store.state;
    var value;

    if (target.type === 'checkbox') {
      value = target.checked;
    } else if (target.type === 'range') {
      value = parseFloat(target.value);
    } else {
      value = target.value;
    }

    U.setPath(state, path, value);

    // 滑块数值回显
    if (target.type === 'range') {
      var out = bodyEl.querySelector('[data-out="' + path + '"]');
      if (out) {
        out.textContent = value + (UNIT_MAP[path] || '');
      }
    }

    // 可见性开关需要同步文案与导航
    if (path.indexOf('visible.') === 0) {
      snapshot('toggle-visible');
      var line = target.closest('.switch-line');
      if (line) {
        var txt = line.querySelector('span:last-child');
        if (txt) txt.textContent = value ? '已显示' : '已隐藏';
      }
      commit({ nav: true });
      return;
    }

    // 卡片标题随主字段同步
    if (path.indexOf('data.') === 0) {
      RS.editor.refreshCardTitles(bodyEl, state);
    }

    // 模块改名时同步左侧导航文字（不重建面板，避免焦点丢失）
    if (path.indexOf('titles.') === 0) {
      renderNav();
    }

    schedulePreview();
    RS.store.touch();
    // 连续输入合并为一步历史（500ms 防抖）
    if (RS.history) RS.history.commitLater('input');
  }

  /* ---------------- 事件绑定 ---------------- */
  function bindEvents() {
    // 点击（全局委托）
    document.addEventListener('click', function (e) {
      var actEl = e.target.closest ? e.target.closest('[data-act]') : null;
      if (actEl) {
        e.preventDefault();
        handleAction(actEl.getAttribute('data-act'), actEl);
        return;
      }

      var panelEl = e.target.closest ? e.target.closest('[data-panel]') : null;
      if (panelEl) {
        switchPanel(panelEl.getAttribute('data-panel'));
        return;
      }

      var zoomEl = e.target.closest ? e.target.closest('[data-zoom]') : null;
      if (zoomEl) {
        var mode = zoomEl.getAttribute('data-zoom');
        if (mode === 'in') setZoom(zoom + 0.1, true);
        else if (mode === 'out') setZoom(zoom - 0.1, true);
        else {
          zoomMode = 'fit';
          setZoom(computeFit(), false);
        }
        return;
      }
    });

    // 输入
    document.addEventListener('input', function (e) {
      var t = e.target;
      if (t && t.getAttribute && t.getAttribute('data-path')) {
        handleInput(t);
      }
    });

    // 快捷键
    document.addEventListener('keydown', function (e) {
      var mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      var tag = (e.target.tagName || '').toLowerCase();
      var isField = tag === 'input' || tag === 'textarea' || tag === 'select';

      if (e.key === 's' || e.key === 'S') {
        e.preventDefault();
        RS.store.saveNow();
        toast('已保存到本机', 'ok');
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        RS.exporter.print(stack);
      } else if ((e.key === 'z' || e.key === 'Z') && !isField) {
        // 实时编辑会话中交给浏览器原生撤销（粒度更细，且不会打断输入）
        if (RS.inline && RS.inline.isActive()) return;
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
      } else if ((e.key === 'y' || e.key === 'Y') && !isField) {
        if (RS.inline && RS.inline.isActive()) return;
        e.preventDefault();
        redo();
      }
    });

    // 预览区 Ctrl + 滚轮缩放
    scrollEl.addEventListener('wheel', function (e) {
      if (!(e.ctrlKey || e.metaKey)) return;
      e.preventDefault();
      setZoom(zoom + (e.deltaY > 0 ? -0.06 : 0.06), true);
    }, { passive: false });

    // 窗口尺寸变化
    var onResize = U.debounce(function () {
      if (zoomMode === 'fit') {
        setZoom(computeFit(), false);
      } else {
        applyZoom();
      }
    }, 120);
    window.addEventListener('resize', onResize);

    // 文件选择
    var fi = $('fileInput');
    if (fi) {
      fi.addEventListener('change', function () {
        var file = this.files && this.files[0];
        if (!file) return;
        RS.exporter.importJSON(file, function (err, doc) {
          if (err) {
            toast('导入失败：' + err.message, 'err');
            return;
          }
          RS.store.replace(doc);
          // 导入是新文档起点：清空历史，避免撤销到上一份简历
          if (RS.history) RS.history.clear('import');
          RS.app.refreshAll();
          toast('导入成功', 'ok');
        });
        this.value = '';
      });
    }

    var pi = $('photoInput');
    if (pi) {
      pi.addEventListener('change', function () {
        var file = this.files && this.files[0];
        if (!file) return;
        if (!/^image\//.test(file.type)) {
          toast('请选择图片文件', 'err');
          this.value = '';
          return;
        }
        snapshot();
        // 统一走裁剪器：拖拽 + 缩放 + 底色 + 亮度对比度，输出 480×640
        if (RS.photo) {
          RS.photo.open(file, function (dataUrl, kb) {
            RS.store.state.profile.photo = dataUrl;
            commit({ panel: true });
            toast('照片已添加（约 ' + kb + ' KB）', 'ok');
          });
        } else {
          compressImage(file, 480, function (dataUrl) {
            RS.store.state.profile.photo = dataUrl;
            commit({ panel: true });
            toast('照片已添加', 'ok');
          });
        }
        this.value = '';
      });
    }

    // 变体切换
    var variantSel = document.getElementById('variantSelect');
    if (variantSel) {
      variantSel.addEventListener('change', function () {
        switchVariant(this.value);
      });
    }

    // 存储事件
    RS.bus.on('doc:saving', function () { updateSaveLine('saving'); });
    RS.bus.on('doc:saved', function () { updateSaveLine('saved'); });
    RS.bus.on('doc:savefail', function () {
      updateSaveLine('saved');
      toast('本地保存失败，请尽快导出 JSON 备份', 'err');
    });

    // 历史栈变化 -> 同步按钮可用状态
    RS.bus.on('history:change', syncHistoryButtons);
    RS.bus.on('doc:replaced', syncHistoryButtons);
  }

  /* ---------------- 对外接口 ---------------- */
  RS.app = {
    toast: toast,
    snapshot: snapshot,
    currentPanel: function () { return currentPanelId; },
    /** 重建当前面板（供评测等子模块刷新自身视图） */
    refreshPanel: function () { refreshPanel(true); },
    pageCount: function () { return pageCount; },
    commit: commit,

    /** 结构整体变化后全量刷新 */
    refreshAll: function () {
      renderVariants();
      renderNav();
      refreshPanel(false);
      renderPreview(true);
    },

    /** 强制重绘（跳过编辑会话的冻结判断），供退出编辑、拖动排序后调用 */
    renderPreviewForce: function () {
      previewPending = false;
      if (previewRafId) { window.cancelAnimationFrame(previewRafId); previewRafId = null; }
      if (previewTimerId) { window.clearTimeout(previewTimerId); previewTimerId = null; }
      renderPreview(true);
    },

    init: function () {
      stack = $('paperStack');
      holder = $('zoomHolder');
      scrollEl = $('previewScroll');
      bodyEl = $('panelBody');
      actionsEl = $('panelActions');
      navScroll = $('navScroll');
      panelTitleEl = $('panelTitle');
      panelDescEl = $('panelDesc');
      pageInfoEl = $('pageInfo');
      tplNameEl = $('tplName');
      zoomLabelEl = $('zoomLabel');
      saveDotEl = $('saveDot');
      saveTextEl = $('saveText');

      // 0. 恢复界面主题（尽早应用，避免首屏闪白）
      restoreUiTheme();

      // 1. 载入数据
      RS.store.load();

      // 2. 首屏骨架
      renderVariants();
      renderNav();
      refreshPanel(false);
      applyStyleVars();
      renderPreview();

      // 3. 适应宽度
      zoom = computeFit();
      setZoom(zoom, false);
      zoomMode = 'fit';

      // 4. 事件
      bindEvents();
      updateSaveLine('saved');
      syncHistoryButtons();

      // 5. 实时编辑会话（双击纸张进入）
      if (RS.inline) {
        RS.inline.init({
          stack: stack,
          editBar: $('editBar'),
          scroller: scrollEl
        });
      }

      isBooting = false;

      // 6. 首次使用提示
      if (RS.store.firstRun) {
        setTimeout(function () {
          toast('已载入示例内容，可直接修改或清空后重新填写', 'info');
        }, 600);
      }

      console.log('[履历工坊] 就绪 · 纯离线运行 · 版本 1.0');
    }
  };

  /* ---------------- 启动 ---------------- */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { RS.app.init(); });
  } else {
    RS.app.init();
  }

})(window);

</script>
<script>
/* ==== coach.js ==== */
/* ==================================================================
   内容教练（Content Coach）
   ------------------------------------------------------------------
   职责：在编辑过程中给出「怎么写更好」的轻量引导，而不是排完版才
        发现内容空洞。全部为建议语气，不阻断任何操作。

   包含：
     1. 量化覆盖率（多少条要点含数字成果）
     2. 页数建议（按身份 / 工作年限）
     3. 可精简模块建议（点击可跳转）
     4. 字段级实时提示（简介字数、手机与邮箱格式）

   红线：所有提示都渲染在 .preview-bar 与 .editor 内，
        绝不进入 .paper，因此无需在导出时剥离。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;

  var SENIORITY = {
    'fresh': { label: '应届', max: 1, tip: '应届简历建议控制在 1 页' },
    '1-3': { label: '1–3 年', max: 1, tip: '1–3 年经验建议 1 页，最多 2 页' },
    '3-5': { label: '3–5 年', max: 2, tip: '3–5 年经验建议 2 页以内' },
    '5+': { label: '5 年以上', max: 2, tip: '5 年以上可用 2 页' }
  };

  var SUMMARY_MAX = 120;
  var SUMMARY_MIN = 40;

  var chipsEl = null;
  var popEl = null;

  /* ---------------- 计算 ---------------- */

  function quantify() {
    return U.quantifyStats(RS.store.state);
  }

  function pageAdvice(pages) {
    var s = RS.store.state.profile.seniority;
    var rule = SENIORITY[s];
    if (!rule) return null;
    if (pages <= rule.max) return null;
    return { rule: rule, pages: pages, over: pages - rule.max };
  }

  /** 按内容体量倒序列出模块，作为「可精简」候选 */
  function shrinkCandidates() {
    var st = RS.store.state;
    var list = [];

    ['custom', 'projects', 'experience', 'education', 'certificates', 'languages', 'skills'].forEach(function (k) {
      var arr = st.data[k] || [];
      if (!arr.length) return;
      var chars = 0;
      arr.forEach(function (it) {
        chars += String(it.bullets || '').length + String(it.desc || '').length +
          String(it.school || it.company || it.name || it.title || '').length;
      });
      list.push({
        id: k,
        name: st.titles[k] || k,
        count: arr.length,
        chars: chars
      });
    });

    list.sort(function (a, b) { return b.chars - a.chars; });
    return list;
  }

  /* ---------------- 徽章 ---------------- */

  function ensureChips() {
    var meta = document.querySelector('.preview-bar .preview-meta');
    if (!meta) return null;
    if (chipsEl && meta.contains(chipsEl)) return chipsEl;

    chipsEl = document.getElementById('coachChips');
    if (!chipsEl) {
      chipsEl = document.createElement('span');
      chipsEl.id = 'coachChips';
      chipsEl.className = 'coach-chips';
      chipsEl.addEventListener('click', function (e) {
        var chip = e.target.closest('[data-coach]');
        if (chip) togglePopover(chip.getAttribute('data-coach'));
      });
      meta.appendChild(chipsEl);
    }
    return chipsEl;
  }

  function update() {
    var box = ensureChips();
    if (!box) return;

    var q = quantify();
    var pages = (RS.app && RS.app.pageCount) ? RS.app.pageCount() : 1;
    var advice = pageAdvice(pages);

    var html = '';

    /* 量化覆盖 */
    if (q.total > 0) {
      var rate = Math.round(q.rate * 100);
      var tone = rate >= 50 ? 'good' : rate >= 25 ? 'warn' : 'low';
      html += '<button class="coach-chip ' + tone + '" data-coach="quant" ' +
        'title="要点中含量化成果的比例">量化 ' + q.hit + '/' + q.total + '</button>';
    }

    /* 页数建议 */
    if (advice) {
      html += '<button class="coach-chip warn" data-coach="pages" ' +
        'title="' + advice.rule.tip + '">' +
        pages + ' 页 · ' + advice.rule.label + '建议 ' + advice.rule.max + ' 页</button>';
    }

    box.innerHTML = html;
    if (!html) box.style.display = 'none';
    else box.style.display = '';
  }

  /* ---------------- 建议面板 ---------------- */

  function closePopover() {
    if (popEl) {
      popEl.remove();
      popEl = null;
    }
  }

  function togglePopover(kind) {
    if (popEl && popEl.getAttribute('data-kind') === kind) {
      closePopover();
      return;
    }
    closePopover();

    var q = quantify();
    var pages = (RS.app && RS.app.pageCount) ? RS.app.pageCount() : 1;
    var advice = pageAdvice(pages);

    popEl = document.createElement('div');
    popEl.className = 'coach-pop';
    popEl.setAttribute('data-kind', kind);
    popEl.innerHTML = kind === 'quant' ? quantPopHTML(q) : pagesPopHTML(pages, advice);

    var preview = document.querySelector('.preview');
    if (!preview) return;
    preview.appendChild(popEl);

    popEl.addEventListener('click', function (e) {
      var item = e.target.closest('[data-goto]');
      if (item) {
        var id = item.getAttribute('data-goto');
        var nav = document.querySelector('[data-panel="' + id + '"]');
        if (nav) nav.click();
        closePopover();
        return;
      }
      if (e.target.closest('[data-close-coach]')) closePopover();
    });

    // 点外部关闭
    setTimeout(function () {
      document.addEventListener('pointerdown', onOutside, true);
    }, 0);
  }

  function onOutside(e) {
    if (!popEl) {
      document.removeEventListener('pointerdown', onOutside, true);
      return;
    }
    if (e.target.closest('.coach-pop') || e.target.closest('#coachChips')) return;
    closePopover();
    document.removeEventListener('pointerdown', onOutside, true);
  }

  function quantPopHTML(q) {
    var list = [];
    Object.keys(q.byItem).forEach(function (key) {
      var v = q.byItem[key];
      if (!v.total) return;
      if (v.hit >= v.total) return;
      var parts = key.split(':');
      var sec = parts[0], idx = parseInt(parts[1], 10);
      var st = RS.store.state;
      var item = (st.data[sec] || [])[idx];
      if (!item) return;
      var name = item.company || item.name || item.title || (st.titles[sec] || sec);
      list.push({ sec: sec, name: name, hit: v.hit, total: v.total });
    });

    var body = list.length
      ? '<ul class="coach-list">' + list.slice(0, 6).map(function (x) {
          return '<li data-goto="' + x.sec + '">' +
            '<b>' + U.escapeHtml(x.name) + '</b>' +
            '<span>' + x.hit + ' / ' + x.total + ' 条含量化</span>' +
          '</li>';
        }).join('') + '</ul>'
      : '<p class="coach-empty">所有要点都含量化成果，写得很扎实。</p>';

    return '' +
      '<div class="coach-pop-head">' +
        '<b>量化覆盖 ' + q.hit + ' / ' + q.total + ' 条</b>' +
        '<button class="coach-x" data-close-coach title="关闭">×</button>' +
      '</div>' +
      '<p class="coach-tip">建议写成「做了什么 + 使什么指标从 X 到 Y」。下面这些条目还可以补上数字：</p>' +
      body;
  }

  function pagesPopHTML(pages, advice) {
    var cands = shrinkCandidates();
    var rule = advice ? advice.rule : null;

    var list = cands.slice(0, 4).map(function (c) {
      return '<li data-goto="' + c.id + '">' +
        '<b>' + U.escapeHtml(c.name) + '</b>' +
        '<span>' + c.count + ' 条 · 约 ' + c.chars + ' 字</span>' +
      '</li>';
    }).join('');

    return '' +
      '<div class="coach-pop-head">' +
        '<b>当前 ' + pages + ' 页</b>' +
        '<button class="coach-x" data-close-coach title="关闭">×</button>' +
      '</div>' +
      (rule
        ? '<p class="coach-tip">' + U.escapeHtml(rule.label) + '简历' +
          (rule.max === 1 ? '通常 1 页最合适' : '建议 2 页以内') +
          '。可以从内容最厚的模块开始精简：</p>'
        : '<p class="coach-tip">可以从内容最厚的模块开始精简：</p>') +
      '<ul class="coach-list">' + list + '</ul>' +
      '<p class="coach-foot">这只是建议，不影响导出。</p>';
  }

  /* ---------------- 字段级提示 ---------------- */

  var PHONE_RE = /^1[3-9]\d{9}$/;
  var MAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  function syncFieldHints(root) {
    if (!root) return;

    /* 简介字数 */
    var counters = root.querySelectorAll('[data-count-for="profile.summary"]');
    Array.prototype.forEach.call(counters, function (el) {
      var len = String(RS.store.state.profile.summary || '').replace(/\s/g, '').length;
      var tone = '';
      var note = '';
      if (len === 0) {
        note = '建议 60–' + SUMMARY_MAX + ' 字';
      } else if (len < SUMMARY_MIN) {
        tone = ' is-warn';
        note = len + ' / ' + SUMMARY_MAX + ' 字 · 偏短，可再补一句成果';
      } else if (len > SUMMARY_MAX) {
        tone = ' is-warn';
        note = len + ' / ' + SUMMARY_MAX + ' 字 · 偏长，建议压缩';
      } else {
        note = len + ' / ' + SUMMARY_MAX + ' 字';
      }
      el.textContent = note;
      el.className = 'sect-note' + tone;
    });

    /* 手机号 */
    var phoneEls = root.querySelectorAll('[data-validate="profile.phone"]');
    Array.prototype.forEach.call(phoneEls, function (el) {
