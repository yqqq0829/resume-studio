        'body{' + vars + 'font-family:"Microsoft YaHei","PingFang SC",sans-serif;margin:0;}\n' +
        /* Word 对固定 mm 宽高的支持有限：改为自适应宽度，页面尺寸交给 @page */
        '.paper{width:auto !important;min-height:0 !important;padding:0 !important;' +
        'margin:0 !important;box-shadow:none !important;border-radius:0 !important;}\n' +
        css + '\n' +
        '</style>\n</head>\n<body>\n' + body + '\n</body>\n</html>';

      download(html, '简历-' + name + '-' + stamp() + '.doc', 'application/msword');
      RS.store.recordBackup();
      RS.app.toast('Word 文档已导出（.doc 兼容格式，复杂排版可能简化）', 'ok');
    },

    /* ---------------- 纯文本（ATS 友好） ---------------- */
    buildPlainText: function (state) {
      var p = state.profile;
      var L = [];

      if (p.name) L.push(p.name);
      if (p.title) L.push(p.title);
      var contact = [p.phone, p.email, p.city, p.website, p.github, p.wechat].filter(Boolean);
      if (contact.length) L.push(contact.join(' | '));
      L.push('');

      state.order.forEach(function (id) {
        if (!state.visible[id]) return;

        if (id === 'summary') {
          if (!p.summary || !p.summary.trim()) return;
          L.push('【' + (state.titles.summary || '个人简介') + '】');
          L.push(p.summary.replace(/\*\*/g, ''));
          L.push('');
          return;
        }

        var items = state.data[id] || [];
        if (!items.length) return;
        L.push('【' + (state.titles[id] || id) + '】');

        items.forEach(function (it) {
          if (id === 'skills') {
            L.push('  ' + (it.name || '') + (it.group ? '（' + it.group + '）' : ''));
          } else if (id === 'certificates') {
            L.push('  ' + [it.name, it.issuer, U.fmtDate(it.date)].filter(Boolean).join(' · '));
          } else if (id === 'languages') {
            L.push('  ' + (it.name || '') + (it.level ? '：' + it.level : ''));
          } else {
            var head = it.company || it.name || it.title || it.school || '';
            var sub = it.role || it.major || it.sub || '';
            var time = U.fmtRange(it.start, it.end, it.current);
            L.push('  ' + [head, sub, time].filter(Boolean).join(' · '));
            var desc = String(it.desc || '').replace(/\*\*/g, '').trim();
            if (desc) L.push('    ' + desc);
            U.lines(it.bullets).forEach(function (b) {
              L.push('    - ' + b.replace(/\*\*/g, ''));
            });
          }
        });
        L.push('');
      });

      return L.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    },

    exportText: function (state) {
      var txt = exporter.buildPlainText(state);
      if (!txt) {
        RS.app.toast('当前没有可导出的内容', 'warn');
        return;
      }
      download(txt, '简历-' + safeName(state.profile.name, '简历') + '-' + stamp() + '.txt', 'text/plain');
      RS.store.recordBackup();
      RS.app.toast('纯文本已导出', 'ok');
    },

    /* ---------------- Markdown ---------------- */
    exportMarkdown: function (state) {
      var p = state.profile;
      var L = [];

      L.push('# ' + (p.name || '姓名'));
      if (p.title) L.push('**' + p.title + '**');
      L.push('');

      var contact = [p.phone, p.email, p.city, p.website, p.github].filter(Boolean);
      if (contact.length) {
        L.push(contact.join(' | '));
        L.push('');
      }

      function sectionTitle(id) {
        if (!state.visible[id]) return null;
        return state.titles[id] || '';
      }

      state.order.forEach(function (id) {
        if (!state.visible[id]) return;

        if (id === 'summary') {
          if (!p.summary || !p.summary.trim()) return;
          L.push('## ' + (state.titles.summary || '个人简介'));
          L.push('');
          L.push(p.summary.replace(/\*\*/g, ''));
          L.push('');
          return;
        }

        var items = state.data[id] || [];
        if (!items.length) return;
        var t = sectionTitle(id);
        if (!t) return;

        L.push('## ' + t);
        L.push('');

        items.forEach(function (it) {
          if (id === 'education') {
            L.push('### ' + (it.school || '') + (it.degree ? '（' + it.degree + '）' : ''));
            var meta = [];
            if (it.major) meta.push(it.major);
            if (it.city) meta.push(it.city);
            if (it.gpa) meta.push('GPA ' + it.gpa);
            var rng = U.fmtRange(it.start, it.end, it.current);
            if (rng) meta.push(rng);
            if (meta.length) L.push(meta.join(' · '));
            if (it.courses) L.push('主修课程：' + it.courses);
            if (it.desc) L.push(it.desc.replace(/\*\*/g, ''));
            L.push('');
          } else if (id === 'experience') {
            L.push('### ' + (it.company || '') + (it.role ? ' — ' + it.role : ''));
            var meta2 = [];
            if (it.city) meta2.push(it.city);
            var rng2 = U.fmtRange(it.start, it.end, it.current);
            if (rng2) meta2.push(rng2);
            if (meta2.length) L.push(meta2.join(' · '));
            if (it.desc) L.push(it.desc.replace(/\*\*/g, ''));
            U.lines(it.bullets).forEach(function (b) {
              L.push('- ' + b.replace(/\*\*/g, ''));
            });
            L.push('');
          } else if (id === 'projects') {
            L.push('### ' + (it.name || '') + (it.role ? ' — ' + it.role : ''));
            var meta3 = [];
            if (it.tech) meta3.push(it.tech);
            if (it.link) meta3.push(it.link);
            var rng3 = U.fmtRange(it.start, it.end, it.current);
            if (rng3) meta3.push(rng3);
            if (meta3.length) L.push(meta3.join(' · '));
            if (it.desc) L.push(it.desc.replace(/\*\*/g, ''));
            U.lines(it.bullets).forEach(function (b) {
              L.push('- ' + b.replace(/\*\*/g, ''));
            });
            L.push('');
          } else if (id === 'skills') {
            L.push('- ' + (it.group ? it.group + '：' : '') + (it.name || ''));
          } else if (id === 'certificates') {
            L.push('- ' + [it.name, it.issuer, U.fmtDate(it.date)].filter(Boolean).join(' · '));
          } else if (id === 'languages') {
            L.push('- ' + (it.name || '') + (it.level ? '：' + it.level : ''));
          } else {
            L.push('### ' + (it.title || ''));
            if (it.sub) L.push(it.sub);
            if (it.desc) L.push(it.desc.replace(/\*\*/g, ''));
            U.lines(it.bullets).forEach(function (b) {
              L.push('- ' + b.replace(/\*\*/g, ''));
            });
            L.push('');
          }
        });

        if (id === 'skills' || id === 'certificates' || id === 'languages') L.push('');
      });

      download(L.join('\n'), '简历-' + safeName(p.name, '简历') + '-' + stamp() + '.md', 'text/markdown');
      RS.app.toast('Markdown 已导出', 'ok');
    },

    /* ---------------- JSON ---------------- */
    exportJSON: function (state) {
      var payload = {
        _app: 'resume-studio',
        _version: 1,                          // 文件格式版本（向后兼容）
        schemaVersion: RS.store.schemaVersion, // 数据 schema 版本
        exportedAt: new Date().toISOString(),
        doc: state
      };
      download(JSON.stringify(payload, null, 2),
        '简历备份-' + safeName(state.profile.name, 'resume') + '-' + stamp() + '.json',
        'application/json');
      RS.store.recordBackup();
      RS.app.toast('JSON 备份已导出', 'ok');
    },

    importJSON: function (file, callback) {
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var raw = JSON.parse(String(reader.result));
          var doc = raw && raw.doc ? raw.doc : raw;
          if (!doc || typeof doc !== 'object' || !doc.profile || !doc.data) {
            throw new Error('文件结构不符合简历备份格式');
          }
          callback(null, doc);
        } catch (err) {
          callback(err);
        }
      };
      reader.onerror = function () {
        callback(new Error('文件读取失败'));
      };
      reader.readAsText(file, 'utf-8');
    }
  };

  /* ------------------------------------------------------------------
     打印钩子：覆盖「浏览器菜单 → 打印」这条不经过 print() 的路径。
     beforeprint 时若打印容器为空则自动填充；afterprint 统一清空，
     避免下次打印沿用旧快照。
     ------------------------------------------------------------------ */
  window.addEventListener('beforeprint', function () {
    var stack = document.getElementById('paperStack');
    if (stack) exporter.ensurePrintRoot(stack);
  });

  window.addEventListener('afterprint', function () {
    var root = document.getElementById('printRoot');
    if (root && root.children.length) root.innerHTML = '';
  });

})(window);

</script>
<script>
/* ==== inline-edit.js ==== */
/* ==================================================================
   实时编辑模式（Inline Editing）
   ------------------------------------------------------------------
   设计要点：
   1. 预览区每次渲染都是全量重建，若边输入边重绘，光标必然丢失。
      因此引入「编辑会话」：进入后冻结重绘，输入只回写 state，
      退出时统一重排分页并同步左侧表单。
   2. 双击纸张进入；Esc / 点击预览区外 / 点「完成」退出。
   3. 编辑态下模块标题左侧出现拖拽手柄，拖动时显示水平对齐参考线：
      线吸附到最近模块的顶/底边界，两端带端点标记与位置标签。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;

  var stack = null;
  var layer, hLine, hTag, edgeTop, edgeBottom, editBar;
  var active = false;
  var dirtyPaths = {};
  var drag = null;
  var dragRafId = null;
  var dragTimerId = null;
  var dragPending = false;
  var SNAP_PX = 9;

  /* ---------------- 工具 ---------------- */
  function qs(sel, root) { return (root || document).querySelector(sel); }

  /** DOM 节点 -> 纯文本，保留 ** 加粗语义与换行 */
  function nodeToText(node) {
    var out = '';
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var ch = kids[i];
      if (ch.nodeType === 3) {
        out += ch.nodeValue;
      } else if (ch.nodeType === 1) {
        var tag = ch.tagName;
        if (tag === 'BR') {
          out += '\n';
        } else if (tag === 'STRONG' || tag === 'B') {
          var inner = nodeToText(ch).trim();
          out += inner ? '**' + inner + '**' : '';
        } else if (tag === 'DIV' || tag === 'P' || tag === 'LI') {
          var t = nodeToText(ch);
          if (out && out.slice(-1) !== '\n') out += '\n';
          out += t;
        } else if (tag === 'SCRIPT' || tag === 'STYLE') {
          /* 忽略 */
        } else {
          out += nodeToText(ch);
        }
      }
    }
    return out;
  }

  /** 从可编辑元素中提取用于写回 state 的值 */
  function extractValue(node) {
    if (node.tagName === 'UL') {
      var lines = [];
      var lis = node.querySelectorAll('li');
      for (var i = 0; i < lis.length; i++) {
        var t = nodeToText(lis[i]).replace(/\u00a0/g, ' ').trim();
        if (t) lines.push(t);
      }
      return lines.join('\n');
    }
    var raw = nodeToText(node).replace(/\u00a0/g, ' ');
    if (node.hasAttribute('data-edit-multi')) {
      return raw.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    }
    return raw.replace(/\s+/g, ' ').trim();
  }

  function setEditable(on) {
    var nodes = stack.querySelectorAll('[data-edit-path]');
    for (var i = 0; i < nodes.length; i++) {
      if (on) {
        nodes[i].setAttribute('contenteditable', 'true');
        nodes[i].setAttribute('spellcheck', 'false');
      } else {
        nodes[i].removeAttribute('contenteditable');
        nodes[i].removeAttribute('spellcheck');
      }
    }
  }

  function focusNode(node) {
    try {
      node.focus({ preventScroll: true });
      var sel = window.getSelection();
      var range = document.createRange();
      range.selectNodeContents(node);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) { /* 忽略 */ }
  }

  /* ---------------- 覆盖层 ---------------- */
  function buildLayer() {
    layer = document.createElement('div');
    layer.className = 'align-layer';
    layer.innerHTML =
      '<div class="align-hline"><span class="align-tag"></span></div>' +
      '<div class="align-edge align-edge-top"></div>' +
      '<div class="align-edge align-edge-bottom"></div>';
    document.body.appendChild(layer);
    hLine = qs('.align-hline', layer);
    hTag = qs('.align-tag', layer);
    edgeTop = qs('.align-edge-top', layer);
    edgeBottom = qs('.align-edge-bottom', layer);
  }

  function paperRectAt(y) {
    var papers = stack.querySelectorAll('.paper');
    var best = null;
    var bestDist = Infinity;
    for (var i = 0; i < papers.length; i++) {
      var r = papers[i].getBoundingClientRect();
      if (y >= r.top && y <= r.bottom) return r;
      var d = y < r.top ? r.top - y : y - r.bottom;
      if (d < bestDist) { bestDist = d; best = r; }
    }
    return best;
  }

  function showHLine(y, label, snapped) {
    if (!layer) return;
    var pr = paperRectAt(y);
    if (!pr) return;
    var left = pr.left;
    var width = pr.width;

    hLine.style.left = left + 'px';
    hLine.style.width = width + 'px';
    hLine.style.top = y + 'px';
    hLine.classList.toggle('is-snapped', !!snapped);

    hTag.textContent = label || '';
    hTag.style.display = label ? 'block' : 'none';
    hLine.style.display = 'block';
  }

  function hideHLine() {
    if (hLine) hLine.style.display = 'none';
  }

  function showEdges(sectionId) {
    var mods = getModules();
    var list = mods.map[sectionId];
    if (!list || !list.length) return;

    var first = list[0].getBoundingClientRect();
    var last = list[list.length - 1].getBoundingClientRect();

    var pr = paperRectAt(first.top) || paperRectAt(last.bottom);
    if (!pr) return;

    edgeTop.style.left = pr.left + 'px';
    edgeTop.style.width = pr.width + 'px';
    edgeTop.style.top = first.top + 'px';
    edgeTop.style.display = 'block';

    edgeBottom.style.left = pr.left + 'px';
    edgeBottom.style.width = pr.width + 'px';
    edgeBottom.style.top = last.bottom + 'px';
    edgeBottom.style.display = 'block';
  }

  function hideEdges() {
    if (edgeTop) edgeTop.style.display = 'none';
    if (edgeBottom) edgeBottom.style.display = 'none';
  }

  /* ---------------- 模块聚合 ---------------- */
  function getModules() {
    var ids = [];
    var map = {};
    if (!stack) return { ids: ids, map: map };
    var nodes = stack.querySelectorAll('[data-module]');
    for (var i = 0; i < nodes.length; i++) {
      var m = nodes[i].getAttribute('data-module');
      if (!m || m === 'head') continue;
      if (!map[m]) { map[m] = []; ids.push(m); }
      map[m].push(nodes[i]);
    }
    return { ids: ids, map: map };
  }

  function highlightModule(sectionId, on) {
    if (!stack) return;
    var nodes = stack.querySelectorAll('[data-module="' + sectionId + '"]');
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].classList.toggle('is-module-active', !!on);
    }
  }

  /* ---------------- 插入位置计算 ---------------- */
  function computeInsert(pointerY, dragId) {
    var mods = getModules();
    var others = mods.ids.filter(function (id) { return id !== dragId; });
    var insertAt = others.length;
    var lineY = null;

    for (var i = 0; i < others.length; i++) {
      var firstEl = mods.map[others[i]][0];
      var r = firstEl.getBoundingClientRect();
      if (pointerY < r.top + Math.min(r.height / 2, 18)) {
        insertAt = i;
        lineY = r.top;
        break;
      }
    }

    if (lineY === null) {
      if (others.length) {
        var lastId = others[others.length - 1];
        var arr = mods.map[lastId];
        lineY = arr[arr.length - 1].getBoundingClientRect().bottom;
      } else {
        lineY = pointerY;
      }
    }

    /* 吸附：把线拉到最近的模块边界，实现精准对齐 */
    var snapY = lineY;
    var snapped = false;
    var snapLabel = '';

    mods.ids.forEach(function (id) {
      var arr = mods.map[id];
      [arr[0], arr[arr.length - 1]].forEach(function (node) {
        var r = node.getBoundingClientRect();
        [r.top, r.bottom].forEach(function (y) {
          if (Math.abs(y - lineY) <= SNAP_PX && Math.abs(y - lineY) < Math.abs(snapY - lineY)) {
            snapY = y;
            snapped = true;
            snapLabel = id;
          }
        });
      });
    });

    return {
      insertAt: insertAt,
      lineY: snapY,
      snapped: snapped,
      others: others,
      mods: mods
    };
  }

  function moduleName(id) {
    var st = RS.store.state;
    if (id === 'summary') return '个人简介';
    return (st.titles && st.titles[id]) || id;
  }

  /* ---------------- 拖拽 ---------------- */
  function onHandleDown(e) {
    if (!active) return;
    var handle = e.target.closest ? e.target.closest('[data-drag]') : null;
    if (!handle) return;
    var sectionId = handle.getAttribute('data-drag');
    if (!sectionId) return;

    e.preventDefault();
    e.stopPropagation();

    drag = {
      id: sectionId,
      startX: e.clientX,
      startY: e.clientY,
      lastY: e.clientY,
      moved: false
    };

    document.body.classList.add('is-dragging-module');
    highlightModule(sectionId, true);
    hideEdges();

    window.addEventListener('pointermove', onDragMove, { passive: false });
    window.addEventListener('pointerup', onDragUp);
    window.addEventListener('pointercancel', onDragUp);
  }

  /** 绘制拖动中的对齐参考线 */
  function renderDragLine() {
    if (!drag) return;
    var res = computeInsert(drag.lastY, drag.id);
    var label;
    if (res.insertAt < res.others.length) {
      label = '插入到「' + moduleName(res.others[res.insertAt]) + '」之前';
    } else {
      label = '移动到末尾';
    }
    if (res.snapped) label += ' · 已对齐';
    showHLine(res.lineY, label, res.snapped);
  }

  /** rAF 优先 + setTimeout 兜底，避免无刷新环境下参考线不出现 */
  function scheduleDragLine() {
    if (dragPending) return;
    dragPending = true;

    var run = function () {
      if (!dragPending) return;
      dragPending = false;
      if (dragRafId) { window.cancelAnimationFrame(dragRafId); dragRafId = null; }
      if (dragTimerId) { window.clearTimeout(dragTimerId); dragTimerId = null; }
      if (!drag) return;
      renderDragLine();
    };

    dragRafId = window.requestAnimationFrame(run);
    dragTimerId = window.setTimeout(run, 45);
  }

  function clearDragTimers() {
    dragPending = false;
    if (dragRafId) { window.cancelAnimationFrame(dragRafId); dragRafId = null; }
    if (dragTimerId) { window.clearTimeout(dragTimerId); dragTimerId = null; }
  }

  function onDragMove(e) {
    if (!drag) return;
    e.preventDefault();

    if (!drag.moved) {
      if (Math.abs(e.clientY - drag.startY) < 4 && Math.abs(e.clientX - drag.startX) < 4) return;
      drag.moved = true;
      var nodes = stack.querySelectorAll('[data-module="' + drag.id + '"]');
      for (var i = 0; i < nodes.length; i++) nodes[i].classList.add('is-dragging');
    }

    drag.lastY = e.clientY;
    scheduleDragLine();
  }

  function onDragUp(e) {
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragUp);
    window.removeEventListener('pointercancel', onDragUp);
    clearDragTimers();

    if (!drag) return;
    var d = drag;
    drag = null;

    document.body.classList.remove('is-dragging-module');
    document.body.classList.remove('is-dragging-pending');
    hideHLine();
    highlightModule(d.id, false);

    var nodes = stack.querySelectorAll('[data-module="' + d.id + '"]');
    for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove('is-dragging');

    if (!d.moved) return;

    var res = computeInsert(e.clientY, d.id);
    applyReorder(d.id, res.others, res.insertAt);
  }

  function applyReorder(dragId, others, insertAt) {
    var state = RS.store.state;
    var mods = getModules();
    var renderedIds = mods.ids.slice();

    var newVisible = others.slice();
    newVisible.splice(insertAt, 0, dragId);

    // 映射回 order：未在当前渲染中出现的模块（隐藏/无内容）保持原位置
    var vi = 0;
    var newOrder = [];
    state.order.forEach(function (id) {
      if (renderedIds.indexOf(id) >= 0) {
        newOrder.push(newVisible[vi++]);
      } else {
        newOrder.push(id);
      }
    });

    var changed = newOrder.some(function (v, i) { return v !== state.order[i]; });
    if (!changed) return;

    state.order = newOrder;
    RS.store.saveNow();
    RS.app.refreshAll();          // 重排分页
    RS.inline.afterRender();      // 重绘后恢复可编辑态
    RS.app.toast('模块顺序已调整', 'ok');
  }

  /* ---------------- 进入 / 退出 ---------------- */
  function showEditBar() {
    if (!editBar) return;
    editBar.classList.add('on');
  }

  function hideEditBar() {
    if (!editBar) return;
    editBar.classList.remove('on');
  }

  function enter(focusTarget) {
    if (active || !stack) return;
    active = true;

    document.body.classList.add('is-inline-editing');
    stack.classList.add('is-inline-editing');
    setEditable(true);
    showEditBar();

    var node = null;
    if (focusTarget && focusTarget.closest) {
      node = focusTarget.closest('[data-edit-path]');
    }
    if (node) focusNode(node);

    RS.app.toast('已进入实时编辑模式，按 Esc 退出', 'ok');
  }

  function exit() {
    if (!active) return;
    active = false;

    document.body.classList.remove('is-inline-editing');
    document.body.classList.remove('is-dragging-module');
    stack.classList.remove('is-inline-editing');
    hideEditBar();
    hideHLine();
    hideEdges();
    setEditable(false);

    // 同步左侧表单中被改动过的字段（不重建 DOM，避免打断后续点击）
    syncPanelFields();
    dirtyPaths = {};

    // 本次编辑会话合并为一步历史（输入过程中已同步 state）
    if (RS.history) RS.history.commit('inline-edit');

    // 强制重绘：重新分页
    if (RS.app && RS.app.renderPreviewForce) RS.app.renderPreviewForce();
  }

  /** 把预览里改过的值回填到左侧面板中已存在的输入框 */
  function syncPanelFields() {
    var state = RS.store.state;
    var changed = false;
    Object.keys(dirtyPaths).forEach(function (path) {
      var input = document.querySelector('#panelBody [data-path="' + path + '"]');
      if (!input) return;
      var val = U.getPath(state, path);
      if (input.type === 'checkbox') {
        input.checked = !!val;
      } else if (document.activeElement !== input) {
        input.value = val === undefined || val === null ? '' : val;
      }
      changed = true;
    });
    if (changed && RS.editor && RS.editor.refreshCardTitles) {
      RS.editor.refreshCardTitles(document.getElementById('panelBody'), state);
    }
  }

  /** 重绘后恢复可编辑态（拖动排序会触发重绘） */
  function afterRender() {
    if (!active) return;
    setEditable(true);
  }

  /* ---------------- 事件 ---------------- */
  function onStackDblClick(e) {
    if (active) return;              // 已在编辑中，交给浏览器默认选择行为
    // 拖拽手柄上双击不进入编辑
    if (e.target.closest && e.target.closest('.drag-handle')) return;
    e.preventDefault();
    enter(e.target);
  }

  function onInput(e) {
    if (!active) return;
    var node = e.target.closest ? e.target.closest('[data-edit-path]') : null;
    if (!node) return;

    var path = node.getAttribute('data-edit-path');
    var val = extractValue(node);
    U.setPath(RS.store.state, path, val);
    dirtyPaths[path] = 1;
    RS.store.save();                 // 防抖落盘，不触发预览重绘
  }

  function insertBreak(node) {
    var sel = window.getSelection();
    if (!sel || !sel.rangeCount) return;
    var range = sel.getRangeAt(0);
    range.deleteContents();
    var br = document.createElement('br');
    range.insertNode(br);
    range.setStartAfter(br);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    onInput({ target: node });
  }

  function onKeyDown(e) {
    if (!active) return;

    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      exit();
      return;
    }

    var node = e.target.closest ? e.target.closest('[data-edit-path]') : null;
    if (!node) return;

    if (e.key === 'Enter') {
      var isList = node.tagName === 'UL';
      var isMulti = node.hasAttribute('data-edit-multi');

      if (isList) return;                        // 列表内回车 = 新建一条

      if (isMulti && e.shiftKey) {               // 多行块内 Shift+Enter = 换行
        e.preventDefault();
        insertBreak(node);
        return;
      }

      e.preventDefault();                        // 其余情况回车 = 完成编辑
      node.blur();
      exit();
    }
  }

  function onPaste(e) {
    if (!active) return;
    var node = e.target.closest ? e.target.closest('[data-edit-path]') : null;
    if (!node) return;

    e.preventDefault();
    var cd = e.clipboardData || window.clipboardData;
    var text = cd ? cd.getData('text/plain') : '';
    text = String(text || '').replace(/\r/g, '');
    if (!node.hasAttribute('data-edit-multi') && node.tagName !== 'UL') {
      text = text.replace(/\s+/g, ' ').trim();
    }
    try {
      document.execCommand('insertText', false, text);
    } catch (err) {
      var sel = window.getSelection();
      if (sel.rangeCount) {
        var range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(document.createTextNode(text));
        range.collapse(false);
      }
      onInput({ target: node });
    }
  }

  function onOutsideDown(e) {
    if (!active) return;
    if (!e.target.closest) return;
    // 纸张内与编辑提示条内的点击不退出
    if (e.target.closest('.paper') || e.target.closest('.edit-bar')) return;
    exit();
  }

  function onHandleEnter(e) {
    if (!active || drag) return;
    var handle = e.target.closest ? e.target.closest('[data-drag]') : null;
    if (!handle) return;
    var id = handle.getAttribute('data-drag');
    if (!id) return;
    highlightModule(id, true);
    showEdges(id);
  }

  function onHandleLeave(e) {
    if (!active || drag) return;
    var handle = e.target.closest ? e.target.closest('[data-drag]') : null;
    if (!handle) return;
    var id = handle.getAttribute('data-drag');
    if (!id) return;
    highlightModule(id, false);
    hideEdges();
  }

  function onScrollOrResize() {
    if (!active) return;
    hideEdges();
    hideHLine();
  }

  /* ---------------- 对外接口 ---------------- */
  RS.inline = {
    isActive: function () { return active; },
    enter: enter,
    exit: exit,
    afterRender: afterRender,
    /** 退出前若有未同步内容，强制回写（供导出等场景调用） */
    flush: function () {
      if (!active) return;
      var focused = document.activeElement;
      if (focused && focused.getAttribute && focused.getAttribute('data-edit-path')) {
        onInput({ target: focused });
      }
    },

    init: function (opts) {
      stack = opts.stack;
      editBar = opts.editBar;

      buildLayer();

      stack.addEventListener('dblclick', onStackDblClick);
      stack.addEventListener('input', onInput);
      stack.addEventListener('paste', onPaste);
      stack.addEventListener('pointerdown', onHandleDown);
      stack.addEventListener('pointerover', onHandleEnter);
      stack.addEventListener('pointerout', onHandleLeave);

      // Esc 挂在 document 上：焦点不一定始终停在纸张内
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('pointerdown', onOutsideDown, true);

      var scroller = opts.scroller;
      if (scroller) {
        scroller.addEventListener('scroll', onScrollOrResize, { passive: true });
      }
      window.addEventListener('resize', onScrollOrResize);

      window.addEventListener('beforeprint', function () {
        if (active) RS.inline.flush();
      });
    }
  };

})(window);

</script>
<script>
/* ==== importer.js ==== */
/* ==================================================================
   一键导入（Import Wizard）
   ------------------------------------------------------------------
   支持格式：.docx / .txt / .md / .html / .json（本工具备份）
   全部在本地解析，零网络请求、零第三方库。

   流程：选择文件 → ① 选模板 → ② 选排版配色 → 导入
   解析原则：宁可结构化程度低，也不能丢内容。
   无法归属的文本统一落入「自定义模块」，由用户在编辑器里整理。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;
  var esc = U.escapeHtml;

  var MAX_BYTES = 10 * 1024 * 1024;

  /* ================================================================
     一、ZIP / DOCX 解析
     ================================================================ */

  function findEOCD(buf) {
    var min = Math.max(0, buf.length - 22 - 65535);
    for (var i = buf.length - 22; i >= min; i--) {
      if (buf[i] === 0x50 && buf[i + 1] === 0x4b && buf[i + 2] === 0x05 && buf[i + 3] === 0x06) {
        return i;
      }
    }
    return -1;
  }

  async function extractZipEntry(buf, wanted) {
    var eocd = findEOCD(buf);
    if (eocd < 0) throw new Error('不是有效的 DOCX（缺少 ZIP 结构）');

    var dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    var cdCount = dv.getUint16(eocd + 10, true);
    var cdOffset = dv.getUint32(eocd + 16, true);
    var p = cdOffset;

    for (var i = 0; i < cdCount; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;

      var method = dv.getUint16(p + 10, true);
      var compSize = dv.getUint32(p + 20, true);
      var nameLen = dv.getUint16(p + 28, true);
      var extraLen = dv.getUint16(p + 30, true);
      var commentLen = dv.getUint16(p + 32, true);
      var localOffset = dv.getUint32(p + 42, true);
      var fname = new TextDecoder('utf-8').decode(buf.subarray(p + 46, p + 46 + nameLen));

      if (fname === wanted) {
        var lh = localOffset;
        if (dv.getUint32(lh, true) !== 0x04034b50) throw new Error('DOCX 结构损坏（本地头异常）');
        var lNameLen = dv.getUint16(lh + 26, true);
        var lExtraLen = dv.getUint16(lh + 28, true);
        var dataStart = lh + 30 + lNameLen + lExtraLen;
        var data = buf.subarray(dataStart, dataStart + compSize);

        if (method === 0) return new TextDecoder('utf-8').decode(data);
        if (method === 8) {
          if (typeof window.DecompressionStream === 'undefined') {
            throw new Error('当前浏览器不支持解压 DOCX，请改用 Excel 外的 TXT / Markdown，或升级浏览器');
          }
          var ds = new window.DecompressionStream('deflate-raw');
          var stream = new Blob([data]).stream().pipeThrough(ds);
          return await new Response(stream).text();
        }
        throw new Error('DOCX 使用了不支持的压缩方式（' + method + '）');
      }

      p += 46 + nameLen + extraLen + commentLen;
    }
    throw new Error('DOCX 中未找到正文 word/document.xml');
  }

  /** 按文档顺序取出段落文本，保留换行 */
  function docxParagraphs(xml) {
    var doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length) throw new Error('DOCX 正文解析失败');

    var paras = doc.getElementsByTagName('w:p');
    var out = [];

    for (var i = 0; i < paras.length; i++) {
      var s = '';
      (function walk(n) {
        for (var k = 0; k < n.childNodes.length; k++) {
          var c = n.childNodes[k];
          if (c.nodeType !== 1) continue;
          var ln = c.localName;
          if (ln === 't') s += c.textContent;
          else if (ln === 'br') s += '\n';
          else if (ln === 'tab') s += ' ';
          else walk(c);
        }
      })(paras[i]);

      s = s.replace(/\u00a0/g, ' ').trim();
      if (s) out.push(s);
    }
    return out;
  }

  /* ================================================================
     二、HTML → 文本行
     ================================================================ */
  function htmlToLines(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var root = doc.body;
    var BLOCK = /^(P|DIV|LI|TR|H[1-6]|SECTION|ARTICLE|HEADER|FOOTER|UL|OL|TABLE|BR|BLOCKQUOTE)$/;
    var out = [];
    var cur = '';

    (function walk(n) {
      for (var i = 0; i < n.childNodes.length; i++) {
        var c = n.childNodes[i];
        if (c.nodeType === 3) {
          cur += c.nodeValue;
        } else if (c.nodeType === 1) {
          var tag = c.tagName;
          if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') continue;
          var isBlock = BLOCK.test(tag);
          if (isBlock && cur.trim()) { out.push(cur.trim()); cur = ''; }
          walk(c);
          if (isBlock && cur.trim()) { out.push(cur.trim()); cur = ''; }
        }
      }
    })(root);

    if (cur.trim()) out.push(cur.trim());
    return out;
  }

  /* ================================================================
     三、文本 → 结构化简历
     ================================================================ */

  var MODULE_RULES = [
    { id: 'education', re: /^(教育背景|教育经历|学习经历|学历|education)$/i },
    { id: 'experience', re: /^(工作经历|工作经验|职业经历|工作履历|实习经历|实习经验|工作)$/i },
    { id: 'projects', re: /^(项目经验|项目经历|主要项目|项目)$/i },
    { id: 'skills', re: /^(专业技能|技能特长|技能|技术栈|个人技能|能力特长)$/i },
    { id: 'certificates', re: /^(证书|荣誉|获奖|奖项|荣誉证书|所获奖励|证书荣誉|奖励荣誉)$/i },
    { id: 'languages', re: /^(语言能力|语言|外语能力)$/i },
    { id: 'summary', re: /^(个人简介|自我介绍|自我评价|个人总结|个人优势|简介|概述|关于我)$/i }
  ];

  // 注意：月份必须写成 (?:1[0-2]|0?[1-9])，两位数分支在前。
  // 若写成 (?:0?[1-9]|1[0-2])，"2022.10" 会被 [1-9] 先吃掉 "1"，残留 "0" 污染后续拆分。
  var TIME_RE = /((?:19|20)\d{2}\s*[.\-/年]?\s*(?:1[0-2]|0?[1-9])?\s*月?)\s*[-–—~～至到]+\s*((?:19|20)\d{2}\s*[.\-/年]?\s*(?:1[0-2]|0?[1-9])?\s*月?|至今|今|现在|目前|present|now)/i;
  var BULLET_RE = /^[\u2022\u00b7\u25cf\u25aa\u25c6\u25b8\u25ba\u2013\u2014\-*+]\s*/;

  function normTitle(s) {
    return String(s || '')
      .replace(/[\s\u3000]/g, '')
      .replace(/^[0-9一二三四五六七八九十]+\s*[、.．)）]\s*/, '')
      .replace(/^[\u25c6\u25cf\u25a0\u25aa\u25b8\u25ba\u00b7\u2022*\-—]+\s*/, '')
      .replace(/[：:·.。]$/, '')
      .trim();
  }

  function matchModule(line) {
    var t = normTitle(line);
    if (!t || t.length > 8) return null;
    for (var i = 0; i < MODULE_RULES.length; i++) {
      if (MODULE_RULES[i].re.test(t)) return MODULE_RULES[i].id;
    }
    return null;
  }

  function normMonth(s) {
    var m = String(s).match(/(\d{4})\s*[.\-/年]?\s*(\d{1,2})?/);
    if (!m) return '';
    var y = m[1];
    var mo = m[2] ? String(parseInt(m[2], 10)) : '1';
    if (mo.length === 1) mo = '0' + mo;
    return y + '-' + mo;
  }

  function parseRange(str) {
    var res = { start: '', end: '', current: false };
    var m = String(str).match(TIME_RE);
    if (!m) return res;
    res.start = normMonth(m[1]);
    if (/至今|今|现在|目前|present|now/i.test(m[2])) {
      res.current = true;
    } else {
      res.end = normMonth(m[2]);
    }
    return res;
  }

  function splitByTime(rest) {
    var s = String(rest).trim();
    var parts = s.split(/\s*[|｜]\s*|\s{2,}|\s*[·•]\s*/).map(function (t) {
      return t.trim();
    }).filter(Boolean);

    // 中文内容中的单个空格通常也是字段分隔（"字节跳动 产品经理"）。
    // 纯英文不加处理，避免把 "Senior Product Manager" 拆碎。
    if (parts.length === 1 && /\s/.test(s) && /[\u4e00-\u9fa5]/.test(s)) {
      parts = s.split(/\s+/).filter(Boolean);
    }
    return parts;
  }

  /** 单个日期（证书、获奖等），月份分支同样两位数优先 */
  var SINGLE_DATE_RE = /((?:19|20)\d{2}\s*[.\-/年]?\s*(?:1[0-2]|0?[1-9])\s*月?)/;

  /** 把一段模块正文切成条目
   *  判定原则：证据不足时归入当前条目的正文，宁可少切不可错切 */
  function splitEntries(lines) {
    var entries = [];
    var cur = null;

    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line) return;

      var isBullet = BULLET_RE.test(line);
      var hasTime = TIME_RE.test(line);
      var isOrg = ORG_RE.test(line) || COMPANY_RE.test(line);
      var noPunct = !/[，,。；;：:！!？?]/.test(line);

      // 明确的条目头：带时间区间，或带组织名且不长
      var looksLikeHead = !isBullet && (hasTime || (isOrg && line.length <= 30));

      // 兜底：当前条目正文已很长，且新行很短且无标点，视为下一条目
      var overflowHead = !!cur && cur.body.length >= 4 && line.length <= 16 && noPunct && !isBullet;

      if (looksLikeHead || overflowHead || !cur) {
        if (cur) entries.push(cur);
        cur = { head: line, body: [] };
      } else {
        cur.body.push(line.replace(BULLET_RE, ''));
      }
    });

    if (cur) entries.push(cur);
    return entries;
  }

  /** head 行 → 时间区间 + 文本片段 */
  function splitHead(head) {
    var m = head.match(TIME_RE);
    var timeText = m ? m[0] : '';
    var range = parseRange(head);
    var rest = head.replace(timeText, ' ').replace(/[（(]\s*[)）]/g, ' ').trim();
    rest = rest.replace(/^[\s,，、|｜·•]+|[\s,，、|｜·•]+$/g, '');
    return {
      time: timeText,
      parts: splitByTime(rest),
      raw: rest,
      start: range.start,
      end: range.end,
      current: range.current
    };
  }

  var ORG_RE = /(大学|学院|学校|中学|高中|职业技术|研究院|研究所)/;
  var COMPANY_RE = /(公司|集团|科技|有限|股份|银行|医院|事务所|工作室|中心|事业部)/;
  var ROLE_RE = /(工程师|经理|总监|主管|专员|助理|设计师|开发|运维|产品|运营|实习生|顾问|架构师|负责人|组长|主任|教师|编辑|分析师|销售|会计)/;

  function pickOrg(parts) {
    for (var i = 0; i < parts.length; i++) {
      if (ORG_RE.test(parts[i])) return { org: parts[i], rest: parts.slice(0, i).concat(parts.slice(i + 1)) };
    }
    return { org: parts[0] || '', rest: parts.slice(1) };
  }

  function pickCompany(parts) {
    for (var i = 0; i < parts.length; i++) {
      if (COMPANY_RE.test(parts[i])) return { org: parts[i], rest: parts.slice(0, i).concat(parts.slice(i + 1)) };
    }
    return { org: parts[0] || '', rest: parts.slice(1) };
  }

  function pickRole(parts) {
    for (var i = 0; i < parts.length; i++) {
      if (ROLE_RE.test(parts[i])) return parts[i];
    }
    return '';
  }

  var BULLET_JOIN = '\n';

  function extractContacts(text) {
    var out = {};
    var phone = text.match(/(?:\+?86[-\s]?)?1[3-9]\d{9}/) || text.match(/1[3-9]\d[-\s]\d{4}[-\s]\d{4}/);
    if (phone) out.phone = phone[0].replace(/\s/g, '');

    var mail = text.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/);
    if (mail) out.email = mail[0];

    var url = text.match(/(?:https?:\/\/)?(?:www\.)?[\w-]+\.(?:com|cn|net|io|dev|me|org|xyz)(?:\/[\w\-./?%&=]*)?/i);
    if (url && !/^\d/.test(url[0])) {
      var u = url[0];
      if (/github\.com/i.test(u)) out.github = u.replace(/^https?:\/\//, '');
      else out.website = u.replace(/^https?:\/\//, '');
    }

    var city = text.match(/(?:现居|居住地|所在地|城市|地址|籍贯)[：: ]\s*([\u4e00-\u9fa5]{2,8})/);
    if (city) out.city = city[1];
    return out;
  }

  var CITY_LIST = ['北京', '上海', '广州', '深圳', '杭州', '成都', '武汉', '南京', '西安',
    '苏州', '天津', '重庆', '长沙', '郑州', '青岛', '厦门', '合肥', '福州', '济南',
    '大连', '宁波', '无锡', '东莞', '佛山', '珠海', '昆明', '南昌', '贵阳', '太原',
    '石家庄', '沈阳', '哈尔滨', '长春', '兰州', '乌鲁木齐', '海口', '三亚'];

  /** 从头部行中猜测所在城市 */
  function guessCity(headLines) {
    for (var i = 0; i < headLines.length; i++) {
      for (var j = 0; j < CITY_LIST.length; j++) {
        if (headLines[i].indexOf(CITY_LIST[j]) > -1) return CITY_LIST[j];
      }
    }
    return '';
  }

  function guessName(lines) {
    var pool = lines.slice(0, 8);
    for (var i = 0; i < pool.length; i++) {
      var s = pool[i].replace(/\s/g, '');
      var m = s.match(/^姓\s*名[：:]\s*([\u4e00-\u9fa5]{2,4})$/);
      if (m) return m[1];
      if (/^[\u4e00-\u9fa5]{2,4}$/.test(s) && s.length >= 2) return s;
    }
    return '';
  }

  function guessTitle(lines) {
    var pool = lines.slice(0, 10);
    for (var i = 0; i < pool.length; i++) {
      var s = pool[i].trim();
      if (s.length > 24 || s.length < 2) continue;
      if (ROLE_RE.test(s) && !TIME_RE.test(s) && !/@/.test(s)) return s.replace(BULLET_RE, '');
    }
    return '';
  }

  /** 技能文本 → 技能数组 */
  function parseSkills(lines) {
    var raw = lines.join(' ');
    // 不按 / 拆分，"A/B 实验"、"前端/后端" 这类写法应保留原样
    var parts = raw.split(/[\n、,，;；|｜]+/).map(function (s) { return s.trim(); }).filter(Boolean);
    var seen = {};
    var out = [];
    parts.forEach(function (p) {
      var name = p
        .replace(/^(熟练掌握|精通|熟悉|了解|能够|会用|熟练使用|使用|具备)\s*/, '')
        .replace(/[。.]$/, '')
        .trim();
      if (!name || name.length > 30) return;
      if (seen[name]) return;
      seen[name] = 1;
      out.push({ id: U.uid(), name: name, level: '3', group: '' });
    });
    return out.slice(0, 24);
  }

  function structureText(lines) {
    lines = lines.map(function (s) { return String(s).replace(/\s+$/, ''); }).filter(function (s) { return s.trim(); });

    var fullText = lines.join('\n');
    var contacts = extractContacts(fullText);

    // 切模块
    var buckets = { _head: [] };
    var order = [];
    var cur = '_head';

    lines.forEach(function (line) {
      var mod = matchModule(line);
      if (mod) {
        cur = mod;
        if (!buckets[mod]) { buckets[mod] = []; order.push(mod); }
        return;
      }
      buckets[cur].push(line);
    });

    var doc = RS.store.blankDoc();
    doc.profile.name = guessName(lines) || '';
    doc.profile.title = guessTitle(lines) || '';
    ['phone', 'email', 'city', 'website', 'github'].forEach(function (k) {
      if (contacts[k]) doc.profile[k] = contacts[k];
    });

    var headLines = buckets._head || [];

    if (!doc.profile.city) {
      var guessedCity = guessCity(headLines);
      if (guessedCity) doc.profile.city = guessedCity;
    }

    // 简历头部：去掉已被识别为姓名/职位的行，剩余作为简介候选
    var headRest = headLines.filter(function (l) {
      var s = l.replace(/\s/g, '');
      if (doc.profile.name && s === doc.profile.name) return false;
      if (doc.profile.title && l.trim() === doc.profile.title) return false;

      // 整行仅由「已提取的联系方式 + 分隔符」构成，则丢弃
      var hasContact = (doc.profile.phone && l.indexOf(doc.profile.phone) > -1) ||
        (doc.profile.email && l.indexOf(doc.profile.email) > -1) ||
        (doc.profile.website && l.indexOf(doc.profile.website) > -1) ||
        (doc.profile.github && l.indexOf(doc.profile.github) > -1);

      var stripped = l;
      ['phone', 'email', 'city', 'website', 'github'].forEach(function (k) {
        if (doc.profile[k]) stripped = stripped.split(doc.profile[k]).join('');
      });
      stripped = stripped.replace(/[\s|｜·•,，;；\-—/、:：+()（）\[\]]/g, '');

      if (!stripped) return false;
      // 含联系方式且剩余只有零星字符（如城市、分隔符残留），也丢弃
      if (hasContact && stripped.length <= 6) return false;

      return true;
    });

    if (buckets.summary && buckets.summary.length) {
      doc.profile.summary = buckets.summary.join(' ');
    } else if (headRest.length && headRest.join('').length > 40) {
      doc.profile.summary = headRest.join(' ');
      headRest = [];
    }

    // 教育
    if (buckets.education) {
      doc.data.education = splitEntries(buckets.education).map(function (e) {
        var h = splitHead(e.head);
        var o = pickOrg(h.parts);
        var role = pickRole(o.rest);
        var degree = (o.rest.join(' ').match(/(博士|硕士|本科|大专|专科|高中|学士|研究生)/) || [''])[0];
        return {
          id: U.uid(),
          school: o.org,
          major: (o.rest.find(function (x) { return !ROLE_RE.test(x) && !/博士|硕士|本科|大专|专科|高中/.test(x); }) || ''),
          degree: degree || '本科',
          start: h.start,
          end: h.end,
          city: '',
          gpa: (h.raw.match(/GPA[：: ]*([\d.]+\s*\/?\s*[\d.]*)/i) || ['', ''])[1] || '',
          courses: '',
          desc: e.body.join(BULLET_JOIN)
        };
      }).filter(function (x) { return x.school; });
    }

    // 工作
    if (buckets.experience) {
      doc.data.experience = splitEntries(buckets.experience).map(function (e) {
        var h = splitHead(e.head);
        var o = pickCompany(h.parts);
        var role = pickRole(o.rest) || pickRole(h.parts) || '';
        return {
          id: U.uid(),
          company: o.org,
          role: role,
          city: '',
          start: h.start,
          end: h.end,
          current: h.current,
          desc: '',
          bullets: e.body.join(BULLET_JOIN)
        };
      }).filter(function (x) { return x.company; });
    }

    // 项目
    if (buckets.projects) {
      doc.data.projects = splitEntries(buckets.projects).map(function (e) {
        var h = splitHead(e.head);
        var parts = h.parts.slice();
        var role = pickRole(parts);
        var name = parts.filter(function (x) { return x !== role; })[0] || h.raw;
        return {
          id: U.uid(),
          name: name,
          role: role,
          link: '',
          start: h.start,
          end: h.end,
          current: h.current,
          tech: '',
          desc: '',
          bullets: e.body.join(BULLET_JOIN)
        };
      }).filter(function (x) { return x.name; });
    }

    // 技能
    if (buckets.skills) {
      doc.data.skills = parseSkills(buckets.skills);
    }

    // 证书
    if (buckets.certificates) {
      doc.data.certificates = buckets.certificates
        .map(function (l) { return l.replace(BULLET_RE, '').trim(); })
        .filter(Boolean)
        .slice(0, 12)
        .map(function (l) {
          // 证书多为单个日期（2021.06），也兼容时间区间
          var range = l.match(TIME_RE);
          var single = range ? null : l.match(SINGLE_DATE_RE);
          var dateText = range ? range[0] : (single ? single[0] : '');
          var name = dateText ? l.replace(dateText, '').trim() : l;
          return {
            id: U.uid(),
            name: name.replace(/^[\s,，、·•|｜\-–—]+|[\s,，、·•|｜\-–—]+$/g, ''),
            issuer: '',
            date: dateText ? normMonth(dateText) : ''
          };
        });
    }

    // 语言
    if (buckets.languages) {
      doc.data.languages = buckets.languages.map(function (l) {
        var s = l.replace(BULLET_RE, '').trim();
        var m = s.match(/^([\u4e00-\u9fa5]{1,6})\s*[：:（(]?\s*(.*)$/);
        return {
          id: U.uid(),
          name: m ? m[1] : s,
          level: m ? m[2].replace(/[）)]$/, '') : ''
        };
      }).filter(function (x) { return x.name; });
    }

    // 兜底：未归属内容不丢弃，落入自定义模块
    var known = ['education', 'experience', 'projects', 'skills', 'certificates', 'languages'];
    var leftover = headRest.slice();
    known.forEach(function (k) {
      if (!buckets[k] || !buckets[k].length) {
        if (buckets[k] && !doc.data[k].length) leftover = leftover.concat(buckets[k]);
      }
    });

    if (leftover.length) {
      var chunks = [];
      var buf = [];
      leftover.forEach(function (l) {
        if (BULLET_RE.test(l) && buf.length) buf.push(l.replace(BULLET_RE, ''));
        else {
          if (buf.length) chunks.push(buf.join('\n'));
          buf = [l];
        }
      });
      if (buf.length) chunks.push(buf.join('\n'));

      doc.data.custom = chunks.slice(0, 8).map(function (c) {
        var linesOfChunk = c.split('\n');
        return {
          id: U.uid(),
          title: linesOfChunk[0].slice(0, 30),
          sub: '',
          city: '',
          start: '',
          end: '',
          current: false,
          desc: '',
          bullets: linesOfChunk.slice(1).join('\n')
        };
      });
      if (doc.data.custom.length) {
        doc.titles.custom = '其他内容';
        doc.visible.custom = true;
      }
    }

    var found = [];
    if (doc.profile.name) found.push(doc.profile.name);
    if (doc.data.education.length) found.push('教育 ' + doc.data.education.length);
    if (doc.data.experience.length) found.push('工作 ' + doc.data.experience.length);
    if (doc.data.projects.length) found.push('项目 ' + doc.data.projects.length);
    if (doc.data.skills.length) found.push('技能 ' + doc.data.skills.length);
    if (doc.data.certificates.length) found.push('证书 ' + doc.data.certificates.length);
    if (doc.data.languages.length) found.push('语言 ' + doc.data.languages.length);
    if (doc.data.custom.length) found.push('其他 ' + doc.data.custom.length);

    return {
      doc: doc,
      style: null,
      template: null,
      summary: found.join(' · ') || '未识别到结构化内容',
      warnings: buildWarnings(doc, contacts)
    };
  }

  function buildWarnings(doc, contacts) {
    var w = [];
    if (!doc.profile.name) w.push('未识别到姓名，请在「个人信息」中补齐');
    if (!doc.profile.phone && !doc.profile.email) w.push('未识别到手机号或邮箱');
    if (!doc.data.education.length) w.push('未识别到教育背景');
    if (!doc.data.experience.length && !doc.data.projects.length) w.push('未识别到工作或项目经历');
    if (doc.data.custom.length) w.push('部分内容无法归类，已放入「其他内容」模块');
    return w;
  }

  /* ================================================================
     四、文件分发
     ================================================================ */
  async function parseFile(file) {
    var name = (file.name || '').toLowerCase();
    var ext = (name.match(/\.([a-z0-9]+)$/) || ['', ''])[1];

    if (file.size > MAX_BYTES) throw new Error('文件超过 10 MB，请精简后重试');

    if (ext === 'docx') {
      var buf = new Uint8Array(await file.arrayBuffer());
      var xml = await extractZipEntry(buf, 'word/document.xml');
      var lines = docxParagraphs(xml);
      if (!lines.length) throw new Error('DOCX 中没有可读取的文字，可能是纯图片简历');
      var r1 = structureText(lines);
      r1.source = 'docx';
      r1.lines = lines.length;
      return r1;
    }

    if (ext === 'doc') {
      throw new Error('不支持旧版 .doc，请在 Word / WPS 中另存为 .docx 后再导入');
    }

    if (ext === 'pdf') {
      throw new Error('暂不支持 PDF 直接解析，请另存为 .docx，或复制文字保存为 .txt 后导入');
    }

    if (ext === 'json') {
      var txt = await file.text();
      var raw;
      try {
        raw = JSON.parse(txt);
      } catch (e) {
        throw new Error('文件不是合法的 JSON，可能已损坏');
      }

      var payload = raw && raw.doc ? raw.doc : raw;
      if (!payload || typeof payload !== 'object') {
        throw new Error('文件内容为空或结构异常');
      }
      if (!payload.profile || typeof payload.profile !== 'object' ||
          !payload.data || typeof payload.data !== 'object') {
        throw new Error('这不是本工具导出的备份文件（缺少 profile / data 字段）');
      }

      /* 版本校验：优先读外层 schemaVersion，其次读 doc.meta.version。
         高于当前程序版本时明确拒绝，不做静默降级。 */
      var declared = parseInt(raw && raw.schemaVersion, 10) ||
        parseInt(payload.meta && payload.meta.version, 10) || 1;
      var current = RS.store.schemaVersion || 1;
      if (declared > current) {
        throw new Error('这份备份来自更新版本（数据 v' + declared +
          '），当前程序只支持到 v' + current + '，请升级后再导入');
      }

      /* 逐级迁移；迁移函数缺失也不会崩（normalize 会按默认值兜底） */
      var migrated;
      try {
        migrated = RS.store.migrate(payload);
      } catch (e) {
        throw new Error(e && e.message ? e.message : '数据版本迁移失败');
      }

      var normalized = RS.store.normalize(migrated);
      var found = [];
      Object.keys(normalized.data).forEach(function (k) {
        if (normalized.data[k].length) found.push(k + ' ' + normalized.data[k].length);
      });
      return {
        doc: normalized,
        style: normalized.style,
        template: normalized.style.template,
        source: 'json',
        summary: '姓名 ' + (normalized.profile.name || '未填') + (found.length ? ' · ' + found.join(' · ') : ''),
        warnings: [],
        lines: 0
      };
    }

    if (ext === 'html' || ext === 'htm') {
      var h = await file.text();
      var hl = htmlToLines(h);
      if (!hl.length) throw new Error('HTML 中没有可读取的文字');
      var r2 = structureText(hl);
      r2.source = 'html';
      r2.lines = hl.length;
      return r2;
    }

    // txt / md / markdown / 其他文本
    var t = await file.text();
    if (!t.trim()) throw new Error('文件是空的');
    var tl = t.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    var r3 = structureText(tl);
    r3.source = ext === 'md' || ext === 'markdown' ? 'md' : 'txt';
    r3.lines = tl.length;
    return r3;
  }

  /* ================================================================
     五、向导 UI
     ================================================================ */

  var STYLE_PRESETS = [
    {
      id: 'pro', name: '专业严谨', desc: '深蓝 · 无衬线 · 紧凑',
      accent: '#1d4ed8', font: 'sans', fontSize: 13.5, lineHeight: 1.6,
      gap: 13, margin: 14, bullet: 'dot', skillStyle: 'bars', certCols: 2
    },
    {
      id: 'reader', name: '清晰易读', desc: '墨绿 · 宋体 · 标准',
      accent: '#0f766e', font: 'song', fontSize: 14, lineHeight: 1.75,
      gap: 16, margin: 16, bullet: 'dot', skillStyle: 'tags', certCols: 2
    },
    {
      id: 'quiet', name: '简约克制', desc: '墨黑 · 细黑 · 宽松',
      accent: '#334155', font: 'hei', fontSize: 13, lineHeight: 1.82,
      gap: 19, margin: 18, bullet: 'dash', skillStyle: 'tags', certCols: 1
    },
    {
      id: 'vivid', name: '活力醒目', desc: '紫罗兰 · 无衬线 · 标准',
      accent: '#7c3aed', font: 'sans', fontSize: 13.5, lineHeight: 1.66,
      gap: 15, margin: 15, bullet: 'square', skillStyle: 'stars', certCols: 2
    }
  ];

  var STYLE_KEYS = ['accent', 'font', 'fontSize', 'lineHeight', 'gap', 'margin',
    'bullet', 'skillStyle', 'certCols', 'nameSpacing', 'photoShape', 'photoSize', 'showPhoto'];

  var ui = {
    step: 1,
    file: null,
    parsed: null,
    busy: false,
    error: '',
    tplMode: 'preset',
    tplId: 'classic',
    styleMode: 'preset',
    stylePreset: 'pro'
  };

  var mask = null;
  var inner = null;
  var fileInput = null;

  function presetById(id) {
    for (var i = 0; i < STYLE_PRESETS.length; i++) {
      if (STYLE_PRESETS[i].id === id) return STYLE_PRESETS[i];
    }
    return STYLE_PRESETS[0];
  }

  function sizeText(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  function sourceLabel(src) {
    return ({
      docx: 'Word 文档', txt: '纯文本', md: 'Markdown',
      html: '网页', json: '本工具备份'
    })[src] || '文件';
  }

  /* ---------------- 结构 ---------------- */
  function stepsHTML() {
    var names = ['选择文件', '选择模板', '排版与配色'];
    var html = '<div class="imp-steps">';
    for (var i = 0; i < names.length; i++) {
      var n = i + 1;
      var cls = 'imp-step' + (ui.step === n ? ' on' : '') + (ui.step > n ? ' done' : '');
      html += '<div class="' + cls + '">' +
        '<span class="imp-step-no">' + (ui.step > n ? '✓' : n) + '</span>' +
        '<span>' + names[i] + '</span>' +
      '</div>';
      if (n < names.length) html += '<i class="imp-step-sep"></i>';
    }
    return html + '</div>';
  }

  function fileStepHTML() {
    if (!ui.parsed) {
      return '' +
        '<div class="imp-drop" id="impDrop">' +
          '<div class="imp-drop-ico">' + RS.icons.get('upload') + '</div>' +
          '<b>拖拽简历文件到这里，或点击选择</b>' +
          '<span>支持 .docx / .txt / .md / .html / .json，单个文件不超过 10 MB</span>' +
          '<button class="btn primary sm" data-imp="pick">选择文件</button>' +
        '</div>' +
        '<p class="imp-tip">' +
          '旧版 .doc 请先在 Word / WPS 中另存为 .docx；PDF 请另存为 .docx 或复制文字存为 .txt。' +
        '</p>' +
        '<div class="imp-paste">' +
          '<div class="imp-paste-head">或直接粘贴简历文本</div>' +
          '<textarea class="control" id="impPaste" rows="6" ' +
            'placeholder="把简历内容整段粘贴到这里，会自动识别教育背景 / 工作经历 / 项目经验 / 技能等模块。"></textarea>' +
          '<div class="imp-paste-foot">' +
            '<button class="btn sm ghost" data-imp="parse-paste">解析这段文本</button>' +
            '<span class="rv-hint">纯本地解析，不会上传</span>' +
          '</div>' +
        '</div>';
    }

    var p = ui.parsed;
    var warn = p.warnings && p.warnings.length
      ? '<ul class="imp-warn">' + p.warnings.map(function (w) {
          return '<li>' + esc(w) + '</li>';
        }).join('') + '</ul>'
      : '<p class="imp-ok">' + RS.icons.get('check') + ' 识别结果良好，无需额外提示</p>';

    return '' +
      '<div class="imp-file">' +
        '<div class="imp-file-ico">' + RS.icons.get('file') + '</div>' +
        '<div class="imp-file-txt">' +
          '<b>' + esc(ui.file.name) + '</b>' +
          '<span>' + sourceLabel(p.source) + ' · ' + sizeText(ui.file.size) +
            (p.lines ? ' · 解析 ' + p.lines + ' 行' : '') + '</span>' +
        '</div>' +
        '<button class="btn sm ghost" data-imp="repick">重新选择</button>' +
      '</div>' +
      '<div class="imp-result">' +
        '<div class="imp-result-head">识别摘要</div>' +
        '<div class="imp-result-body">' + esc(p.summary) + '</div>' +
        warn +
      '</div>';
  }

  function tplStepHTML() {
    var hasOwn = !!ui.parsed.template;
    var ownName = hasOwn ? RS.templates.get(ui.parsed.template).name : null;
    var curName = RS.templates.get(RS.store.state.style.template).name;

    var cards = RS.templates.all().map(function (t) {
      var on = ui.tplId === t.id;
      return '<button class="imp-tpl' + (on ? ' on' : '') + '" data-imp="tpl" data-id="' + t.id + '">' +
        RS.templates.thumbHTML(t, on ? RS.store.state.style.accent : t.accent) +
        '<span class="imp-tpl-name">' + esc(t.name) + '</span>' +
      '</button>';
    }).join('');

    return '' +
      '<p class="imp-lead">第一步：这份简历要套用哪一套页面结构？</p>' +

      '<label class="imp-choice' + (ui.tplMode === 'preset' ? ' on' : '') + '" data-imp="mode-tpl" data-val="preset">' +
        '<span class="imp-radio"></span>' +
        '<span class="imp-choice-txt">' +
          '<b>使用模板中心的模板</b>' +
          '<em>从下方 6 套版式中挑一套，版式结构会完全替换</em>' +
        '</span>' +
      '</label>' +

      '<div class="imp-tpl-grid' + (ui.tplMode === 'preset' ? ' on' : '') + '">' + cards + '</div>' +

      '<label class="imp-choice' + (ui.tplMode === 'own' ? ' on' : '') + '" data-imp="mode-tpl" data-val="own">' +
        '<span class="imp-radio"></span>' +
        '<span class="imp-choice-txt">' +
          '<b>' + (hasOwn ? '使用我自己简历原有的模板' : '保持编辑器当前的模板') + '</b>' +
          '<em>' + (hasOwn
            ? '将还原文件里记录的版式：' + esc(ownName)
            : '该文件不包含版式信息，导入后沿用当前模板：' + esc(curName)) +
          '</em>' +
        '</span>' +
      '</label>';
  }

  function styleStepHTML() {
    var hasOwn = !!ui.parsed.style;
    var cur = RS.store.state.style;

    var cards = STYLE_PRESETS.map(function (p) {
      var on = ui.stylePreset === p.id;
      return '<button class="imp-preset' + (on ? ' on' : '') + '" data-imp="preset" data-id="' + p.id + '">' +
        '<span class="imp-preset-top">' +
          '<i class="imp-dot" style="background:' + p.accent + '"></i>' +
          '<b>' + esc(p.name) + '</b>' +
        '</span>' +
        '<span class="imp-preset-desc">' + esc(p.desc) + '</span>' +
        '<span class="imp-preset-demo" style="font-family:' +
          esc(RS.fontStack(p.font).replace(/"/g, "'")) + '">文 Aa 简历</span>' +
      '</button>';
    }).join('');

    return '' +
      '<p class="imp-lead">第二步：字号、行距与配色从哪里来？</p>' +

      '<label class="imp-choice' + (ui.styleMode === 'preset' ? ' on' : '') + '" data-imp="mode-style" data-val="preset">' +
        '<span class="imp-radio"></span>' +
        '<span class="imp-choice-txt">' +
          '<b>使用系统提供的排版和配色</b>' +
          '<em>选一套预设，主色、字体、行距、符号会整套替换</em>' +
        '</span>' +
      '</label>' +

      '<div class="imp-preset-grid' + (ui.styleMode === 'preset' ? ' on' : '') + '">' + cards + '</div>' +

      '<label class="imp-choice' + (ui.styleMode === 'own' ? ' on' : '') + '" data-imp="mode-style" data-val="own">' +
        '<span class="imp-radio"></span>' +
        '<span class="imp-choice-txt">' +
          '<b>' + (hasOwn ? '沿用我自己简历的默认排版和配色' : '保持当前的排版和配色') + '</b>' +
          '<em>' + (hasOwn
            ? '将还原文件里记录的样式参数（主色 ' + esc(ui.parsed.style.accent) + '）'
            : '该文件不包含样式信息，导入后沿用当前设置（主色 ' + esc(cur.accent) + '）') +
          '</em>' +
        '</span>' +
      '</label>' +

      '<div class="imp-final">' +
        '<span>导入后：</span>' +
        '<b>' + esc(ui.tplMode === 'preset' ? RS.templates.get(ui.tplId).name : (hasOwn ? RS.templates.get(ui.parsed.template).name : RS.templates.get(cur.template).name)) + '</b>' +
        '<i>·</i>' +
        '<b>' + esc(ui.styleMode === 'preset' ? presetById(ui.stylePreset).name : (hasOwn ? '原配色' : '当前配色')) + '</b>' +
        '<i>·</i>' +
        '<span>' + esc(ui.parsed.summary) + '</span>' +
      '</div>';
  }

  function footerHTML() {
    var canNext = ui.step === 1 ? !!ui.parsed : true;
    var left = ui.step === 1
      ? '<button class="btn ghost" data-imp="close">取消</button>'
      : '<button class="btn ghost" data-imp="prev">上一步</button>';
    var right = ui.step < 3
      ? '<button class="btn primary" data-imp="next"' + (canNext ? '' : ' disabled') + '>下一步</button>'
      : '<button class="btn primary" data-imp="do">开始导入</button>';

    return '<div class="imp-foot-left">' + left + '</div>' +
      '<div class="imp-foot-right">' + right + '</div>';
  }

  function render() {
    if (!inner) return;
    var body = ui.step === 1 ? fileStepHTML()
      : ui.step === 2 ? tplStepHTML()
      : styleStepHTML();

    if (ui.error) {
      body = '<div class="imp-error">' + RS.icons.get('alert') + '<span>' + esc(ui.error) + '</span></div>' +
        (ui.step === 1 ? fileStepHTML() : body);
    }

    if (ui.busy) {
      body = '<div class="imp-loading"><span class="imp-spin"></span><b>正在解析文件…</b>' +
        '<em>本地处理，不会上传</em></div>';
    }

    inner.innerHTML =
      '<div class="imp-head">' +
        '<div>' +
          '<h2 id="impTitle">一键导入个人简历</h2>' +
          '<p>从已有的 Word / 文本简历起步，两步选择版式后自动填充</p>' +
        '</div>' +
        '<button class="imp-x" data-imp="close" title="关闭">' + RS.icons.get('plus') + '</button>' +
      '</div>' +
      stepsHTML() +
      '<div class="imp-body">' + body + '</div>' +
      '<div class="imp-foot">' + footerHTML() + '</div>';

    RS.icons.hydrate(inner);

    var drop = inner.querySelector('#impDrop');
    if (drop && !drop.__bound) {
      drop.__bound = true;
      drop.addEventListener('click', function (e) {
        if (e.target.closest('[data-imp="pick"]')) return;
        pickFile();
      });
      drop.addEventListener('dragover', function (e) {
        e.preventDefault();
        drop.classList.add('over');
      });
      drop.addEventListener('dragleave', function () {
        drop.classList.remove('over');
      });
      drop.addEventListener('drop', function (e) {
        e.preventDefault();
        drop.classList.remove('over');
        var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) handleFile(f);
      });
    }
  }

  /* ---------------- 文件 ---------------- */
  function pickFile() {
    if (!fileInput) {
      fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.id = 'impFileInput';
      fileInput.accept = '.docx,.txt,.md,.markdown,.html,.htm,.json,.doc,.pdf';
      fileInput.style.display = 'none';
      fileInput.addEventListener('change', function () {
        var f = this.files && this.files[0];
        if (f) handleFile(f);
        this.value = '';
      });
      document.body.appendChild(fileInput);
    }
    fileInput.click();
  }

  async function handleFile(file) {
    ui.error = '';
    ui.busy = true;
    render();

    try {
      var parsed = await parseFile(file);
      ui.file = file;
      ui.parsed = parsed;
      ui.step = 1;
      if (parsed.template) {
        ui.tplId = parsed.template;
        ui.tplMode = 'own';
      }
      if (parsed.style) {
        ui.styleMode = 'own';
      }
      ui.busy = false;
      render();
      RS.app.toast('文件解析完成', 'ok');
    } catch (err) {
      ui.busy = false;
      ui.parsed = null;
      ui.file = null;
      ui.error = (err && err.message) || '解析失败';
      render();
    }
  }

  /* ---------------- 导入 ---------------- */
  function buildDoc() {
    var src = ui.parsed.doc;
    var doc = RS.store.normalize(U.clone({
      meta: src.meta,
      profile: src.profile,
      style: RS.store.state.style,
      order: src.order,
      visible: src.visible,
      titles: src.titles,
      data: src.data
    }));

    var style = U.clone(RS.store.state.style);

    // ① 模板：决定版式结构
    if (ui.tplMode === 'preset') {
      var tpl = RS.templates.get(ui.tplId);
      RS.templates.applyTo(style, tpl.id);
      style.accent = tpl.accent;
    } else if (ui.parsed.template) {
      RS.templates.applyTo(style, ui.parsed.template);
      if (ui.parsed.style && ui.parsed.style.accent) style.accent = ui.parsed.style.accent;
    }

    // ② 排版配色：决定字号/行距/边距/符号/技能呈现
    if (ui.styleMode === 'preset') {
      var p = presetById(ui.stylePreset);
      STYLE_KEYS.forEach(function (k) {
        if (p[k] !== undefined) style[k] = p[k];
      });
    } else if (ui.parsed.style) {
      STYLE_KEYS.forEach(function (k) {
        if (ui.parsed.style[k] !== undefined) style[k] = ui.parsed.style[k];
      });
    }

    doc.style = style;
    return doc;
  }

  function doImport() {
    if (!ui.parsed) return;
    try {
      var doc = buildDoc();
      if (RS.app && RS.app.snapshot) RS.app.snapshot();
      RS.store.replace(doc);
      RS.app.refreshAll();
      close();
      RS.app.toast('导入完成，可按 Ctrl+Z 撤销', 'ok');

      setTimeout(function () {
        var nav = document.querySelector('[data-panel="profile"]');
        if (nav) nav.click();
      }, 120);
    } catch (e) {
      ui.error = '导入失败：' + (e && e.message ? e.message : '未知错误');
      render();
    }
  }

  /* ---------------- 开关 ---------------- */
  function open() {
    if (!mask) {
      mask = document.getElementById('importMask');
      inner = document.getElementById('importModalInner');
    }
    if (!mask) return;

    if (RS.inline && RS.inline.isActive()) RS.inline.exit();

    ui.step = 1;
    ui.file = null;
    ui.parsed = null;
    ui.busy = false;
    ui.error = '';
    ui.tplMode = 'preset';
    ui.tplId = RS.store.state.style.template;
    ui.styleMode = 'preset';
    ui.stylePreset = 'pro';

    mask.classList.add('on');
    document.body.style.overflow = 'hidden';
    render();

    if (!mask.__bound) {
      mask.__bound = true;
      mask.addEventListener('click', function (e) {
        if (e.target === mask) close();
      });
      inner.addEventListener('click', onInnerClick);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && mask.classList.contains('on')) {
          e.preventDefault();
          close();
        }
      });
    }
  }

  function close() {
    if (!mask) return;
    mask.classList.remove('on');
    document.body.style.overflow = '';
    ui.busy = false;
  }

  function onInnerClick(e) {
    var el = e.target.closest('[data-imp]');
    if (!el) return;
    var act = el.getAttribute('data-imp');

    switch (act) {
      case 'close':
        close();
        break;

      case 'pick':
      case 'repick':
        e.stopPropagation();
        pickFile();
        break;

      case 'prev':
        ui.step = Math.max(1, ui.step - 1);
        ui.error = '';
        render();
        break;

      case 'next':
        if (ui.step === 1 && !ui.parsed) return;
        ui.step = Math.min(3, ui.step + 1);
        ui.error = '';
        render();
        break;

      case 'mode-tpl':
        ui.tplMode = el.getAttribute('data-val');
        render();
        break;

      case 'mode-style':
        ui.styleMode = el.getAttribute('data-val');
        render();
        break;

      case 'tpl':
        ui.tplId = el.getAttribute('data-id');
        ui.tplMode = 'preset';
        render();
        break;

      case 'preset':
        ui.stylePreset = el.getAttribute('data-id');
        ui.styleMode = 'preset';
        render();
        break;

      case 'parse-paste': {
        var ta = document.getElementById('impPaste');
        var text = ta ? String(ta.value || '').trim() : '';
        if (text.length < 20) {
          ui.error = '内容太短了，至少粘贴 20 个字再试';
          render();
          break;
        }
        var lines = text.split(/\r?\n/)
          .map(function (s) { return s.trim(); })
          .filter(Boolean);
        var parsedPaste = structureText(lines);
        parsedPaste.source = 'txt';
        parsedPaste.lines = lines.length;
        ui.file = { name: '粘贴的文本', size: text.length };
        ui.parsed = parsedPaste;
        ui.error = '';
        ui.step = 1;
        render();
        if (RS.app) RS.app.toast('已解析粘贴内容，确认后即可导入', 'ok');
        break;
      }
      case 'do':
        doImport();
        break;

      default:
        break;
    }
  }

  RS.importer = RS.importer || {};
  RS.importer.parseFile = parseFile;
  RS.importer.structureText = structureText;
  RS.importer.open = open;
  RS.importer.close = close;
  /** 程序化导入入口：接收 File 对象，完成后 UI 已刷新 */
  RS.importer.importFile = handleFile;

})(window);

</script>
<script>

    'Spring', 'Spring Boot', 'Django', 'Flask', 'Express', 'FastAPI',
    'MySQL', 'PostgreSQL', 'Oracle', 'Redis', 'MongoDB', 'Kafka', 'RabbitMQ', 'Elasticsearch',
