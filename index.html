      var v = String(RS.store.state.profile.phone || '').replace(/[\s-]/g, '');
      if (!v) { el.textContent = ''; return; }
      el.textContent = PHONE_RE.test(v) ? '' : '手机号看起来不完整，建议填写 11 位手机号';
      el.className = 'field-tip' + (PHONE_RE.test(v) ? '' : ' is-warn');
    });

    /* 邮箱 */
    var mailEls = root.querySelectorAll('[data-validate="profile.email"]');
    Array.prototype.forEach.call(mailEls, function (el) {
      var v = String(RS.store.state.profile.email || '').trim();
      if (!v) { el.textContent = ''; return; }
      el.textContent = MAIL_RE.test(v) ? '' : '邮箱格式看起来不对，建议检查 @ 与域名部分';
      el.className = 'field-tip' + (MAIL_RE.test(v) ? '' : ' is-warn');
    });
  }

  /* ---------------- 对外 ---------------- */

  RS.coach = {
    update: update,
    syncFieldHints: syncFieldHints,
    quantify: quantify,
    pageAdvice: pageAdvice,
    closePopover: closePopover,

    /** 供测试与外部调用 */
    rules: SENIORITY
  };

})(window);

</script>
<script>
/* ==== photo.js ==== */
/* ==================================================================
   照片裁剪（Photo Cropper）
   ------------------------------------------------------------------
   纯 canvas 实现，无第三方库：
     · 拖拽平移 + 滚轮/滑块缩放
     · 三种底色（白 / 蓝 / 灰），适配证件照场景
     · 亮度 / 对比度微调（ctx.filter）
     · 输出固定 480×640、JPEG q0.86，并提示原图与成品体积
   输出为 dataURL，交由调用方写入 profile.photo。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var doc = document;

  var OUT_W = 480;
  var OUT_H = 640;
  var STAGE_W = 300;
  var STAGE_H = 400;          // 3:4 取景框

  var mask, canvas, ctx, rangeScale, rangeBright, rangeContrast, sizeInfo;
  var img = null;
  var scale = 1, dx = 0, dy = 0;
  var bg = '#ffffff';
  var brightness = 100, contrast = 100;
  var dragging = false, lastX = 0, lastY = 0;
  var onDone = null;
  var fileName = '';

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  /* 保证图片至少铺满取景框，并居中 */
  function resetView() {
    if (!img) return;
    var s = Math.max(STAGE_W / img.width, STAGE_H / img.height);
    scale = s;
    dx = (STAGE_W - img.width * s) / 2;
    dy = (STAGE_H - img.height * s) / 2;
  }

  function clampPan() {
    if (!img) return;
    var w = img.width * scale;
    var h = img.height * scale;
    // 图片小于取景框时居中不可拖；否则限制在边界内
    dx = w <= STAGE_W ? (STAGE_W - w) / 2 : clamp(dx, STAGE_W - w, 0);
    dy = h <= STAGE_H ? (STAGE_H - h) / 2 : clamp(dy, STAGE_H - h, 0);
  }

  function draw() {
    if (!ctx || !img) return;
    ctx.save();
    ctx.clearRect(0, 0, STAGE_W, STAGE_H);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    ctx.filter = 'brightness(' + brightness + '%) contrast(' + contrast + '%)';
    ctx.drawImage(img, dx, dy, img.width * scale, img.height * scale);
    ctx.restore();
  }

  /** 输出成品：按取景框内容等比放大到 480×640 */
  function exportDataURL() {
    var out = doc.createElement('canvas');
    out.width = OUT_W;
    out.height = OUT_H;
    var octx = out.getContext('2d');
    var r = OUT_W / STAGE_W;

    octx.fillStyle = bg;
    octx.fillRect(0, 0, OUT_W, OUT_H);
    octx.filter = 'brightness(' + brightness + '%) contrast(' + contrast + '%)';
    octx.drawImage(img, dx * r, dy * r, img.width * scale * r, img.height * scale * r);

    try {
      return out.toDataURL('image/jpeg', 0.86);
    } catch (e) {
      return '';
    }
  }

  function kbOfDataURL(url) {
    if (!url) return 0;
    var i = url.indexOf(',');
    if (i < 0) return 0;
    return Math.round((url.length - i - 1) * 3 / 4 / 1024);
  }

  function updateSizeInfo() {
    if (!sizeInfo) return;
    var out = exportDataURL();
    var outKB = kbOfDataURL(out);
    var srcKB = stageSrcKB;
    sizeInfo.textContent = '原图 ' + (srcKB >= 1024 ? (srcKB / 1024).toFixed(1) + ' MB' : srcKB + ' KB') +
      ' → 成品约 ' + outKB + ' KB（480×640）';
  }

  var stageSrcKB = 0;

  /* ---------------- 构建界面 ---------------- */

  function build() {
    if (mask) return;

    mask = doc.createElement('div');
    mask.className = 'crop-mask';
    mask.innerHTML =
      '<div class="crop-box" role="dialog" aria-modal="true" aria-label="照片裁剪">' +
        '<div class="crop-head">' +
          '<b>照片裁剪</b>' +
          '<button class="crop-x" data-crop="close" title="关闭">×</button>' +
        '</div>' +
        '<div class="crop-stage"><canvas class="crop-canvas" width="' + STAGE_W + '" height="' + STAGE_H + '"></canvas>' +
          '<div class="crop-hint">拖动图片调整位置</div>' +
        '</div>' +
        '<div class="crop-controls">' +
          '<label class="crop-row"><span>缩放</span>' +
            '<input type="range" data-crop="scale" min="100" max="300" value="100"></label>' +
          '<label class="crop-row"><span>亮度</span>' +
            '<input type="range" data-crop="bright" min="70" max="130" value="100"></label>' +
          '<label class="crop-row"><span>对比度</span>' +
            '<input type="range" data-crop="contrast" min="70" max="130" value="100"></label>' +
          '<div class="crop-row crop-bg">' +
            '<span>底色</span>' +
            '<span class="crop-swatches">' +
              '<button class="crop-sw on" data-crop="bg" data-val="#ffffff" style="background:#ffffff" title="白底"></button>' +
              '<button class="crop-sw" data-crop="bg" data-val="#438edb" style="background:#438edb" title="蓝底"></button>' +
              '<button class="crop-sw" data-crop="bg" data-val="#d7dbe0" style="background:#d7dbe0" title="灰底"></button>' +
            '</span>' +
          '</div>' +
          '<div class="crop-size" data-crop="size"></div>' +
        '</div>' +
        '<div class="crop-foot">' +
          '<button class="btn ghost" data-crop="cancel">取消</button>' +
          '<button class="btn primary" data-crop="apply">应用</button>' +
        '</div>' +
      '</div>';

    doc.body.appendChild(mask);

    canvas = mask.querySelector('.crop-canvas');
    ctx = canvas.getContext('2d');
    rangeScale = mask.querySelector('[data-crop="scale"]');
    rangeBright = mask.querySelector('[data-crop="bright"]');
    rangeContrast = mask.querySelector('[data-crop="contrast"]');
    sizeInfo = mask.querySelector('[data-crop="size"]');

    /* 拖拽 */
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('is-drag');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dx += e.clientX - lastX;
      dy += e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      clampPan();
      draw();
    });
    var endDrag = function () {
      dragging = false;
      canvas.classList.remove('is-drag');
      updateSizeInfo();
    };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    /* 滚轮缩放 */
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      var step = e.deltaY > 0 ? -0.06 : 0.06;
      applyScaleScale(scale + step);
      rangeScale.value = Math.round(scale / baseScaleForSlider() * 100);
      draw();
      updateSizeInfo();
    }, { passive: false });

    /* 滑块 */
    rangeScale.addEventListener('input', function () {
      applyScaleScale(baseScaleForSlider() * (parseInt(this.value, 10) / 100));
      draw();
      updateSizeInfo();
    });
    rangeBright.addEventListener('input', function () {
      brightness = parseInt(this.value, 10);
      draw();
      updateSizeInfo();
    });
    rangeContrast.addEventListener('input', function () {
      contrast = parseInt(this.value, 10);
      draw();
      updateSizeInfo();
    });

    /* 底色 */
    mask.querySelectorAll('[data-crop="bg"]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        mask.querySelectorAll('[data-crop="bg"]').forEach(function (b) { b.classList.remove('on'); });
        btn.classList.add('on');
        bg = btn.getAttribute('data-val');
        draw();
        updateSizeInfo();
      });
    });

    /* 按钮 */
    mask.addEventListener('click', function (e) {
      var el = e.target.closest('[data-crop]');
      if (!el) {
        if (e.target === mask) close();
        return;
      }
      var act = el.getAttribute('data-crop');
      if (act === 'close' || act === 'cancel') close();
      else if (act === 'apply') apply();
    });

    doc.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mask && mask.classList.contains('on')) close();
    });
  }

  function baseScaleForSlider() {
    if (!img) return 1;
    return Math.max(STAGE_W / img.width, STAGE_H / img.height);
  }

  function applyScaleScale(next) {
    if (!img) return;
    var base = baseScaleForSlider();
    scale = clamp(next, base, base * 3);
    clampPan();
  }

  /* ---------------- 开关 ---------------- */

  function close() {
    if (!mask) return;
    mask.classList.remove('on');
    doc.body.style.overflow = '';
    img = null;
    onDone = null;
  }

  function apply() {
    var url = exportDataURL();
    if (!url) {
      if (RS.app) RS.app.toast('照片处理失败，请换一张试试', 'err');
      return;
    }
    var done = onDone;
    var kb = kbOfDataURL(url);
    close();
    if (done) done(url, kb);
  }

  /**
   * 打开裁剪器
   * @param {File} file 原始图片
   * @param {Function} callback (dataURL, sizeKB) => void
   */
  function open(file, callback) {
    build();

    onDone = callback;
    fileName = file && file.name ? file.name : '';
    stageSrcKB = file ? Math.round(file.size / 1024) : 0;

    var loadWithBitmap = (typeof window.createImageBitmap === 'function');

    var start = function (source) {
      img = source;
      resetView();
      scale = baseScaleForSlider();
      dx = (STAGE_W - img.width * scale) / 2;
      dy = (STAGE_H - img.height * scale) / 2;

      brightness = 100;
      contrast = 100;
      bg = '#ffffff';
      rangeBright.value = 100;
      rangeContrast.value = 100;
      rangeScale.value = 100;
      mask.querySelectorAll('[data-crop="bg"]').forEach(function (b, i) {
        b.classList.toggle('on', i === 0);
      });

      draw();
      updateSizeInfo();

      mask.classList.add('on');
      doc.body.style.overflow = 'hidden';
    };

    // 解码只允许成功一次（主路径与兜底可能竞争）
    var started = false;
    function startOnce(source) {
      if (started || !source) return;
      started = true;
      start(source);
    }

    if (loadWithBitmap) {
      // createImageBitmap 是异步解码，大图不会阻塞主线程
      window.createImageBitmap(file).then(startOnce).catch(function () {
        fallbackLoad(file, startOnce);
      });
      // 兜底：部分环境解码迟迟不返回，1.2s 后改走 FileReader
      window.setTimeout(function () {
        if (!started) fallbackLoad(file, startOnce);
      }, 1200);
    } else {
      fallbackLoad(file, startOnce);
    }
  }

  function fallbackLoad(file, cb) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var image = new Image();
      image.onload = function () { cb(image); };
      image.onerror = function () {
        if (RS.app) RS.app.toast('图片读取失败', 'err');
      };
      image.src = String(e.target.result);
    };
    reader.onerror = function () {
      if (RS.app) RS.app.toast('文件读取失败', 'err');
    };
    reader.readAsDataURL(file);
  }

  RS.photo = {
    open: open,
    close: close,
    OUT_W: OUT_W,
    OUT_H: OUT_H
  };

})(window);

</script>
<script>
/* ==== backup.js ==== */
/* ==================================================================
   本地备份与离开保护（Backup Guard）
   ------------------------------------------------------------------
   1. 记录「上次备份时间」，超过 7 天温和提醒
   2. 浏览器支持 File System Access 时，可绑定一个本地 JSON 文件，
      之后每次自动保存都会同步写入该文件（需授权一次）
   3. 落盘失败（隐私模式 / 配额满）时在界面明确提示，并在离开时拦截

   说明：FileSystemFileHandle 不可序列化，只能存 IndexedDB
        （这是本项目除 localStorage 之外的第二处本地存储）
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var doc = document;

  var DB_NAME = 'resume-studio-fs';
  var STORE = 'handles';
  var HANDLE_KEY = 'backup';
  var STALE_DAYS = 7;

  var supported = typeof window.showSaveFilePicker === 'function';
  var handle = null;
  var lastWriteAt = 0;
  var writeError = '';
  var binding = false;

  /* ---------------- IndexedDB 极简封装 ---------------- */

  function openDB() {
    return new Promise(function (resolve, reject) {
      if (!window.indexedDB) return reject(new Error('no-indexeddb'));
      var req = window.indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error || new Error('idb-open-failed')); };
    });
  }

  function idbOp(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(STORE, mode);
        var store = tx.objectStore(STORE);
        var req = fn(store);
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error); };
        tx.oncomplete = function () { try { db.close(); } catch (e) { } };
      });
    });
  }

  function idbSet(k, v) { return idbOp('readwrite', function (s) { return s.put(v, k); }); }
  function idbGet(k) { return idbOp('readonly', function (s) { return s.get(k); }); }
  function idbDel(k) { return idbOp('readwrite', function (s) { return s.delete(k); }); }

  /* ---------------- 备份内容 ---------------- */

  function buildJSON() {
    return JSON.stringify({
      _app: 'resume-studio',
      _version: 1,
      schemaVersion: RS.store.schemaVersion,
      exportedAt: new Date().toISOString(),
      doc: RS.store.state
    }, null, 2);
  }

  /* ---------------- 写入 ---------------- */

  function write() {
    if (!handle) return Promise.resolve(false);

    return Promise.resolve()
      .then(function () {
        // 页面重载后权限可能失效，先查询再按需申请
        if (handle.queryPermission) {
          return handle.queryPermission({ mode: 'readwrite' }).then(function (p) {
            if (p === 'granted') return p;
            if (handle.requestPermission) {
              return handle.requestPermission({ mode: 'readwrite' });
            }
            return p;
          });
        }
        return 'granted';
      })
      .then(function (perm) {
        if (perm !== 'granted') {
          writeError = '未获得该文件的写入权限';
          render();
          return false;
        }
        return handle.createWritable().then(function (w) {
          return w.write(buildJSON()).then(function () {
            return w.close();
          });
        }).then(function () {
          lastWriteAt = Date.now();
          writeError = '';
          render();
          return true;
        });
      })
      .catch(function (e) {
        writeError = (e && e.message) ? e.message : '写入失败';
        render();
        return false;
      });
  }

  /* ---------------- 绑定 / 解绑 ---------------- */

  function bind() {
    if (!supported || binding) return Promise.resolve(false);
    binding = true;

    var name = RS.store.state.profile.name || 'resume';
    return window.showSaveFilePicker({
      suggestedName: '简历备份-' + name + '.json',
      types: [{
        description: 'JSON 备份',
        accept: { 'application/json': ['.json'] }
      }]
    }).then(function (h) {
      handle = h;
      return idbSet(HANDLE_KEY, h).catch(function () { /* 存不了也能用，只是下次要重新授权 */ });
    }).then(function () {
      return write();
    }).then(function (ok) {
      binding = false;
      render();
      if (ok && RS.app) RS.app.toast('已绑定本地备份文件，之后会自动同步', 'ok');
      return ok;
    }).catch(function (e) {
      binding = false;
      render();
      // 用户取消不算错误
      if (e && e.name === 'AbortError') return false;
      if (RS.app) RS.app.toast('绑定失败：' + (e && e.message ? e.message : '未知原因'), 'err');
      return false;
    });
  }

  function unbind() {
    handle = null;
    lastWriteAt = 0;
    writeError = '';
    idbDel(HANDLE_KEY).catch(function () { });
    render();
  }

  /* ---------------- 状态文本 ---------------- */

  function daysSince(ts) {
    if (!ts) return Infinity;
    return Math.floor((Date.now() - ts) / 86400000);
  }

  function status() {
    var last = RS.store.lastBackupAt();
    return {
      supported: supported,
      bound: !!handle,
      lastWriteAt: lastWriteAt,
      writeError: writeError,
      lastBackupAt: last,
      daysSinceBackup: daysSince(last),
      stale: daysSince(last) >= STALE_DAYS
    };
  }

  /* ---------------- 渲染 ---------------- */

  function render() {
    var el = doc.getElementById('backupLine');
    if (!el) return;

    var st = status();
    var html = '';
    var cls = 'backup-line';

    if (st.writeError) {
      cls += ' is-error';
      html = '<span class="bl-dot"></span>自动备份失败：' + escapeHtml(st.writeError);
    } else if (st.bound) {
      cls += ' is-ok';
      html = '<span class="bl-dot"></span>已绑定本地文件 · 自动同步';
    } else if (!st.lastBackupAt) {
      cls += ' is-stale';
      html = '<span class="bl-dot"></span>尚未备份' +
        (st.supported ? ' · <button class="bl-link" data-bk="bind">绑定本地文件</button>' : '');
    } else if (st.stale) {
      cls += ' is-stale';
      html = '<span class="bl-dot"></span>已 ' + st.daysSinceBackup + ' 天未备份' +
        (st.supported ? ' · <button class="bl-link" data-bk="bind">绑定本地文件</button>' : '');
    } else {
      html = '<span class="bl-dot"></span>上次备份 ' +
        (st.daysSinceBackup === 0 ? '今天' : st.daysSinceBackup + ' 天前');
    }

    el.className = cls;
    el.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
    });
  }

  /* ---------------- 初始化 ---------------- */

  function init() {
    render();

    var el = doc.getElementById('backupLine');
    if (el) {
      el.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-bk]');
        if (!btn) {
          // 点击整行也视为请求绑定
          if (supported && !handle) bind();
          return;
        }
        if (btn.getAttribute('data-bk') === 'bind') bind();
      });
    }

    // 每次成功落盘后同步到绑定文件
    RS.bus.on('doc:saved', function () {
      if (handle) write();
    });

    // 导出后刷新「上次备份」显示
    RS.bus.on('backup:record', render);

    // 恢复上次绑定的文件句柄（权限可能已失效，仅作提示）
    if (supported) {
      idbGet(HANDLE_KEY).then(function (h) {
        if (!h) return;
        handle = h;
        return h.queryPermission && h.queryPermission({ mode: 'readwrite' });
      }).then(function (perm) {
        if (handle && perm !== 'granted') writeError = '';
        render();
      }).catch(function () { render(); });
    }
  }

  /* ---------------- 离开保护 ---------------- */
  // 仅在「落盘失败」时拦截：已持久化到 localStorage 的改动无需打扰用户
  window.addEventListener('beforeunload', function (e) {
    if (RS.store && RS.store.hasSaveFailed && RS.store.hasSaveFailed()) {
      e.preventDefault();
      e.returnValue = '本地保存失败，离开将丢失未保存的修改';
      return e.returnValue;
    }
  });

  RS.backup = {
    supported: supported,
    bind: bind,
    unbind: unbind,
    write: write,
    status: status,
    render: render
  };

  if (doc.readyState === 'loading') {
    doc.addEventListener('DOMContentLoaded', function () { window.setTimeout(init, 0); });
  } else {
    window.setTimeout(init, 0);
  }

})(window);

</script>
<script>
/* ==== splitter.js ==== */
/* ==================================================================
   可拖动分界线（Splitter）
   ------------------------------------------------------------------
   布局原理：.app 网格为 4 列 —— 导航 | 编辑(var) | 分界(6px) | 预览(1fr)
   拖动只改变 --editor-w，预览列用 1fr 自动吃掉剩余空间，
   因此「两侧同步变化、总和恒定」是布局的天然结果，无需补偿计算。

   约束：
     · 编辑面板最小 340px、预览区最小 360px
     · 上限由容器宽度动态推导，无论如何拖都不会越界
     · 松开后写入 localStorage，下次打开保持
     · 窗口缩放时自动重新夹取，避免残留越界宽度
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var doc = document;

  var STORE_KEY = 'resume-studio:ui:editorWidth';
  var MIN_EDITOR = 340;
  var MIN_PREVIEW = 360;
  var GAP = 6;
  var DEFAULT_W = 432;
  var MQ_MOBILE = '(max-width:880px)';

  var app = null, nav = null, editor = null, splitter = null;
  var dragging = false;
  var startX = 0, startW = 0;
  var lastW = 0;
  var fitRaf = null;
  var inited = false;

  function isMobile() {
    return window.matchMedia(MQ_MOBILE).matches;
  }

  /** 夹取到合法区间：上限随容器宽度动态变化 */
  function clampWidth(w) {
    if (!app || !nav) return DEFAULT_W;
    var total = app.getBoundingClientRect().width;
    var navW = nav.getBoundingClientRect().width;
    var upper = total - navW - GAP - MIN_PREVIEW;
    // 容器过窄时优先保证编辑面板可用
    if (upper < MIN_EDITOR) upper = MIN_EDITOR;
    var v = Math.min(upper, Math.max(MIN_EDITOR, w));
    return Math.round(v);
  }

  function applyWidth(w) {
    if (!app) return;
    lastW = w;
    app.style.setProperty('--editor-w', w + 'px');
    if (splitter) {
      splitter.setAttribute('aria-valuenow', String(w));
      splitter.setAttribute('aria-valuemax', String(clampWidth(1e9)));
    }
  }

  function persist(w) {
    try { window.localStorage.setItem(STORE_KEY, String(w)); }
    catch (e) { /* 本地存储不可用则忽略，不影响拖拽 */ }
  }

  function restore() {
    try {
      var v = parseInt(window.localStorage.getItem(STORE_KEY), 10);
      if (isFinite(v) && v > 0) return v;
    } catch (e) { /* 忽略 */ }
    return null;
  }

  /** 拖动中让预览区重新适配缩放（rAF 节流，避免每像素重算） */
  function scheduleFit() {
    if (fitRaf) return;
    fitRaf = window.requestAnimationFrame(function () {
      fitRaf = null;
      window.dispatchEvent(new Event('resize'));
    });
    // rAF 不推进时的兜底
    window.setTimeout(function () {
      if (fitRaf) { window.cancelAnimationFrame(fitRaf); fitRaf = null; }
    }, 120);
  }

  /* ---------------- 拖拽 ---------------- */
  function onDown(e) {
    if (isMobile()) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = editor.getBoundingClientRect().width;

    doc.body.classList.add('is-resizing');
    splitter.classList.add('is-active');
    splitter.setAttribute('aria-valuemin', String(MIN_EDITOR));

    try { splitter.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  }

  function onMove(e) {
    if (!dragging) return;
    e.preventDefault();
    var w = clampWidth(startW + (e.clientX - startX));
    if (w !== lastW) {
      applyWidth(w);
      scheduleFit();
    }
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    doc.body.classList.remove('is-resizing');
    splitter.classList.remove('is-active');
    persist(lastW);
    scheduleFit();
  }

  /* ---------------- 键盘可达性 ---------------- */
  function onKey(e) {
    if (isMobile()) return;
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    var step = e.shiftKey ? 48 : 16;
    var cur = editor.getBoundingClientRect().width;
    var w = clampWidth(cur + (e.key === 'ArrowRight' ? step : -step));
    if (w === Math.round(cur)) return;
    applyWidth(w);
    persist(w);
    scheduleFit();
  }

  /* ---------------- 窗口缩放：重新夹取 ---------------- */
  function onWindowResize() {
    if (isMobile() || !editor) return;
    var cur = editor.getBoundingClientRect().width;
    var w = clampWidth(cur);
    if (Math.abs(w - cur) > 1) applyWidth(w);
  }

  function init() {
    if (inited) return;
    inited = true;

    app = doc.querySelector('.app');
    if (!app) return;
    nav = app.querySelector('.nav');
    editor = doc.getElementById('editorPane');
    splitter = doc.getElementById('splitter');
    if (!nav || !editor || !splitter) return;

    // 仅当存在历史值时接管宽度；否则保留 CSS 断点里的默认值
    var saved = restore();
    if (saved) applyWidth(clampWidth(saved));
    else applyWidth(clampWidth(editor.getBoundingClientRect().width));

    splitter.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive: false });
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    splitter.addEventListener('keydown', onKey);

    // 双击复位
    splitter.addEventListener('dblclick', function () {
      var w = clampWidth(DEFAULT_W);
      applyWidth(w);
      persist(w);
      scheduleFit();
      if (RS.app && RS.app.toast) RS.app.toast('已恢复默认分栏比例', 'ok');
    });

    window.addEventListener('resize', onWindowResize);

    // 初次进入时按当前容器夹取一次（可能因小屏打开而越界）
    onWindowResize();
  }

  /* ------------------------------------------------------------------
     命名空间必须「同步」定义：资源自检脚本在 DOMContentLoaded 之前
     就会检查 RS.splitter 是否存在，若延迟到 init 内赋值会被误判为
     文件缺失并弹出全屏遮罩。因此这里立即挂载，方法内部再惰性初始化。
     ------------------------------------------------------------------ */
  RS.splitter = {
    getWidth: function () { init(); return lastW; },
    setWidth: function (w) {
      init();
      var v = clampWidth(w);
      applyWidth(v);
      persist(v);
      scheduleFit();
      return v;
    },
    reset: function () {
      init();
      var v = clampWidth(DEFAULT_W);
      applyWidth(v);
      persist(v);
      scheduleFit();
      return v;
    },
    clamp: function (w) { init(); return clampWidth(w); },
    limits: { minEditor: MIN_EDITOR, minPreview: MIN_PREVIEW }
  };

  if (doc.readyState === 'loading') {
    doc.addEventListener('DOMContentLoaded', function () { window.setTimeout(init, 0); });
  } else {
    init();
  }

})(window);

</script>
<script>
/* ==== enhance.js ==== */
/* ==================================================================
   体验增强层（Enhancement Layer）
   ------------------------------------------------------------------
   设计原则：只做「注入与增强」，不修改任何原有模块的逻辑与数据流。
   职责：
     1. 移动端「编辑 / 预览」分段切换（修复预览在窄屏被隐藏的问题）
     2. 移动端首次使用的编辑方式提示（双击进入实时编辑）
     3. 视口回到桌面时自动清理移动端状态
   所有行为都通过 body class + CSS 实现，原有功能代码零改动。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var doc = document;

  var MQ_MOBILE = '(max-width:880px)';
  var HINT_KEY = 'resume-studio:mobile-hint-shown';

  var switchEl = null;
  var mq = null;
  var badgeTimer = null;

  function isMobile() {
    return mq ? mq.matches : false;
  }

  /* ---------------- 分段切换控件 ---------------- */
  function buildSwitch() {
    if (doc.getElementById('mobileSwitch')) return;

    switchEl = doc.createElement('div');
    switchEl.id = 'mobileSwitch';
    switchEl.className = 'mobile-switch';
    switchEl.setAttribute('role', 'tablist');
    switchEl.setAttribute('aria-label', '编辑与预览切换');

    switchEl.innerHTML =
      '<button role="tab" aria-selected="true" data-ms="edit" class="on">' +
        '<span>编辑</span>' +
      '</button>' +
      '<button role="tab" aria-selected="false" data-ms="preview">' +
        '<span>预览</span>' +
        '<span class="ms-badge" id="msPageBadge">0</span>' +
      '</button>';

    doc.body.appendChild(switchEl);

    switchEl.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-ms]');
      if (!btn) return;
      var mode = btn.getAttribute('data-ms');
      setMode(mode);
    });
  }

  function setMode(mode) {
    if (!switchEl) return;
    var preview = mode === 'preview';

    doc.body.classList.toggle('is-mobile-preview', preview);

    Array.prototype.forEach.call(switchEl.querySelectorAll('[data-ms]'), function (b) {
      var on = b.getAttribute('data-ms') === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    // 切到预览时容器尺寸才确定，触发一次自适应缩放
    if (preview) {
      window.setTimeout(function () {
        window.dispatchEvent(new Event('resize'));
        var sc = doc.getElementById('previewScroll');
        if (sc) sc.scrollTop = 0;
      }, 80);
    }
    updateBadge();
  }

  function updateBadge() {
    var badge = doc.getElementById('msPageBadge');
    if (!badge) return;
    var n = (RS.app && RS.app.pageCount) ? RS.app.pageCount() : 0;
    badge.textContent = n;
    badge.style.display = n > 1 ? '' : 'none';
  }

  /* ---------------- 移动端首次提示 ---------------- */
  function maybeHint() {
    if (!isMobile()) return;
    try {
      if (window.sessionStorage.getItem(HINT_KEY)) return;
      window.sessionStorage.setItem(HINT_KEY, '1');
    } catch (e) { /* 隐私模式下忽略 */ }

    window.setTimeout(function () {
      if (RS.app && RS.app.toast) {
        RS.app.toast('手机上点「预览」看简历；双击纸张文字可进入编辑', 'info');
      }
    }, 1400);
  }

  /* ---------------- 视口变化 ---------------- */
  function bindMQ() {
    if (!window.matchMedia) return;
    mq = window.matchMedia(MQ_MOBILE);

    var onChange = function () {
      if (!isMobile()) {
        // 回到桌面：清理移动端状态，恢复三栏
        doc.body.classList.remove('is-mobile-preview');
        if (switchEl) {
          Array.prototype.forEach.call(switchEl.querySelectorAll('[data-ms]'), function (b) {
            var on = b.getAttribute('data-ms') === 'edit';
            b.classList.toggle('on', on);
            b.setAttribute('aria-selected', on ? 'true' : 'false');
          });
        }
      }
      window.setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 60);
    };

    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  /* ---------------- 键盘可达性补强 ---------------- */
  function bindKeys() {
    // 在移动端分段控件上支持左右方向键切换
    doc.addEventListener('keydown', function (e) {
      if (!switchEl || !isMobile()) return;
      if (doc.activeElement !== switchEl && !switchEl.contains(doc.activeElement)) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      setMode(doc.body.classList.contains('is-mobile-preview') ? 'edit' : 'preview');
    });
  }

  /* ---------------- 对外 ---------------- */
  RS.enhance = {
    setMode: setMode,
    updateBadge: updateBadge,
    isMobile: isMobile
  };

  function init() {
    RS.enhance._inited = true;
    buildSwitch();
    bindMQ();
    bindKeys();
    maybeHint();

    // 页数徽标跟随分页结果更新（轻量轮询，仅移动端有意义）
    badgeTimer = window.setInterval(updateBadge, 1200);

    // 面板切换后也刷新一次
    if (RS.bus && RS.bus.on) {
      RS.bus.on('doc:saved', updateBadge);
    }
  }

  if (doc.readyState === 'loading') {
    doc.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})(window);

</script>
<script>
/* ==================================================================
   资源完整性自检（此脚本内联于 index.html，不依赖任何外部文件）
   场景：只把本文件单独复制到别处、未带上 assets 文件夹时，
        页面会变成无样式裸文本。这里检测缺失并给出明确的解决指引。
   ================================================================== */
(function () {
  var problems = [];

  /* CSS 检测：brand-mark 在 app.css 中定义了 border-radius:9px，
     浏览器默认值为 0px —— 以此判断样式表是否生效 */
  var probe = document.createElement('div');
  probe.className = 'brand-mark';
  probe.style.cssText = 'position:absolute;left:-9999px;top:-9999px;width:32px;height:32px;';
  document.body.appendChild(probe);
  var radius = window.getComputedStyle(probe).borderRadius;
  document.body.removeChild(probe);
  if (radius === '0px') problems.push('assets/css/app.css（界面样式）');

  /* JS 检测：按「模块挂载名 → 文件名」逐一核对
     （注意 sections.js 挂载为 RS.render，inline-edit.js 挂载为 RS.inline） */
  var needJS = [
    { mount: 'store',      file: 'store.js' },
    { mount: 'theme',      file: 'theme.js' },
    { mount: 'templates',  file: 'templates.js' },
    { mount: 'render',     file: 'sections.js' },
    { mount: 'paginate',   file: 'paginate.js' },
    { mount: 'editor',     file: 'editor.js' },
    { mount: 'exporter',   file: 'exporter.js' },
    { mount: 'inline',     file: 'inline-edit.js' },
    { mount: 'importer',   file: 'importer.js' },
    { mount: 'reviewer',   file: 'reviewer.js' },
    { mount: 'coach',      file: 'coach.js' },
    { mount: 'photo',      file: 'photo.js' },
    { mount: 'backup',     file: 'backup.js' },
    { mount: 'splitter',   file: 'splitter.js' },
    { mount: 'enhance',    file: 'enhance.js' }
  ];
  if (typeof window.RS === 'undefined') {
    problems.push('assets/js/（全部脚本）');
  } else {
    needJS.forEach(function (m) {
      if (!window.RS[m.mount]) problems.push('assets/js/' + m.file);
    });
  }

  if (!problems.length) return;

  function show() {
    var mask = document.createElement('div');
    mask.style.cssText = 'position:fixed;top:0;right:0;bottom:0;left:0;z-index:99999;' +
      'background:#101319;color:#e8ecf3;font-family:"Microsoft YaHei","PingFang SC",sans-serif;' +
      'line-height:1.8;overflow:auto;';
    mask.innerHTML =
      '<div style="max-width:660px;margin:8vh auto 40px;padding:32px 36px;background:#161a21;' +
      'border:1px solid #333c4b;border-radius:14px;">' +
        '<h2 style="margin:0 0 6px;font-size:20px;color:#fff;">资源文件缺失，页面无法运行</h2>' +
        '<p style="margin:0 0 14px;font-size:13px;color:#8892a2;">' +
          'index.html 必须与 <b style="color:#e8ecf3">assets 文件夹</b>一起使用。' +
          '你当前打开的可能是单独复制出来的这个文件。' +
        '</p>' +
        '<div style="padding:10px 14px;border-radius:8px;background:#1d222b;font-size:12px;color:#b3bccb;margin-bottom:18px;">' +
          '检测到缺失：<b style="color:#f5c163">' + problems.join('、') + '</b>' +
        '</div>' +
        '<h3 style="margin:0 0 8px;font-size:14px;color:#e8ecf3;">解决方法</h3>' +
        '<ol style="margin:0 0 16px;padding-left:20px;font-size:13px;color:#b3bccb;">' +
          '<li style="margin-bottom:8px;">回到原始的 <b style="color:#e8ecf3">resume-studio 文件夹</b>，' +
              '双击其中的 <b style="color:#e8ecf3">index.html</b>（或 简历工坊.html 入口）—— ' +
              '移动或复制时请保持整个文件夹结构完整；</li>' +
          '<li>如果需要“单个文件随处携带”：先在原位置打开工具，进入' +
              '「导出与备份 → 导出单文件 HTML」，导出的文件才是样式与内容全部内联的自包含版本，' +
              '可以任意改名、放到任何位置。</li>' +
        '</ol>' +
        '<p style="margin:0;font-size:11px;color:#616b7c;">' +
          '数据不会因此丢失：简历内容保存在浏览器的 localStorage 中（与文件位置无关），' +
          '修复打开方式后，上次编辑的内容仍然在。</p>' +
      '</div>';
    document.body.appendChild(mask);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', show);
  } else {
    show();
  }
})();
</script>
</body>
</html>
