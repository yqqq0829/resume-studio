.paper[data-heading="underline"] .res-sec-title .sec-line{display:none;}

.paper[data-heading="bar"] .res-sec-title{
  color:var(--doc-accent,#2563eb);
  padding-left:9px;
  border-left:4px solid var(--doc-accent,#2563eb);
}
.paper[data-heading="bar"] .res-sec-title .sec-line{display:none;}

.paper[data-heading="block"] .res-sec-title{
  color:var(--doc-accent-deep,#1b4bb8);
  background:var(--doc-accent-soft,#eef3ff);
  padding:5px 10px;
  border-radius:3px;
}
.paper[data-heading="block"] .res-sec-title .sec-line{display:none;}

.paper[data-heading="line"] .res-sec-title{color:#141b24;}
.paper[data-heading="line"] .res-sec-title .sec-line{background:#dce1e8;}

.paper[data-heading="plain"] .res-sec-title{color:#141b24;}
.paper[data-heading="plain"] .res-sec-title .sec-line{display:none;}

/* ---------- 项目符号形态 ---------- */
.paper[data-bullet="square"] .res-entry-list{list-style:square;}
.paper[data-bullet="dash"] .res-entry-list{list-style:none;padding-left:1.05em;}
.paper[data-bullet="dash"] .res-entry-list li{position:relative;}
.paper[data-bullet="dash"] .res-entry-list li::before{
  content:"\2013";
  position:absolute;
  left:-1.05em;
  color:var(--doc-accent,#2563eb);
}

/* ---------- ATS 安全模式 ----------
   目的：让简历在求职者追踪系统（ATS）中可被正确解析。
   做法：去装饰、去多列、去颜色依赖，只保留文本层次。
   注意：全部为「覆盖规则」，不修改任何模板原有定义；
        仅在 .paper[data-ats="1"] 时生效（导出时由 exporter 打标）。
   ------------------------------------------------------------------ */
/* 照片：多数 ATS 不解析图片，直接隐藏 */
.paper[data-ats="1"] .res-photo-wrap{display:none !important;}

/* 页眉：去除色块背景，统一为浅底深字 */
.paper[data-ats="1"] .res-head{
  background:none !important;
  color:inherit !important;
  margin:0 0 var(--doc-gap,14px) !important;
  padding:0 0 12px !important;
  border-bottom:1px solid #cfd6df;
}
.paper[data-ats="1"] .res-name{color:#10161f !important;}
.paper[data-ats="1"] .res-role{color:#3b4450 !important;letter-spacing:1px !important;}
.paper[data-ats="1"] .res-contact{color:#4c5663 !important;}
.paper[data-ats="1"] .res-contact span::before{color:#9aa2ae !important;}

/* 模块标题：去色块 / 去色条 / 去圆点，退化为加粗文本 + 细下划线 */
.paper[data-ats="1"] .res-sec-title{
  color:#11161d !important;
  background:none !important;
  border:0 !important;
  border-bottom:1px solid #cfd6df !important;
  border-radius:0 !important;
  padding:0 0 4px !important;
  letter-spacing:.5px !important;
  text-transform:none !important;
}
.paper[data-ats="1"] .res-sec-title .sec-line{display:none !important;}
.paper[data-ats="1"] .res-sec-title::before,
.paper[data-ats="1"] .res-sec-title::after{display:none !important;}

/* 条目装饰（如时间轴圆点）一律去除 */
.paper[data-ats="1"] .res-entry::before,
.paper[data-ats="1"] .res-entry::after{display:none !important;}
.paper[data-ats="1"] .res-entry{
  padding-left:0 !important;
  border-left:0 !important;
  margin-left:0 !important;
}

/* 技能：标签去底色与描边，进度条 / 星级退化为纯文本 */
.paper[data-ats="1"] .res-tag{
  background:none !important;
  border:0 !important;
  padding:0 !important;
  color:inherit !important;
  border-radius:0 !important;
}
.paper[data-ats="1"] .res-tags{gap:0 6px !important;}
.paper[data-ats="1"] .res-tag + .res-tag::before{
  content:"·";
  margin-right:5px;
  color:#9aa2ae;
}
.paper[data-ats="1"] .res-skill-track,
.paper[data-ats="1"] .res-skill-pct,
.paper[data-ats="1"] .res-stars{display:none !important;}
.paper[data-ats="1"] .res-skill-row{display:block !important;font-size:inherit !important;}
.paper[data-ats="1"] .res-skill-name{
  width:auto !important;
  display:inline !important;
  color:inherit !important;
}

/* 证书 / 语言：双列 -> 单列，避免解析时串行 */
.paper[data-ats="1"] .res-cert-grid,
.paper[data-ats="1"] .res-lang-grid{
  grid-template-columns:1fr !important;
}

/* 链接保持纯文本可读（颜色与下划线一律中性） */
.paper[data-ats="1"] .res-contact a{
  color:inherit !important;
  text-decoration:none !important;
}

/* ATS 下双栏模板退化为单列：双栏布局会让文本提取串行错位，
   等于该模板下 ATS 完全失效。仅覆盖规则，不改 two-column 原定义。
   退化后 DOM 顺序即阅读顺序：左栏内容 → 右栏内容。 */
.paper[data-ats="1"][data-template="two-column"] .res-two-col{display:block;}
.paper[data-ats="1"][data-template="two-column"] .res-col-left{
  flex:none;
  width:auto;
  padding-right:0;
  border-right:0;
  margin-bottom:var(--doc-gap,14px);
}
.paper[data-ats="1"][data-template="two-column"] .res-col-right{
  flex:none;
  width:auto;
}

/* ---------- 打印与导出（自包含：导出单文件时整段内联） ---------- */
@media print{
  /* 纸张尺寸由 .paper 的 210×297mm 决定，页边距交给 .paper 的 padding。
     因此 @page 必须归零，否则浏览器默认边距会与 --doc-margin 叠加，
     导致 PDF 尺寸偏小、内容被挤压。 */
  @page{size:A4;margin:0;}

  html,body{margin:0;padding:0;background:#fff;}

  .paper{
    box-shadow:none !important;
    margin:0 !important;
    transform:none !important;
    transform-origin:top left !important;
    border-radius:0 !important;
  }
  /* 多页之间不得产生额外空白页 */
  .paper + .paper{margin-top:0 !important;}
  /* 预览用的页码标签不得进入打印 */
  .paper::after{display:none !important;}
  /* 编辑辅助元素（拖拽手柄）绝不进入打印与导出 */
  .drag-handle{display:none !important;}

  /* sidebar 模板：深色页眉在黑白打印下会糊成黑块、白字易丢，
     打印时改为浅底深字 + 底部主色细线。屏幕预览保持原样。 */
  .paper[data-template="sidebar"] .res-head{
    background:#f2f4f7 !important;
    color:#1b212b !important;
    border-bottom:2px solid var(--doc-accent,#2563eb);
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }
  .paper[data-template="sidebar"] .res-name{color:#10161f !important;}
  .paper[data-template="sidebar"] .res-role{color:var(--doc-accent,#2563eb) !important;}
  .paper[data-template="sidebar"] .res-contact{color:#4c5663 !important;}
  .paper[data-template="sidebar"] .res-contact span:not(:first-child)::before{color:#9aa2ae !important;}
  .paper[data-template="sidebar"] .res-photo{border-color:#dfe3e9 !important;background:#fff !important;}
}
</style>
</head>

     ------------------------------------------------------------------ */
  var MIGRATIONS = {
    /* v1 -> v2：P0-1 / P0-2 引入的字段 */
    1: function (doc) {
      var p = doc.profile || (doc.profile = {});
      if (p.wechat === undefined) p.wechat = '';
      if (p.seniority === undefined) p.seniority = '';

  /**
   * 按 meta.version 逐级迁移到当前版本。
   * 遇到高于当前的版本直接抛错 —— 由调用方决定如何处理（导入时拒绝）。
   */

    if (!doc || typeof doc !== 'object') return doc;
    var v = (doc.meta && parseInt(doc.meta.version, 10)) || 1;

    if (v > SCHEMA_VERSION) {
      var err = new Error('这份数据的版本（v' + v + '）比当前程序（v' + SCHEMA_VERSION + '）更新，请升级后再导入');

      err.version = v;
      throw err;

      var fn = MIGRATIONS[v];
      if (!fn) break;
      doc = fn(doc) || doc;
      v += 1;
      if (!doc.meta) doc.meta = {};
      doc.meta.version = v;
    }
    return doc;
  }

  var util = RS.util = {
    uid: function () {
      return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);

    clone: function (o) {
      return JSON.parse(JSON.stringify(o));

    escapeHtml: function (str) {
      if (str === null || str === undefined) return '';
      return String(str)

        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')

  /* -------------------- 数据校正（防止旧版本/损坏数据导致崩溃） -------------------- */
  function normalize(raw) {
    var base = blankDoc();
    if (!raw || typeof raw !== 'object') return base;

    var out = base;

    // meta
    out.meta.createdAt = raw.meta && raw.meta.createdAt ? raw.meta.createdAt : Date.now();
    out.meta.updatedAt = raw.meta && raw.meta.updatedAt ? raw.meta.updatedAt : Date.now();

    // profile
    if (raw.profile && typeof raw.profile === 'object') {
      Object.keys(base.profile).forEach(function (k) {
        if (raw.profile[k] !== undefined && raw.profile[k] !== null) {
          out.profile[k] = String(raw.profile[k]);
        }
      });
    }

    // style
    if (raw.style && typeof raw.style === 'object') {
      Object.keys(base.style).forEach(function (k) {
        if (raw.style[k] !== undefined && raw.style[k] !== null) {
          out.style[k] = raw.style[k];
        }
      });
    }

    // order / visible / titles
    if (Array.isArray(raw.order) && raw.order.length) {
      var seen = {};
      var merged = [];
      raw.order.forEach(function (id) {
        if (base.visible.hasOwnProperty(id) && !seen[id]) {
          seen[id] = 1;
          merged.push(id);
        }
      });
      base.order.forEach(function (id) {
        if (!seen[id]) merged.push(id);
      });
      out.order = merged;
    }
    if (raw.visible && typeof raw.visible === 'object') {
      Object.keys(base.visible).forEach(function (k) {
        if (typeof raw.visible[k] === 'boolean') out.visible[k] = raw.visible[k];
      });
    }
    if (raw.titles && typeof raw.titles === 'object') {
      Object.keys(base.titles).forEach(function (k) {
        if (typeof raw.titles[k] === 'string' && raw.titles[k].trim()) {
          out.titles[k] = raw.titles[k];
        }
      });
    }

    // 变体：原样保留结构，内容由 ensureVariants 兜底校正
    if (raw.variants && typeof raw.variants === 'object' && Array.isArray(raw.variants.list)) {
      out.variants = {
        active: String(raw.variants.active || ''),
        list: raw.variants.list.filter(function (v) {
          return v && v.id;
        }).map(function (v) {
          return {
            id: String(v.id),
            name: String(v.name || '未命名'),
            profile: (v.profile && typeof v.profile === 'object') ? v.profile : {},
            data: (v.data && typeof v.data === 'object') ? v.data : {}
          };
        })
      };
    }

    // 各模块条目：统一补 id、保证字段为字符串
    Object.keys(out.data).forEach(function (key) {
      var arr = raw.data && raw.data[key];
      if (!Array.isArray(arr)) return;
      out.data[key] = arr.filter(function (it) {
        return it && typeof it === 'object';
      }).map(function (src) {
        var it = {};
        Object.keys(src).forEach(function (f) {
          it[f] = typeof src[f] === 'boolean' ? src[f] : (src[f] === null || src[f] === undefined ? '' : String(src[f]));
        });
        if (!it.id) it.id = util.uid();
        return it;
      });
    });

    return out;
  }

    /**
     * 按结束时间倒序排列经历类条目（就地修改 state）。
     * 仅在 autoSort 开启时由渲染前调用。
     * 说明：排序后数组顺序即 state 顺序，因此 data-edit-path 的索引始终一致。
     */
    autoSortItems: function () {
      ['education', 'experience', 'projects', 'custom'].forEach(function (k) {
        var arr = state.data[k];
        if (!arr || arr.length < 2) return;
        arr.sort(function (a, b) {
          // 「至今」视为最大值，始终排在最前
          var ea = a.current ? '9999-99' : (a.end || a.start || '');
          var eb = b.current ? '9999-99' : (b.end || b.start || '');
          if (ea === eb) return 0;
          return eb > ea ? 1 : -1;
        });
      });
    },

    saveNow: function () {
      if (!hasStorage) {
        saveFailed = true;
        dirtySinceSave = true;
        bus.emit('doc:savefail', new Error('本地存储不可用'));
        return false;
      }
      try {
        state.meta.updatedAt = Date.now();
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        lastSavedAt = new Date();
        dirtySinceSave = false;
        saveFailed = false;
        bus.emit('doc:saved', lastSavedAt);
        return true;
      } catch (e) {
        saveFailed = true;
        dirtySinceSave = true;
        console.error('[store] 保存失败', e);
        bus.emit('doc:savefail', e);
        return false;
      }
    },

    /** 防抖保存 */
    save: function () {
      bus.emit('doc:saving');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        store.saveNow();
      }, 600);
    },

    /** 标记内容已改动 */
    touch: function () {
      dirtySinceSave = true;
      state.meta.updatedAt = Date.now();
      bus.emit('doc:change');
      store.save();
    },

    blankDoc: blankDoc,
    sampleDoc: sampleDoc,
    normalize: normalize,
    migrate: migrate,

    /* ---------------- 备份时间记录 ---------------- */

    /** 记录一次成功导出（JSON / 单文件 HTML） */
    recordBackup: function () {
      try {
        var ts = Date.now();
        window.localStorage.setItem(BACKUP_KEY, String(ts));
        bus.emit('backup:record', ts);
        return ts;
      } catch (e) { return null; }
    },

    /** 上次备份时间戳（0 表示从未备份） */
    lastBackupAt: function () {
      try {
        var v = parseInt(window.localStorage.getItem(BACKUP_KEY), 10);
        return (isFinite(v) && v > 0) ? v : 0;
      } catch (e) { return 0; }
    },

    /** 是否存在未成功落盘的改动 */
    isDirty: function () { return dirtySinceSave; },
    /** 最近一次落盘是否失败（隐私模式 / 配额满） */
    hasSaveFailed: function () { return saveFailed; },
    schemaVersion: SCHEMA_VERSION
  };

  /* ==================================================================
     简历变体（Variants）
     ------------------------------------------------------------------
     模型：doc.variants = { active, list:[{id,name,profile,data}] }
     顶层 profile / data 始终是「当前变体」的投影 —— 因此渲染层、编辑层、
     导出层全部无需感知变体的存在。
     切换时先把当前内容回写到变体，再把目标变体投影到顶层。
     ================================================================== */
  function ensureVariants() {
    if (!state.variants || !Array.isArray(state.variants.list) || !state.variants.list.length) {
      state.variants = {
        active: 'v1',
        list: [{
          id: 'v1',
          name: '默认',
          profile: util.clone(state.profile),
          data: util.clone(state.data)
        }]
      };
    }
    var ids = state.variants.list.map(function (v) { return v.id; });
    if (ids.indexOf(state.variants.active) < 0) state.variants.active = ids[0];
    return state.variants;
  }

  function saveCurrentToVariant() {
    var vs = ensureVariants();
    var cur = vs.list.filter(function (v) { return v.id === vs.active; })[0];
    if (!cur) return;
    cur.profile = util.clone(state.profile);
    cur.data = util.clone(state.data);
  }

  function loadVariant(id) {
    var vs = ensureVariants();
    var target = vs.list.filter(function (v) { return v.id === id; })[0];
    if (!target) return false;
    vs.active = id;
    state.profile = util.clone(target.profile);
    state.data = util.clone(target.data);
    return true;
  }

  var variants = RS.variants = {
    /** 变体列表（含当前） */
    list: function () {
      return ensureVariants().list.map(function (v) {
        return { id: v.id, name: v.name };
      });
    },
    active: function () { return ensureVariants().active; },

    /**
     * 切换变体：保存当前 -> 载入目标 -> 清空历史（不允许跨变体撤销）
     */
    switchTo: function (id) {
      if (!id || id === ensureVariants().active) return false;
      saveCurrentToVariant();
      if (!loadVariant(id)) return false;
      if (RS.history) RS.history.clear('variant');
      store.saveNow();
      bus.emit('doc:replaced');
      return true;
    },

    /** 新建变体：以当前内容为模板复制一份 */
    add: function (name) {
      saveCurrentToVariant();
      var vs = ensureVariants();
      var id = 'v' + Math.random().toString(36).slice(2, 7);
      var label = String(name || '').trim() || ('变体 ' + (vs.list.length + 1));
      vs.list.push({
        id: id,
        name: label,
        profile: util.clone(state.profile),
        data: util.clone(state.data)
      });
      vs.active = id;
      if (RS.history) RS.history.clear('variant-add');
      store.saveNow();
      bus.emit('doc:replaced');
      return id;
    },

    rename: function (id, name) {
      var vs = ensureVariants();
      var v = vs.list.filter(function (x) { return x.id === id; })[0];
      if (!v || !String(name || '').trim()) return false;
      v.name = String(name).trim();
      store.saveNow();
      return true;
    },

    /** 删除变体：至少保留一个 */
    remove: function (id) {
      var vs = ensureVariants();
      if (vs.list.length <= 1) return false;
      var idx = -1;
      for (var i = 0; i < vs.list.length; i++) if (vs.list[i].id === id) idx = i;
      if (idx < 0) return false;
      vs.list.splice(idx, 1);
      if (vs.active === id) {
        vs.active = vs.list[0].id;
        loadVariant(vs.active);
      }
      if (RS.history) RS.history.clear('variant-del');
      store.saveNow();
      bus.emit('doc:replaced');
      return true;
    },

    /** 变体数量 */
    count: function () { return ensureVariants().list.length; }
  };

  /* ==================================================================
     撤销 / 重做（内存快照栈）
     ------------------------------------------------------------------
     · 只放内存，绝不写 localStorage —— 快照可能超出配额
     · 粒度：结构操作立即入栈；连续输入 500ms 防抖合并为一步
     · 上限 50 步，超出丢弃最早的一条
     · 导入 / 切换文档后必须 clear()，否则会在两份数据间来回横跳
     ================================================================== */
  var HIST_LIMIT = 50;
  var HIST_DEBOUNCE = 500;

  var hist = { stack: [], index: -1, timer: null, muted: false };

  function snapshotJSON() {
    try { return JSON.stringify(state); } catch (e) { return null; }
  }

  function pushHistory(label) {
    if (hist.muted) return;
    var json = snapshotJSON();
    if (!json) return;
    // 与当前快照完全一致则不入栈，避免产生「无效撤销步」
    if (hist.index >= 0 && hist.stack[hist.index].json === json) return;

    // 从历史中途做了新操作 -> 丢弃 redo 分支
    if (hist.index < hist.stack.length - 1) {
      hist.stack = hist.stack.slice(0, hist.index + 1);
    }
    hist.stack.push({ json: json, label: label || '', at: Date.now() });
    if (hist.stack.length > HIST_LIMIT) hist.stack.shift();
    hist.index = hist.stack.length - 1;
    bus.emit('history:change');
  }

  function applySnapshot(json) {
    hist.muted = true;
    try {
      state = normalize(migrate(JSON.parse(json)));
    } catch (e) {
      console.error('[history] 快照恢复失败', e);
    }
    hist.muted = false;
    dirtySinceSave = true;
    bus.emit('doc:change', { source: 'history' });
    bus.emit('doc:replaced');
    store.saveNow();
  }

  var history = RS.history = {
    /** 立即入栈（增删、排序、切换模板等结构操作） */
    commit: function (label) {
      if (hist.timer) { clearTimeout(hist.timer); hist.timer = null; }
      pushHistory(label);
    },

    /** 防抖入栈（连续输入合并为一步） */
    commitLater: function (label) {
      if (hist.muted) return;
      if (hist.timer) clearTimeout(hist.timer);
      hist.timer = setTimeout(function () {
        hist.timer = null;
        pushHistory(label);
      }, HIST_DEBOUNCE);
    },

    undo: function () {
      // 有未提交的输入先落一步，避免撤销跳过最后一次编辑
      if (hist.timer) {
        clearTimeout(hist.timer);
        hist.timer = null;
        pushHistory('pending');
      }
      if (hist.index <= 0) return false;
      hist.index -= 1;
      applySnapshot(hist.stack[hist.index].json);
      bus.emit('history:change');
      return true;
    },

    redo: function () {
      if (hist.index >= hist.stack.length - 1) return false;
      hist.index += 1;
      applySnapshot(hist.stack[hist.index].json);
      bus.emit('history:change');
      return true;
    },

    canUndo: function () { return hist.index > 0; },
    canRedo: function () { return hist.index < hist.stack.length - 1; },

    /** 清空并重建基线（导入、切换文档时调用） */
    clear: function (label) {
      if (hist.timer) { clearTimeout(hist.timer); hist.timer = null; }
      hist.stack = [];
      hist.index = -1;
      pushHistory(label || 'reset');
    },

    depth: function () { return hist.stack.length; },
    position: function () { return hist.index; },
    limit: HIST_LIMIT
  };

})(window);

</script>
<script>
/* ==== theme.js ==== */
/* ==================================================================
   主题与配色（Theme）
   ------------------------------------------------------------------
   集中管理文档主题色：每套主题只声明一个主色，深/浅两档由同一色相
   推导，保证三者始终协调（自定义取色也能得到配套的 deep / soft）。

   同时提供 WCAG 对比度计算，用于提示「标题色在白底上是否够清晰」。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;

  /* 6 套预设：只存主色，deep/soft 统一推导 */
  var PRESETS = [
    { id: 'blue', name: '沉稳蓝', accent: '#1d4ed8', scene: '通用 / 互联网 / 金融' },
    { id: 'green', name: '墨绿', accent: '#0f766e', scene: '教育 / 医疗 / 环保' },
    { id: 'charcoal', name: '炭灰', accent: '#374151', scene: '工程 / 制造 / 极简' },
    { id: 'wine', name: '酒红', accent: '#9f1239', scene: '传媒 / 法律 / 品牌' },
    { id: 'indigo', name: '靛紫', accent: '#5b21b6', scene: '设计 / 创意 / 产品' },
    { id: 'brown', name: '暖棕', accent: '#92400e', scene: '建筑 / 文化 / 学术' }
  ];

  var byId = {};
  PRESETS.forEach(function (p) { byId[p.id] = p; });

  /* ---------------- 颜色工具 ---------------- */

  function hexToRgb(hex) { return U.hexToRgb(hex); }

  /** 相对亮度（WCAG 2.x） */
  function luminance(hex) {
    var c = hexToRgb(hex);
    var arr = [c.r, c.g, c.b].map(function (v) {
      v = v / 255;
      return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * arr[0] + 0.7152 * arr[1] + 0.0722 * arr[2];
  }

  /** 对比度：返回 1 ~ 21 */
  function contrast(hexA, hexB) {
    var a = luminance(hexA);
    var b = luminance(hexB);
    var hi = Math.max(a, b);
    var lo = Math.min(a, b);
    return (hi + 0.05) / (lo + 0.05);
  }

  /**
   * 由主色推导配套的深/浅两档。
   * - deep：用于「色块底 + 白字」场景，需保证与白字对比度 ≥ 4.5
   * - soft：用于标题底纹，与白底对比度保持在 1.1~1.3（很淡，不抢正文）
   */
  function derive(accent) {
    var a = String(accent || '#2563eb');
    var deep = U.shade(a, 0.3);
    var soft = U.tint(a, 0.88);

    // 若 deep 与白字对比不足，继续加深
    var guard = 0;
    while (contrast(deep, '#ffffff') < 4.5 && guard < 8) {
      deep = U.shade(deep, 0.12);
      guard += 1;
    }
    return { accent: a, deep: deep, soft: soft };
  }

  /** 主色在白底上的可读性判断 */
  function readable(accent) {
    var ratio = contrast(accent, '#ffffff');
    return {
      ratio: Math.round(ratio * 100) / 100,
      ok: ratio >= 4.5,
      level: ratio >= 7 ? 'AAA' : ratio >= 4.5 ? 'AA' : '不达标'
    };
  }

  /** 判断当前主色命中哪套预设 */
  function matchPreset(accent) {
    var a = String(accent || '').toLowerCase();
    for (var i = 0; i < PRESETS.length; i++) {
      if (PRESETS[i].accent.toLowerCase() === a) return PRESETS[i].id;
    }
    return '';
  }

  RS.theme = {
    presets: PRESETS,
    get: function (id) { return byId[id] || PRESETS[0]; },
    derive: derive,
    readable: readable,
    contrast: contrast,
    luminance: luminance,
    matchPreset: matchPreset
  };

})(window);

</script>
<script>
/* ==== templates.js ==== */
/* ==================================================================
   模板层：内置 6 套版式
   - 切换模板只改变「版式与标题形态」，不会覆盖用户已调好的字号/配色
   - 缩略图全部由 CSS 绘制，无图片依赖，离线可用
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};

  var TEMPLATES = [
    {
      id: 'classic',
      name: '经典单栏',
      desc: '居中页眉 + 通栏分隔线，最稳妥的通用选择',
      scene: '校招 / 国企 / 事业单位',
      accent: '#1d4ed8',
      heading: 'underline',
      photoShape: 'circle',
      rules: { photoDefault: true }
    },
    {
      id: 'modern',
      name: '现代双区',
      desc: '左照片右信息 + 竖条标题，互联网与技术岗常用',
      scene: '互联网 / 技术 / 产品',
      accent: '#2563eb',
      heading: 'bar',
      photoShape: 'rounded',
      rules: { photoDefault: true }
    },
    {
      id: 'sidebar',
      name: '色块页眉',
      desc: '顶部主题色通栏色块，视觉识别度强',
      scene: '市场 / 运营 / 设计',
      accent: '#0f766e',
      heading: 'block',
      photoShape: 'rounded',
      rules: { photoDefault: true }
    },
    {
      id: 'compact',
      name: '紧凑信息流',
      desc: '高密度排版，一页承载更多经历',
      scene: '社招 / 经历丰富者',
      accent: '#111827',
      heading: 'line',
      photoShape: 'square',
      rules: { photoDefault: false }
    },
    {
      id: 'minimal',
      name: '极简留白',
      desc: '大留白 + 细字距，克制而高级',
      scene: '外企 / 咨询 / 学术',
      accent: '#475569',
      heading: 'plain',
      photoShape: 'circle',
      rules: { photoDefault: false }
    },
    {
      id: 'two-column',
      name: '双栏侧栏',
      desc: '左窄栏放联系方式与技能，右宽栏放经历；信息密度高，适合一页简历',
      scene: '技术 / 产品 / 一页简历',
      accent: '#1e4d6b',
      heading: 'bar',
      photoShape: 'rounded',
      rules: { photoDefault: true }
    },
    {
      id: 'timeline',
      name: '时间轴',
      desc: '左侧时间线串联经历，成长路径一目了然',
      scene: '实习 / 应届 / 履历递进明显',
      accent: '#7c3aed',
      heading: 'line',
      photoShape: 'rounded',
      rules: { photoDefault: true }
    }
  ];

  var byId = {};
  TEMPLATES.forEach(function (t) { byId[t.id] = t; });

  /* ---------- 纯 CSS 缩略图 ---------- */
  function thumbHTML(tpl, accent) {
    var a = accent || tpl.accent;
    var head = '';
    var banner = '';

    if (tpl.id === 'sidebar') {
      banner = '<div class="t-banner"></div>';
    }

    if (tpl.id === 'two-column') {
      var h2 = '<div class="t-head"><div class="t-headcol">' +
        '<div class="t-name"></div><div class="t-role"></div><div class="t-contact"></div>' +
        '</div></div>';
      return '<div class="thumb" data-tpl="two-column" style="--th-accent:' + a + '">' +
        h2 +
        '<div class="t-2col">' +
          '<div class="t-col-l">' +
            '<div class="t-sec"></div><div class="t-row s"></div><div class="t-row s"></div>' +
            '<div class="t-sec"></div><div class="t-row s"></div>' +
          '</div>' +
          '<div class="t-col-r">' +
            '<div class="t-sec"></div><div class="t-row"></div><div class="t-row s"></div>' +
            '<div class="t-sec"></div><div class="t-row"></div><div class="t-row s"></div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }
    if (tpl.id === 'classic') {
      head = '<div class="t-head"><div class="t-headcol">' +
        '<div class="t-name"></div><div class="t-role"></div><div class="t-contact"></div>' +
        '</div></div><div class="t-hr"></div>';
    } else if (tpl.id === 'minimal') {
      head = '<div class="t-head"><div class="t-photo"></div><div class="t-headcol">' +
        '<div class="t-name"></div><div class="t-role"></div><div class="t-contact"></div>' +
        '</div></div><div class="t-hr"></div>';
    } else if (tpl.id === 'sidebar') {
      head = '<div class="t-head"><div class="t-photo"></div><div class="t-headcol">' +
        '<div class="t-name"></div><div class="t-role"></div><div class="t-contact"></div>' +
        '</div></div>';
    } else {
      head = '<div class="t-head"><div class="t-photo"></div><div class="t-headcol">' +
        '<div class="t-name"></div><div class="t-role"></div><div class="t-contact"></div>' +
        '</div></div>';
    }

    var bodyParts = [];
    var secCount = tpl.id === 'compact' ? 4 : 3;
    for (var s = 0; s < secCount; s++) {
      bodyParts.push('<div class="t-sec"></div>');
      if (tpl.id === 'timeline') {
        bodyParts.push('<div class="t-entry"><div>' +
          '<div class="t-row"></div><div class="t-row s"></div>' +
          '</div></div>');
        bodyParts.push('<div class="t-entry"><div>' +
          '<div class="t-row"></div><div class="t-row s"></div>' +
          '</div></div>');
      } else {
        bodyParts.push('<div class="t-row"></div><div class="t-row s"></div>');
        if (s === 0) bodyParts.push('<div class="t-row"></div>');
      }
    }

    return '<div class="thumb" data-tpl="' + tpl.id + '" style="--th-accent:' + a + '">' +
      banner + head + bodyParts.join('') + '</div>';
  }

  RS.templates = {
    all: function () { return TEMPLATES.slice(); },
    get: function (id) { return byId[id] || TEMPLATES[0]; },
    thumbHTML: thumbHTML,

    /**
     * 应用模板：只覆盖版式相关属性，保留用户调好的字号/行距/边距
     */
    applyTo: function (style, tplId) {
      var tpl = RS.templates.get(tplId);
      style.template = tpl.id;
      style.heading = tpl.heading;
      style.photoShape = tpl.photoShape;
      return tpl;
    }
  };

})(window);

</script>
<script>
/* ==== sections.js ==== */
/* ==================================================================
   渲染层：把 state 编译成「块序列」
   返回结构：[{ kind:'block'|'section-header'|'item', el, sectionId }]
   - kind 用于分页引擎决定换页策略（标题需与首条内容同页）
   - 返回的 el 尚未插入文档，交由 paginate 测量与落位
   - 每个文本节点带 data-edit-path，供「实时编辑」模式直接回写 state
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;
  var esc = U.escapeHtml;
  var rich = U.richText;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html !== undefined && html !== null) n.innerHTML = html;
    return n;
  }

  /** 生成可编辑属性 */
  function ed(path, multi) {
    return ' data-edit-path="' + esc(path) + '"' + (multi ? ' data-edit-multi="1"' : '');
  }

  /** 生成单个可编辑文本节点 */
  function editableText(tag, path, text, cls, multi) {
    return '<' + tag + (cls ? ' class="' + cls + '"' : '') + ed(path, multi) + '>' +
      (multi ? rich(text) : esc(text)) + '</' + tag + '>';
  }

  function p(itemIdx, field) {
    return 'data.' + itemIdx.section + '.' + itemIdx.index + '.' + field;
  }

  function ctx(sec, i) {
    return { section: sec, index: i };
  }

  /* ---------------- 联系方式（页眉与双栏左栏共用） ---------------- */
  /* 数据驱动：手机 → tel:，邮箱 → mailto:，主页/GitHub → https 链接；
     城市与微信保持纯文本。链接在纸张中保持中性，不破坏打印观感。 */
  function contactsHTML(pr) {
    var defs = [
      { k: 'phone', v: pr.phone, link: function (v) { return 'tel:' + String(v).replace(/[^\d+]/g, ''); } },
      { k: 'email', v: pr.email, link: function (v) { return 'mailto:' + String(v).trim(); } },
      { k: 'city', v: pr.city, link: null },
      { k: 'website', v: pr.website, link: function (v) { return /^https?:\/\//i.test(v) ? v : 'https://' + v; } },
      { k: 'github', v: pr.github, link: function (v) { return /^https?:\/\//i.test(v) ? v : 'https://' + v; } },
      { k: 'wechat', v: pr.wechat, link: null }
    ].filter(function (c) { return c.v && String(c.v).trim(); });

    if (!defs.length) return '';
    return '<div class="res-contact">' + defs.map(function (c) {
      var text = esc(c.v);
      var inner = c.link ? '<a href="' + esc(c.link(c.v)) + '">' + text + '</a>' : text;
      return '<span' + ed('profile.' + c.k) + '>' + inner + '</span>';
    }).join('') + '</div>';
  }

  /* ---------------- 页眉 ---------------- */
  function buildHead(doc, withoutContacts) {
    var pr = doc.profile, s = doc.style;
    var head = el('div', 'res-head');
    var main = el('div', 'res-head-main');

    var name = pr.name && pr.name.trim() ? pr.name.trim() : '你的姓名';
    /* 按姓名语言打 lang 标记：全中文（含间隔号）→ zh，否则 en。
       中英混排按 en 处理，避免字距突变。
       字距不再内联（内联会覆盖 renderStyles 的按语言规则），
       改由 --doc-name-spacing 变量注入，见 applyStyleVars。 */
    var nameLang = /^[\u4e00-\u9fa5·]+$/.test(name) ? 'zh' : 'en';
    var nameHtml = '<h1 class="res-name" lang="' + nameLang + '"' + ed('profile.name') + '>' + esc(name) + '</h1>';

    var roleHtml = '';
    if (pr.title && pr.title.trim()) {
      roleHtml = '<p class="res-role"' + ed('profile.title') + '>' + esc(pr.title) + '</p>';
    }

    // 双栏模板时联系方式移到左栏，页眉只保留姓名 / 职位 / 照片
    var contactHtml = withoutContacts ? '' : contactsHTML(pr);

    main.innerHTML = nameHtml + roleHtml + contactHtml;
    head.appendChild(main);

    if (s.showPhoto && pr.photo) {
      var wrap = el('div', 'res-photo-wrap');
      var img = document.createElement('img');
      img.className = 'res-photo ph-' + (s.photoShape || 'rounded');
      img.src = pr.photo;
      img.alt = '';
      img.setAttribute('data-photo', '1');
      wrap.appendChild(img);
      head.appendChild(wrap);
    }

    return head;
  }

  /* ---------------- 模块标题 ---------------- */
  function buildSecTitle(title, doc, sectionId) {
    var t = el('h2', 'res-sec-title');
    t.setAttribute('data-sec', sectionId || '');
    t.innerHTML =
      '<span class="drag-handle" data-drag="' + esc(sectionId || '') + '" ' +
        'contenteditable="false" title="拖动调整模块顺序">' +
        RS.icons.get('grip') +
      '</span>' +
      '<span class="sec-text"' + ed('titles.' + sectionId) + '>' + esc(title) + '</span>' +
      '<span class="sec-line"></span>';
    return t;
  }

  /* ---------------- 个人简介 ---------------- */
  function buildSummary(doc) {
    var box = el('div', 'res-block res-summary');
    box.appendChild(buildSecTitle(doc.titles.summary || '个人简介', doc, 'summary'));
    var body = el('div', 'res-entry');
    var para = el('p', 'res-entry-desc');
    para.setAttribute('data-edit-path', 'profile.summary');
    para.setAttribute('data-edit-multi', '1');
    para.innerHTML = rich(doc.profile.summary);
    body.appendChild(para);
    box.appendChild(body);
    return box;
  }

  /* ---------------- 条目：教育 ---------------- */
  function buildEducation(doc, it, i) {
    var c = ctx('education', i);
    var box = el('div', 'res-entry');

    var subParts = [];
    if (it.major) subParts.push(editableText('span', p(c, 'major'), it.major));
    if (it.city) subParts.push(editableText('span', p(c, 'city'), it.city));
    if (it.gpa) subParts.push(editableText('span', p(c, 'gpa'), it.gpa));

    var time = U.fmtRange(it.start, it.end, it.current);

    box.innerHTML =
      '<div class="res-entry-head">' +
        '<div class="res-entry-main">' +
          editableText('span', p(c, 'school'), it.school || '学校名称', 'res-entry-title') +
          (it.degree ? '<span class="res-entry-tag">' +
            editableText('span', p(c, 'degree'), it.degree) + '</span>' : '') +
        '</div>' +
        (time ? '<span class="res-entry-time">' + esc(time) + '</span>' : '') +
      '</div>' +
      (subParts.length ? '<div class="res-entry-sub">' + subParts.join(' · ') + '</div>' : '') +
      (it.courses ? '<div class="res-entry-sub">主修课程：' +
        editableText('span', p(c, 'courses'), it.courses) + '</div>' : '') +
      (it.desc ? '<p class="res-entry-desc"' + ed(p(c, 'desc'), true) + '>' +
        rich(it.desc) + '</p>' : '') +
      bulletsHTML(it.bullets, p(c, 'bullets'));

    return box;
  }

  /* ---------------- 条目：工作 ---------------- */
  function buildExperience(doc, it, i) {
    var c = ctx('experience', i);
    var box = el('div', 'res-entry');
    var time = U.fmtRange(it.start, it.end, it.current);

    var subParts = [];
    if (it.role) subParts.push(editableText('span', p(c, 'role'), it.role));
    if (it.city) subParts.push(editableText('span', p(c, 'city'), it.city));

    box.innerHTML =
      '<div class="res-entry-head">' +
        '<div class="res-entry-main">' +
          editableText('span', p(c, 'company'), it.company || '公司名称', 'res-entry-title') +
        '</div>' +
        (time ? '<span class="res-entry-time">' + esc(time) + '</span>' : '') +
      '</div>' +
      (subParts.length ? '<div class="res-entry-sub">' + subParts.join(' · ') + '</div>' : '') +
      (it.desc ? '<p class="res-entry-desc"' + ed(p(c, 'desc'), true) + '>' +
        rich(it.desc) + '</p>' : '') +
      bulletsHTML(it.bullets, p(c, 'bullets'));

    return box;
  }

  /* ---------------- 条目：项目 ---------------- */
  function buildProject(doc, it, i) {
    var c = ctx('projects', i);
    var box = el('div', 'res-entry');
    var time = U.fmtRange(it.start, it.end, it.current);

    var subParts = [];
    if (it.role) subParts.push(editableText('span', p(c, 'role'), it.role));
    if (it.link) subParts.push(editableText('span', p(c, 'link'), it.link));

    box.innerHTML =
      '<div class="res-entry-head">' +
        '<div class="res-entry-main">' +
          editableText('span', p(c, 'name'), it.name || '项目名称', 'res-entry-title') +
        '</div>' +
        (time ? '<span class="res-entry-time">' + esc(time) + '</span>' : '') +
      '</div>' +
      (subParts.length ? '<div class="res-entry-sub">' + subParts.join(' · ') + '</div>' : '') +
      (it.tech ? '<div class="res-entry-sub">技术栈：' +
        editableText('span', p(c, 'tech'), it.tech) + '</div>' : '') +
      (it.desc ? '<p class="res-entry-desc"' + ed(p(c, 'desc'), true) + '>' +
        rich(it.desc) + '</p>' : '') +
      bulletsHTML(it.bullets, p(c, 'bullets'));

    return box;
  }

  /* ---------------- 条目：自定义 ---------------- */
  function buildCustom(doc, it, i) {
    var c = ctx('custom', i);
    var box = el('div', 'res-entry');
    var time = U.fmtRange(it.start, it.end, it.current);

    var subParts = [];
    if (it.sub) subParts.push(editableText('span', p(c, 'sub'), it.sub));
    if (it.city) subParts.push(editableText('span', p(c, 'city'), it.city));

    box.innerHTML =
      '<div class="res-entry-head">' +
        '<div class="res-entry-main">' +
          editableText('span', p(c, 'title'), it.title || '标题', 'res-entry-title') +
        '</div>' +
        (time ? '<span class="res-entry-time">' + esc(time) + '</span>' : '') +
      '</div>' +
      (subParts.length ? '<div class="res-entry-sub">' + subParts.join(' · ') + '</div>' : '') +
      (it.desc ? '<p class="res-entry-desc"' + ed(p(c, 'desc'), true) + '>' +
        rich(it.desc) + '</p>' : '') +
      bulletsHTML(it.bullets, p(c, 'bullets'));

    return box;
  }

  function bulletsHTML(raw, path) {
    var list = U.lines(raw);
    if (!list.length) return '';
    return '<ul class="res-entry-list"' + ed(path) + '>' + list.map(function (line) {
      return '<li>' + rich(line) + '</li>';
    }).join('') + '</ul>';
  }

  /* ---------------- 技能 ---------------- */
  function buildSkills(doc) {
    var list = doc.data.skills || [];
    var mode = doc.style.skillStyle || 'tags';
    var box = el('div', 'res-block');

    var hasGroup = list.some(function (it) { return it.group && String(it.group).trim(); });

    if (mode === 'bars') {
      var rows = el('div', 'res-skill-rows');
      list.forEach(function (it, i) {
        var lv = Math.max(1, Math.min(5, parseInt(it.level, 10) || 3));
        var row = el('div', 'res-skill-row');
        row.innerHTML =
          '<span class="res-skill-name"' + ed('data.skills.' + i + '.name') + '>' +
            esc(it.name || '') + '</span>' +
          '<span class="res-skill-track"><span class="res-skill-fill" style="width:' + (lv * 20) + '%"></span></span>' +
          '<span class="res-skill-pct">' + (lv * 20) + '%</span>';
        rows.appendChild(row);
      });
      box.appendChild(rows);
      return box;
    }

    if (mode === 'stars') {
      var wrap = el('div', 'res-tags');
      list.forEach(function (it, i) {
        var lv = Math.max(1, Math.min(5, parseInt(it.level, 10) || 3));
        var stars = '';
        for (var k = 1; k <= 5; k++) {
          stars += '<span class="' + (k <= lv ? '' : 'off') + '">★</span>';
        }
        wrap.innerHTML += '<span class="res-tag">' +
          '<span' + ed('data.skills.' + i + '.name') + '>' + esc(it.name || '') + '</span>' +
          ' <span class="res-stars">' + stars + '</span></span>';
      });
      box.appendChild(wrap);
      return box;
    }

    // 标签模式：有分组则按组分行
    if (hasGroup) {
      var order = [];
      var map = {};
      list.forEach(function (it, i) {
        var g = (it.group && String(it.group).trim()) || '其他';
        if (!map[g]) { map[g] = []; order.push(g); }
        map[g].push({ it: it, i: i });
      });
      var rowsWrap = el('div', 'res-skill-rows');
      order.forEach(function (g) {
        var row = el('div', 'res-skill-row');
        row.style.alignItems = 'flex-start';
        row.innerHTML = '<span class="res-skill-name" style="font-weight:700;color:#141b24">' +
          esc(g) + '</span><span class="res-tags">' +
          map[g].map(function (o) {
            return '<span class="res-tag"><span' + ed('data.skills.' + o.i + '.name') + '>' +
              esc(o.it.name || '') + '</span></span>';
          }).join('') + '</span>';
        rowsWrap.appendChild(row);
      });
      box.appendChild(rowsWrap);
      return box;
    }

    var tags = el('div', 'res-tags');
    tags.innerHTML = list.map(function (it, i) {
      return '<span class="res-tag"><span' + ed('data.skills.' + i + '.name') + '>' +
        esc(it.name || '') + '</span></span>';
    }).join('');
    box.appendChild(tags);
    return box;
  }

  /* ---------------- 证书 ---------------- */
  function buildCerts(doc) {
    var list = doc.data.certificates || [];
    var box = el('div', 'res-block');
    var grid = el('div', 'res-cert-grid');
    if (doc.style.certCols === 1) grid.style.gridTemplateColumns = '1fr';

    list.forEach(function (it, i) {
      var item = el('div', 'res-cert-item');
      item.innerHTML = '<i></i><span class="res-cert-name">' +
        '<span' + ed('data.certificates.' + i + '.name') + '>' + esc(it.name || '') + '</span>' +
        (it.issuer ? '<span style="color:#8b95a3;font-size:.92em"> · ' +
          '<span' + ed('data.certificates.' + i + '.issuer') + '>' + esc(it.issuer) + '</span></span>' : '') +
        '</span>' +
        (it.date ? '<span class="res-cert-date">' + esc(U.fmtDate(it.date)) + '</span>' : '');
      grid.appendChild(item);
    });
    box.appendChild(grid);
    return box;
  }

  /* ---------------- 语言 ---------------- */
  function buildLangs(doc) {
    var list = doc.data.languages || [];
    var box = el('div', 'res-block');
    var grid = el('div', 'res-lang-grid');
    if (doc.style.certCols === 1) grid.style.gridTemplateColumns = '1fr';

    list.forEach(function (it, i) {
      var item = el('div', 'res-lang-item');
      item.innerHTML = '<span' + ed('data.languages.' + i + '.name') + '>' + esc(it.name || '') + '</span>' +
        '<span class="res-lang-level"' + ed('data.languages.' + i + '.level') + '>' + esc(it.level || '') + '</span>';
      grid.appendChild(item);
    });
    box.appendChild(grid);
    return box;
  }

  /* ---------------- 双栏布局（单页） ----------------
     说明：双栏无法沿用「单列流式装箱」，因此整体作为一个不可拆的块输出。
     内容超过一页时由 paginate 报 overflow，由 app 提示用户改用单栏。 */
  var LEFT_SECTIONS = { skills: 1, certificates: 1, languages: 1 };

  function buildTwoColumn(doc) {
    var wrap = el('div', 'res-two-col-wrap');
    // 通栏页眉：只含姓名 / 职位 / 照片（联系方式移到左栏）
    wrap.appendChild(buildHead(doc, true));

    var cols = el('div', 'res-two-col');
    var left = el('div', 'res-col res-col-left');
    var right = el('div', 'res-col res-col-right');

    /* 左栏顶部：联系方式 */
    var contacts = contactsHTML(doc.profile);
    if (contacts) {
      var cbox = el('div', 'res-block res-contact-block');
      cbox.innerHTML = contacts;
      left.appendChild(cbox);
    }

    doc.order.forEach(function (id) {
      if (!doc.visible[id]) return;

      if (id === 'summary') {
        if (!doc.profile.summary || !doc.profile.summary.trim()) return;
        right.appendChild(buildSummary(doc));
        return;
      }

      var items = doc.data[id] || [];
      if (!items.length) return;

      var target = LEFT_SECTIONS[id] ? left : right;
      var box = el('div', 'res-block');
      box.appendChild(buildSecTitle(doc.titles[id] || id, doc, id));

      if (id === 'skills') {
        box.appendChild(buildSkills(doc));
      } else if (id === 'certificates') {
        box.appendChild(buildCerts(doc));
      } else if (id === 'languages') {
        box.appendChild(buildLangs(doc));
      } else {
        var builder = builders[id];
        if (!builder) return;
        items.forEach(function (it, i) {
          box.appendChild(builder(doc, it, i));
        });
      }
      target.appendChild(box);
    });

    cols.appendChild(left);
    cols.appendChild(right);
    wrap.appendChild(cols);
    return wrap;
  }

  /* ---------------- 主入口 ---------------- */
  var builders = {
    education: buildEducation,
    experience: buildExperience,
    projects: buildProject,
    custom: buildCustom
  };

  RS.render = {
    build: function (doc) {
      var blocks = [];

      /* 双栏模板：整体是一个不可拆的块（内部两列自行流动） */
      if (doc.style.template === 'two-column') {
        blocks.push({
          kind: 'block',
          el: buildTwoColumn(doc),
          sectionId: 'two-col'
        });
        blocks.forEach(function (b) { b.el.setAttribute('data-module', b.sectionId); });
        return blocks;
      }

      // 页眉
      blocks.push({ kind: 'block', el: buildHead(doc), sectionId: 'head' });

      doc.order.forEach(function (id) {
        if (!doc.visible[id]) return;

        if (id === 'summary') {
          if (!doc.profile.summary || !doc.profile.summary.trim()) return;
          blocks.push({ kind: 'block', el: buildSummary(doc), sectionId: 'summary' });
          return;
        }

        var items = doc.data[id] || [];
        if (!items.length) return;

        var title = doc.titles[id] || id;
        blocks.push({
          kind: 'section-header',
          el: buildSecTitle(title, doc, id),
          sectionId: id
        });

        if (id === 'skills') {
          blocks.push({ kind: 'block', el: buildSkills(doc), sectionId: id });
          return;
        }
        if (id === 'certificates') {
          blocks.push({ kind: 'block', el: buildCerts(doc), sectionId: id });
          return;
        }
        if (id === 'languages') {
          blocks.push({ kind: 'block', el: buildLangs(doc), sectionId: id });
          return;
        }

        var builder = builders[id];
        if (!builder) return;
        items.forEach(function (it, i) {
          // 间距已由 .page-body 的页级规则统一提供，不再给「末条」打补丁
          blocks.push({ kind: 'item', el: builder(doc, it, i), sectionId: id });
        });
      });

      // 统一标记所属模块，供「拖动排序」按模块聚合
      blocks.forEach(function (b) {
        b.el.setAttribute('data-module', b.sectionId);
      });

      return blocks;
    },

    countItems: function (doc) {
      var n = 0;
      Object.keys(doc.data).forEach(function (k) {
        if (doc.visible[k]) n += (doc.data[k] || []).length;
      });
      return n;
    }
  };

})(window);

</script>
<script>
/* ==== paginate.js ==== */
/* ==================================================================
   分页引擎（A4 Pagination Engine）
   原理：
     1. 在离屏的 .paper 探针中逐块测量真实高度（含上下外边距）
     2. 以「内容可用高度」为容量做贪心装箱
     3. 模块标题与首条内容绑定，避免标题孤悬页底
     4. 内容跨页时自动在新页顶部重复模块标题
     5. keep-section 模式下，同模块的块合并为「不可拆单元」整体换页

   单位约定：
     · 布局测量一律使用浏览器返回的 px（offsetHeight 不受 transform 影响）
     · 仅在对外报告、降级估算时换算 mm，统一走 MM_PX 常量
     · 不用 px 反推 mm 估算页面容量，避免 DPI / 缩放漂移

   输出：多张 .paper 落位到 .paper-stack，页数与打印结果严格一致
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};

  var EPS = 0.5; // 亚像素容差

  /* CSS 基准换算：1mm = 96/25.4 px。只在需要 mm 语义时使用。 */
  var MM_PX = 96 / 25.4;
  function toMM(px) { return px / MM_PX; }
  function toPX(mm) { return mm * MM_PX; }

  // 需要从 stack 复制到每张纸上的版式状态（CSS 以 .paper[data-xxx] 为选择器）
  var META_ATTRS = [
    'data-template',
    'data-heading',
    'data-bullet',
    'data-keep-section',
    'data-ats'
  ];

  function copyMeta(from, to) {
    META_ATTRS.forEach(function (attr) {
      var v = from.getAttribute(attr);
      if (v !== null) to.setAttribute(attr, v);
    });
  }

  function makePage(pageNo, total, stack) {
    var paper = document.createElement('div');
    paper.className = 'paper';
    paper.setAttribute('data-page-label', total ? (pageNo + ' / ' + total) : String(pageNo));
    if (stack) copyMeta(stack, paper);
    var body = document.createElement('div');
    body.className = 'page-body';
    paper.appendChild(body);
    return paper;
  }

  var paginate = RS.paginate = {
    MM_PX: MM_PX,
    toMM: toMM,
    toPX: toPX,

    /**
     * @param {Array} blocks  由 RS.render.build 产出的块序列
     * @param {Element} stack .paper-stack 容器
     * @returns {{pageCount:number, overflow:boolean, avail:number, availMM:number, keepSection:boolean}}
     */
    run: function (blocks, stack) {
      if (!stack) return { pageCount: 0, overflow: false, avail: 0, availMM: 0 };

      /* ---------- 1. 探针测量（在「无变换」状态下进行） ---------- */
      // offsetHeight 本身不受 transform 影响，这里仍是防御性处理：
      // 若将来改用 zoom，缩放会改变布局尺寸导致测量失真。
      var prevTransform = stack.style.transform;
      stack.style.transform = 'none';

      var probe = document.createElement('div');
      probe.className = 'paper rc-probe';
      copyMeta(stack, probe);
      stack.appendChild(probe);

      var cs = window.getComputedStyle(probe);
      var padTop = parseFloat(cs.paddingTop) || 0;
      var padBottom = parseFloat(cs.paddingBottom) || 0;
      var avail = probe.clientHeight - padTop - padBottom;

      if (!isFinite(avail) || avail <= 0) {
        // 降级：按 A4 理论高度减去上下页边距（统一走 mm 换算，不硬编码 px）
        var marginMM = padTop > 0 ? toMM(padTop) : 14;
        avail = toPX(297 - marginMM * 2);
      }

      var items = [];
      blocks.forEach(function (b) {
        probe.appendChild(b.el);
        var ecs = window.getComputedStyle(b.el);
        var mt = parseFloat(ecs.marginTop) || 0;
        var mb = parseFloat(ecs.marginBottom) || 0;
        var h = b.el.offsetHeight + mt + mb;
        items.push({
          kind: b.kind,
          el: b.el,
          sectionId: b.sectionId,
          h: h
        });
      });

      probe.remove();
      stack.style.transform = prevTransform || '';

      /* ---------- 2. 长条目放开跨页拆分 ----------
         超过可用高度 60% 的条目若仍 break-inside:avoid，
         会被整体推到下一页，留下大片空白。 */
      var longThreshold = avail * 0.6;
      items.forEach(function (b) {
        if (b.kind !== 'item') return;
        if (b.h > longThreshold) {
          b.long = true;
          b.el.setAttribute('data-long', '1');
        } else {
          b.el.removeAttribute('data-long');
        }
      });

      /* ---------- 3. keep-section：同模块合并为不可拆单元 ---------- */
      var keepSection = stack.getAttribute('data-keep-section') === '1';
      if (keepSection) {
        var merged = [];
        var buf = null;

        items.forEach(function (b) {
          if (b.kind === 'section-header') {
            if (buf) merged.push(buf);
            buf = {
              kind: 'group',
              sectionId: b.sectionId,
              els: [b.el],
              h: b.h
            };
          } else if (buf && b.sectionId === buf.sectionId) {
            buf.els.push(b.el);
            buf.h += b.h;
          } else {
            if (buf) { merged.push(buf); buf = null; }
            merged.push(b);
          }
        });
        if (buf) merged.push(buf);

        items = merged;
      }

      /* ---------- 4. 贪心装箱 ---------- */
      var pages = [[]];
      var cur = 0;
      var used = 0;
      var pendingHeader = null;
      var headerPlaced = false;
      var overflow = false;
      var placedHeaders = {}; // sectionId -> 该标题是否已出现过（用于判定跨页重复）

      function newPage() {
        cur += 1;
        pages.push([]);
        used = 0;
        headerPlaced = false;
      }

      items.forEach(function (b) {
        /* 整组不可拆（keep-section） */
        if (b.kind === 'group') {
          if (pages[cur].length > 0 && used + b.h > avail + EPS) newPage();
          b.els.forEach(function (el) {
            pages[cur].push({ el: el, h: 0 }); // 高度已按整组计入
          });
          used += b.h;
          if (b.h > avail + EPS) overflow = true;
          pendingHeader = null;
          headerPlaced = false;
          return;
        }

        if (b.kind === 'section-header') {
          pendingHeader = b;
          headerPlaced = false;
          return;
        }

        var headH = (pendingHeader && !headerPlaced) ? pendingHeader.h : 0;
        var need = headH + b.h;

        // 当前页已有内容且放不下 -> 换页
        if (pages[cur].length > 0 && used + need > avail + EPS) {
          newPage();
        }

        // 换页后需要在新页顶部补回模块标题
        if (pendingHeader && !headerPlaced) {
          var node;
          if (!placedHeaders[pendingHeader.sectionId]) {
            node = pendingHeader.el;
            placedHeaders[pendingHeader.sectionId] = true;
          } else {
            node = pendingHeader.el.cloneNode(true);
            node.classList.add('is-clone');
          }
          pages[cur].push({ el: node, h: pendingHeader.h, kind: 'section-header' });
          used += pendingHeader.h;
          headerPlaced = true;
        }

        pages[cur].push(b);
        used += b.h;

        if (used > avail + EPS && pages[cur].length === 1) {
          overflow = true; // 单块超出一整页
        }
      });

      /* ---------- 5. 落位 ---------- */
      stack.innerHTML = '';

      var real = pages.filter(function (p) { return p.length > 0; });
      var total = real.length;
      var overflowFlag = overflow;

      real.forEach(function (pageBlocks, idx) {
        var paper = makePage(idx + 1, total, stack);
        var body = paper.firstChild;
        pageBlocks.forEach(function (b) {
          body.appendChild(b.el);
        });
        stack.appendChild(paper);
      });

      // 极端情况：完全无内容，仍渲染一张空纸
      if (total === 0) {
        stack.appendChild(makePage(1, 1, stack));
        total = 1;
      }

      return {
        pageCount: total,
        overflow: overflowFlag,
        avail: avail,
        availMM: Math.round(toMM(avail) * 10) / 10,
        keepSection: keepSection
      };
    }
  };

})(window);

</script>

          '<span class="sect-note" data-count-for="profile.summary"></span></div>' +
        '<div class="grid-2">' +
          fieldHTML({
            type: 'textarea', value: p.summary, rows: 7, full: true,
            path: 'profile.summary',
            ph: '3 年 XX 经验，专注 ……。主导过 ……，使 …… 提升 40%。',
            hint: '与目标职位对齐，用「动词 + 对象 + 量化结果」句式。建议 60–120 字，控制在 3–4 行内。用 <code>**文字**</code> 可加粗。'
          }) +
        '</div>' +
      '</div>';
  }

  /* ================= 面板：条目型模块 ================= */
  function renderSection(state, secId) {
    var def = FIELD_DEFS[secId];
    if (!def) return '';
    var list = state.data[secId] || [];
    var title = state.titles[secId] || '';
    var visible = !!state.visible[secId];

    var head = '' +
      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>模块设置</h3></div>' +
        '<div class="grid-2">' +
          fieldHTML({
            label: '模块标题', type: 'text', value: title,
            ph: '例如：工作经历', path: 'titles.' + secId,
            hint: '显示在简历上的标题文字，可改为「实习经历」「社会实践」等。'
          }) +
          '<div class="field"><label>在简历中显示</label>' +
            '<label class="switch-line"><input type="checkbox" data-path="visible.' + secId + '"' +
              (visible ? ' checked' : '') + '><span class="switch"></span>' +
              '<span>' + (visible ? '已显示' : '已隐藏') + '</span></label>' +
            '<p class="hint">隐藏后内容仍保留，重新打开即可恢复。</p>' +
          '</div>' +
        '</div>' +
      '</div>';

    if (!list.length) {
      return head +
        '<div class="empty">' +
          '<div><i data-ico="' + (def.itemName ? 'file' : 'plus') + '"></i></div>' +
          '还没有' + def.itemName + '，点击下方按钮添加第一条。' +
        '</div>' +
        '<button class="btn block ghost" style="margin-top:10px" data-act="add-item" data-sec="' + secId + '">' +
          '<i data-ico="plus"></i>添加' + def.itemName +
        '</button>';
    }

    var cards = list.map(function (it, i) {
      return cardHTML(secId, it, i, list.length, !!state.style.autoSort);
    }).join('');

    return head +
      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>' + def.itemName +
          '<span class="sect-note" style="margin-left:2px">共 ' + list.length + ' 条</span></h3>' +
          '<button class="btn sm ghost" data-act="add-item" data-sec="' + secId + '">' +
            '<i data-ico="plus"></i>添加</button>' +
        '</div>' +
        cards +
      '</div>';
  }

  /* ================= 面板：模板中心 ================= */
  function renderTemplates(state) {
    var cur = state.style.template;
    var tpls = RS.templates.all();
    var cards = tpls.map(function (t) {
      return '<button class="tpl-card' + (t.id === cur ? ' on' : '') + '" data-act="set-template" data-tpl="' + t.id + '">' +
        RS.templates.thumbHTML(t, t.id === cur ? state.style.accent : t.accent) +
        '<div class="tpl-name"><span>' + esc(t.name) + '</span>' +
          '<i data-ico="check" class="tick"></i></div>' +
      '</button>';
    }).join('');

    var curTpl = RS.templates.get(cur);

    return '' +
      '<div class="notice"><i data-ico="info"></i><div>' +
        '切换模板只改变<b>版式结构</b>，不会覆盖你已经调好的字号、行距与配色。' +
      '</div></div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>内置模板</h3>' +
          '<span class="sect-note">6 套</span></div>' +
        '<div class="tpl-grid">' + cards + '</div>' +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>当前模板</h3></div>' +
        '<div style="display:flex;gap:12px;align-items:flex-start">' +
          '<div style="width:74px;flex:none">' + RS.templates.thumbHTML(curTpl, state.style.accent) + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-size:13px;font-weight:600;color:#e8ecf3;margin-bottom:3px">' + esc(curTpl.name) + '</div>' +
            '<div style="font-size:11.5px;color:#8892a2;line-height:1.6">' + esc(curTpl.desc) + '</div>' +
            '<div style="font-size:11px;color:#616b7c;margin-top:5px">适用场景：' + esc(curTpl.scene) + '</div>' +
            '<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">' +
              '<button class="btn sm ghost" data-act="apply-tpl-accent" data-color="' + curTpl.accent + '">' +
                '<span style="width:10px;height:10px;border-radius:3px;background:' + curTpl.accent + ';display:inline-block"></span>' +
                '套用推荐配色</button>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  /* ================= 配色预设 ================= */

  function segHTML(label, options, value, act, hint) {
    return '<div class="field full">' +
      '<label>' + esc(label) + '</label>' +
      '<div class="seg">' + options.map(function (o) {
        var v = (typeof o === 'object') ? o.value : o;
        var t = (typeof o === 'object') ? o.label : o;
        return '<button class="' + (String(value) === String(v) ? 'on' : '') +
          '" data-act="' + act + '" data-val="' + esc(v) + '">' + esc(t) + '</button>';
      }).join('') + '</div>' +
      (hint ? '<p class="hint">' + hint + '</p>' : '') +
    '</div>';
  }

  function sliderHTML(o) {
    return '<div class="slider-row">' +
      '<div class="slider-top"><span>' + esc(o.label) + '</span>' +
        '<span class="slider-val" data-out="' + esc(o.path) + '">' + o.value + esc(o.unit || '') + '</span></div>' +
      '<input type="range" data-path="' + esc(o.path) + '" min="' + o.min + '" max="' + o.max +
        '" step="' + o.step + '" value="' + o.value + '">' +
      (o.hint ? '<p class="hint">' + o.hint + '</p>' : '') +
    '</div>';
  }

  /* ================= 面板：排版与配色 ================= */
  function renderStyle(state) {
    var s = state.style;
    /* 主题预设：只换主色，深/浅两档由 RS.theme.derive 推导，三者始终同色相 */
    var presets = RS.theme ? RS.theme.presets : [];
    var curId = RS.theme ? RS.theme.matchPreset(s.accent) : '';
    var rd = RS.theme ? RS.theme.readable(s.accent) : { ratio: 0, ok: true, level: '' };
    var swatches = presets.map(function (pr) {
      var on = pr.id === curId;
      return '<button class="swatch' + (on ? ' on' : '') +
        '" data-act="set-swatch" data-val="' + pr.accent + '"' +
        ' style="background:' + pr.accent + '"' +
        ' title="' + pr.name + '（' + pr.scene + '）"></button>';
    }).join('');

    var contrastHTML = '<div class="contrast-line ' + (rd.ok ? 'is-ok' : 'is-warn') + '">' +
      '主色与白底对比度 ' + rd.ratio + ':1 · ' + rd.level +
      (rd.ok ? '' : '（低于 4.5:1，彩色标题在白纸上会偏浅）') +
      '</div>';

    var fontSeg = RS.fonts.map(function (f) {
      return { value: f.id, label: f.name };
    });

    return '' +
      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>主题色</h3>' +
          '<span class="sect-note">标题、符号、进度条</span></div>' +
        '<div class="swatches">' + swatches + '</div>' + contrastHTML +
        '<div class="color-row">' +
          '<input type="color" data-path="style.accent" value="' + esc(s.accent) + '">' +
          '<span class="mono">' + esc(String(s.accent).toUpperCase()) + '</span>' +
          '<span style="font-size:11px;color:#616b7c">自定义主色</span>' +
        '</div>' +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>字体与字号</h3></div>' +
        segHTML('正文字体', fontSeg, s.font, 'set-font',
          '全部使用系统已装字体，离线环境同样生效。') +
        sliderHTML({ label: '基准字号', path: 'style.fontSize', value: s.fontSize, unit: 'px', min: 11, max: 17, step: 0.5 }) +
        sliderHTML({ label: '行距', path: 'style.lineHeight', value: s.lineHeight, min: 1.3, max: 2, step: 0.02 }) +
        sliderHTML({ label: '模块间距', path: 'style.gap', value: s.gap, unit: 'px', min: 6, max: 28, step: 1 }) +
        sliderHTML({ label: '页边距', path: 'style.margin', value: s.margin, unit: 'mm', min: 8, max: 26, step: 0.5 }) +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>模块标题形态</h3></div>' +
        segHTML('标题样式', [
          { value: 'underline', label: '下划线' },
          { value: 'bar', label: '竖条' },
          { value: 'block', label: '色块' },
          { value: 'line', label: '细线' },
          { value: 'plain', label: '纯文字' }
        ], s.heading, 'set-heading') +
        sliderHTML({ label: '姓名字距', path: 'style.nameSpacing', value: s.nameSpacing, unit: 'px', min: -1, max: 8, step: 0.5 }) +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>照片</h3></div>' +
        '<div class="field full"><label>显示照片</label>' +
          '<label class="switch-line"><input type="checkbox" data-path="style.showPhoto"' +
            (s.showPhoto ? ' checked' : '') + '><span class="switch"></span>' +
            '<span>' + (s.showPhoto ? '显示' : '隐藏') + '</span></label></div>' +
        segHTML('照片形状', [
          { value: 'rounded', label: '圆角' },
          { value: 'circle', label: '圆形' },
          { value: 'square', label: '方角' }
        ], s.photoShape, 'set-photo-shape') +
        sliderHTML({ label: '照片尺寸', path: 'style.photoSize', value: s.photoSize, unit: 'mm', min: 18, max: 36, step: 1 }) +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>细节</h3></div>' +
        segHTML('项目符号', [
          { value: 'dot', label: '圆点' },
          { value: 'square', label: '方块' },
          { value: 'dash', label: '短横' }
        ], s.bullet, 'set-bullet') +
        segHTML('技能呈现', [
          { value: 'tags', label: '标签' },
          { value: 'bars', label: '进度条' },
          { value: 'stars', label: '星级' }
        ], s.skillStyle, 'set-skill-style') +
        segHTML('证书列数', [
          { value: '2', label: '两列' },
          { value: '1', label: '一列' }
        ], String(s.certCols), 'set-cert-cols') +
        segHTML('灰度预览', [
          { value: '0', label: '彩色' },
          { value: '1', label: '灰度' }
        ], (typeof document !== 'undefined' && document.documentElement.classList.contains('ui-grayscale')) ? '1' : '0',
          'set-grayscale', '模拟黑白打印，检查标题与正文层次是否分得开；仅影响预览，不影响导出。') +
        segHTML('分页方式', [
          { value: '0', label: '允许拆页' },
          { value: '1', label: '整模块不拆' }
        ], s.keepSection ? '1' : '0', 'set-keep-section',
          '「整模块不拆」会把一个模块整体移到下一页，避免标题与内容被拆散；内容很长时可能留白。') +
        '<button class="btn block ghost" data-act="reset-style" style="margin-top:12px">' +
          '<i data-ico="reset"></i>恢复默认排版</button>' +
      '</div>';
  }

  /* ================= 面板：模块顺序 ================= */
  function renderOrder(state) {
    var rows = state.order.map(function (id, i) {
      var meta = null;
      for (var m = 0; m < RS.MODULES.length; m++) {
        if (RS.MODULES[m].id === id) { meta = RS.MODULES[m]; break; }
      }
      if (!meta) return '';
      var vis = !!state.visible[id];
      return '<div class="order-row' + (vis ? '' : ' off') + '">' +
        '<i data-ico="' + meta.icon + '"></i>' +
        '<span class="order-name">' + esc(state.titles[id] || meta.name) + '</span>' +
        '<span class="order-ops">' +
          '<button class="icon-btn" data-act="toggle-vis" data-sec="' + id + '" title="显示/隐藏">' +
            '<i data-ico="' + (vis ? 'eye' : 'eyeOff') + '"></i></button>' +
          '<button class="icon-btn" data-act="move-module" data-sec="' + id + '" data-dir="-1" title="上移"' +
            (i === 0 ? ' disabled' : '') + '><i data-ico="up"></i></button>' +
          '<button class="icon-btn" data-act="move-module" data-sec="' + id + '" data-dir="1" title="下移"' +
            (i === state.order.length - 1 ? ' disabled' : '') + '><i data-ico="down"></i></button>' +
        '</span>' +
      '</div>';
    }).join('');

    return '' +
      '<div class="notice"><i data-ico="info"></i><div>' +
        '顺序即为简历上的呈现顺序。页眉（姓名、联系方式）始终置顶，不在此列表中。' +
      '</div></div>' +
      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>模块排序</h3>' +
          '<span class="sect-note">' + state.order.length + ' 个模块</span></div>' +
        '<div class="order-list">' + rows + '</div>' +
      '</div>' +
      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>条目排序</h3></div>' +
        segHTML('经历类条目的排列方式', [
          { value: '0', label: '手动排序' },
          { value: '1', label: '按结束时间倒序' }
        ], state.style.autoSort ? '1' : '0', 'set-auto-sort',
          '自动排序按结束时间倒序重排教育 / 工作 / 项目条目（「至今」排最前）。开启后卡片上的上下移动按钮将不可用，切换前请确认当前顺序可以被打乱。') +
      '</div>' +
      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>快捷键</h3></div>' +
        '<div class="kbd-list">' +
          '<div class="kbd-row"><span>保存到本地</span><kbd>Ctrl + S</kbd></div>' +
          '<div class="kbd-row"><span>打印 / 导出 PDF</span><kbd>Ctrl + P</kbd></div>' +
          '<div class="kbd-row"><span>撤销上一步结构操作</span><kbd>Ctrl + Z</kbd></div>' +
          '<div class="kbd-row"><span>缩放预览</span><kbd>Ctrl + 滚轮</kbd></div>' +
        '</div>' +
      '</div>';
  }

  /* ================= 面板：导出与备份 ================= */
  function renderExport(state) {
    var pages = RS.app ? RS.app.pageCount() : 0;
    var itemCount = RS.render.countItems(state);
    var chars = (state.profile.summary || '').length;

    return '' +
      '<div class="stat-row">' +
        '<div class="stat"><b>' + pages + '</b><span>当前页数</span></div>' +
        '<div class="stat"><b>' + itemCount + '</b><span>内容条目</span></div>' +
        '<div class="stat"><b>' + chars + '</b><span>简介字数</span></div>' +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>导出</h3></div>' +
        '<div class="export-grid">' +
          '<button class="exp-card" data-act="print">' +
            '<span class="exp-ico"><i data-ico="printer"></i></span>' +
            '<span class="exp-txt"><b>打印 / 导出 PDF</b>' +
              '<span>调用系统打印对话框，目标选择「另存为 PDF」即可得到 A4 文件。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="export-html">' +
            '<span class="exp-ico"><i data-ico="code"></i></span>' +
            '<span class="exp-txt"><b>单文件 HTML · 视觉版</b>' +
              '<span>样式与照片全部内联，双击即可离线打开；保留全部设计，适合直接投递或打印。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="export-html-ats">' +
            '<span class="exp-ico"><i data-ico="check"></i></span>' +
            '<span class="exp-txt"><b>单文件 HTML · ATS 安全版</b>' +
              '<span>' + (state.style.template === 'two-column'
                ? '去除装饰与多列、技能改为纯文本标签，便于招聘系统解析；ATS 安全模式会将双栏退化为单列。'
                : '去除装饰与多列、技能改为纯文本标签，便于招聘系统自动解析；版式为单栏朴素风格。') + '</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="export-doc">' +
            '<span class="exp-ico"><i data-ico="file"></i></span>' +
            '<span class="exp-txt"><b>Word 文档（.doc）</b>' +
              '<span>零依赖的 Word 兼容格式，WPS / Word 可直接打开编辑；复杂排版（多列、色块）会退化为普通段落。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="export-text">' +
            '<span class="exp-ico"><i data-ico="list"></i></span>' +
            '<span class="exp-txt"><b>纯文本（ATS 友好）</b>' +
              '<span>去掉所有格式的纯文本，用于粘贴到招聘网站表单，兼容性最高。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="export-md">' +
            '<span class="exp-ico"><i data-ico="file"></i></span>' +
            '<span class="exp-txt"><b>导出 Markdown</b>' +
              '<span>纯文本结构，方便粘贴到招聘网站表单或在线简历。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>数据备份</h3></div>' +
        '<div class="export-grid">' +
          '<button class="exp-card" data-act="export-json">' +
            '<span class="exp-ico"><i data-ico="download"></i></span>' +
            '<span class="exp-txt"><b>导出 JSON 备份</b>' +
              '<span>包含全部内容与样式设置，可用于换机迁移或版本留档。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="import">' +
            '<span class="exp-ico"><i data-ico="upload"></i></span>' +
            '<span class="exp-txt"><b>导入 JSON 备份</b>' +
              '<span>从本地读取此前导出的备份文件，覆盖当前内容。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<div class="sect">' +
        '<div class="sect-head"><h3><span class="bar"></span>内容管理</h3></div>' +
        '<div class="export-grid">' +
          '<button class="exp-card" data-act="load-sample">' +
            '<span class="exp-ico"><i data-ico="sparkle"></i></span>' +
            '<span class="exp-txt"><b>载入示例内容</b>' +
              '<span>用一份完整示例替换当前内容，适合先看效果再修改。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
          '<button class="exp-card" data-act="clear-all">' +
            '<span class="exp-ico" style="background:rgba(242,85,90,.12);color:#ff8b8f"><i data-ico="trash"></i></span>' +
            '<span class="exp-txt"><b>清空全部内容</b>' +
              '<span>保留姓名，清空所有经历与简介。此操作可用 Ctrl + Z 撤销。</span></span>' +
            '<span class="exp-arrow"><i data-ico="chevronRight"></i></span>' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<p class="hint" style="margin-top:16px;line-height:1.8">' +
        '所有数据仅保存在本机浏览器存储中，不会上传到任何服务器。' +
        (RS.store.storageAvailable ? '' : '<br><b style="color:#f0cd94">当前环境无法写入本地存储，请及时导出 JSON 备份。</b>') +
      '</p>';
  }

  /* ================= 对外接口 ================= */
  function findPanel(id) {
    for (var g = 0; g < PANELS.length; g++) {
      for (var i = 0; i < PANELS[g].items.length; i++) {
        if (PANELS[g].items[i].id === id) return PANELS[g].items[i];
      }
    }
    return null;
  }

  RS.editor = {
    panels: PANELS,
    findPanel: findPanel,

    render: function (panelId, state) {
      switch (panelId) {
        case 'profile': return renderProfile(state);
        case 'templates': return renderTemplates(state);
        case 'style': return renderStyle(state);
        case 'order': return renderOrder(state);
        case 'export': return renderExport(state);
        case 'review': return RS.reviewer ? RS.reviewer.html() : '<div class="empty">评测模块未加载</div>';
        default:
          if (FIELD_DEFS[panelId]) return renderSection(state, panelId);
          return '<div class="empty">未找到该面板</div>';
      }
    },

    /** 头部动作按钮 */
    renderActions: function (panelId, state) {
      if (FIELD_DEFS[panelId]) {
        return '<button class="btn sm primary" data-act="add-item" data-sec="' + panelId + '">' +
          '<i data-ico="plus"></i>新增</button>';
      }
      if (panelId === 'profile') {
        return '';
      }
      return '';
    },

    /** 输入后同步卡片标题（不重建表单，避免焦点丢失） */
    refreshCardTitles: function (bodyEl, state) {
      var cards = bodyEl.querySelectorAll('.card[data-id]');
      for (var i = 0; i < cards.length; i++) {
        var card = cards[i];
        var idx = parseInt(card.getAttribute('data-idx'), 10);
        var panel = RS.app.currentPanel();
        var def = FIELD_DEFS[panel];
        if (!def) continue;
        var list = state.data[panel] || [];
        var it = list[idx];
        if (!it) continue;
        var titleEl = card.querySelector('.card-title');
        if (!titleEl) continue;
        titleEl.innerHTML = esc(def.title(it)) +
          (def.sub(it) ? '<span class="ct-sub">' + esc(def.sub(it)) + '</span>' : '');
      }
    },

    setCardOpen: function (id, open) {
      openCards[id] = !!open;
    }
  };

})(window);

</script>
<script>
/* ==== exporter.js ==== */
/* ==================================================================
   导出层：打印 / 单文件 HTML / Markdown / JSON 备份
   全部在浏览器本地完成，不产生任何网络请求。
   ================================================================== */
(function (window) {
  'use strict';
  var RS = window.RS = window.RS || {};
  var U = RS.util;
  var esc = U.escapeHtml;

  var DOC_VARS = [
    '--doc-accent', '--doc-accent-soft', '--doc-accent-deep',
    '--doc-font', '--doc-size', '--doc-lh', '--doc-gap',
    '--doc-margin', '--photo-size'
  ];

  function collectVars(stack) {
    var out = {};
    DOC_VARS.forEach(function (v) {
      var val = stack.style.getPropertyValue(v);
      if (val) out[v] = val;
    });
    return out;
  }

  function varsToDecl(obj) {
    return Object.keys(obj).map(function (k) {
      return k + ':' + obj[k] + ';';
    }).join('');
  }

  function safeName(str, fallback) {
    var s = String(str || '').trim().replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '');
    return s || fallback || '未命名';
  }

  function stamp() {
    var d = new Date();
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  function download(content, filename, mime) {
    var blob = new Blob([content], { type: mime + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 200);
  }

  /**
   * 剥离纸张内的编辑辅助元素。
   * .drag-handle 是渲染层为「拖动排序」插入到 .res-sec-title 里的手柄，
   * 它属于编辑态 UI，绝不能出现在导出 HTML 或打印产物中。
   * （app.css 的 display:none 不参与导出，所以必须在克隆时物理移除）
   */
  function stripEditorArtifacts(node) {
    var handles = node.querySelectorAll('.drag-handle');
    for (var i = 0; i < handles.length; i++) {
      if (handles[i].parentNode) handles[i].parentNode.removeChild(handles[i]);
    }
    return node;
  }

  var exporter = RS.exporter = {

    /* ---------------- 打印 / PDF ---------------- */
    /**
     * 填充打印容器（幂等）。供 toolbar 打印与「浏览器菜单打印」共用：
     * 后者不会经过 print()，靠 window.beforeprint 兜底填充。
     */
    ensurePrintRoot: function (stack) {
      var root = document.getElementById('printRoot');
      if (!root || !stack) return null;
      if (root.children.length) return root;

      var papers = stack.querySelectorAll('.paper');
      if (!papers.length) return null;

      root.innerHTML = '';
      root.setAttribute('style', varsToDecl(collectVars(stack)));

      Array.prototype.forEach.call(papers, function (p) {
        var clone = p.cloneNode(true);
        clone.removeAttribute('data-page-label');
        stripEditorArtifacts(clone);
        root.appendChild(clone);
      });
      return root;
    },

    print: function (stack) {
      if (!exporter.ensurePrintRoot(stack)) return;
      window.print();
    },

    /* ---------------- 单文件 HTML ---------------- */
    /** 构建完整 HTML 字符串（与下载动作分离，便于校验与复用） */
    buildHTML: function (stack, state, opts) {
      opts = opts || {};
      var papers = stack.querySelectorAll('.paper');
      if (!papers.length) return '';

      var renderCss = document.getElementById('renderStyles');
      var css = renderCss ? renderCss.textContent : '';
      var vars = collectVars(stack);

      var papersHTML = Array.prototype.map.call(papers, function (p) {
        var clone = p.cloneNode(true);
        clone.removeAttribute('data-page-label');
        stripEditorArtifacts(clone); // 编辑辅助元素绝不进入导出产物
        if (opts.ats) clone.setAttribute('data-ats', '1');
        return clone.outerHTML;
      }).join('\n');

      var pageCss = [
        'html,body{margin:0;padding:0;}',
        'body{background:#eceff3;-webkit-print-color-adjust:exact;print-color-adjust:exact;}',
        '@media screen{.paper{margin:22px auto;box-shadow:0 2px 8px rgba(15,23,42,.10),0 12px 32px rgba(15,23,42,.08);}}',
        '@media print{',
        '  @page{size:A4;margin:0;}',
        '  body{background:#fff;}',
        '  .paper{margin:0 !important;box-shadow:none !important;border-radius:0 !important;',
        '         break-after:page;page-break-after:always;}',
        '  .paper:last-child{break-after:auto;page-break-after:auto;}',
        '  .paper::after{display:none !important;}',
        '}'
      ].join('\n');

      var name = safeName(state.profile.name, '简历');
      var title = name + ' - 个人简历';

      return '<!DOCTYPE html>\n' +
        '<html lang="zh-CN">\n<head>\n' +
        '<meta charset="utf-8">\n' +
        '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
        '<title>' + esc(title) + '</title>\n' +
        '<style>\n:root{' + varsToDecl(vars) + '}\n' + pageCss + '\n</style>\n' +
        '<style>\n' + css + '\n</style>\n' +
        '</head>\n<body>\n' + papersHTML + '\n</body>\n</html>';
    },

    exportHTML: function (stack, state, opts) {
      var html = exporter.buildHTML(stack, state, opts);
      if (!html) {
        RS.app.toast('当前没有可导出的内容', 'warn');
        return;
      }
      var name = safeName(state.profile.name, '简历');
      download(html, '简历-' + name + '-' + stamp() + '.html', 'text/html');
      RS.store.recordBackup();
      RS.app.toast('单文件 HTML 已导出，双击即可离线打开', 'ok');
    },

    /* ---------------- Word 兼容 .doc ----------------
       零依赖方案：输出带 Office 命名空间头的 HTML，MIME 用 application/msword。
       Word / WPS 可直接打开；排版会简化（flex/grid 退化为普通块流），
       因此 UI 中需向用户说明兼容性差异。 */
    exportDoc: function (stack, state) {
      var papers = stack.querySelectorAll('.paper');
      if (!papers.length) {
        RS.app.toast('当前没有可导出的内容', 'warn');
        return;
      }

      var renderCss = document.getElementById('renderStyles');
      var css = renderCss ? renderCss.textContent : '';
      var vars = varsToDecl(collectVars(stack));
      var margin = state.style.margin || 14;

      var body = Array.prototype.map.call(papers, function (p) {
        var clone = p.cloneNode(true);
        clone.removeAttribute('data-page-label');
        stripEditorArtifacts(clone);
        return clone.outerHTML;
      }).join('\n<div style="page-break-after:always"></div>\n');

      var name = safeName(state.profile.name, '简历');

      var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" ' +
        'xmlns:w="urn:schemas-microsoft-com:office:word" ' +
        'xmlns="http://www.w3.org/TR/REC-html40">\n' +
        '<head>\n<meta charset="utf-8">\n' +
        '<title>' + esc(name) + ' - 个人简历</title>\n' +
        '<!--[if gte mso 9]><xml><w:WordDocument>' +
        '<w:View>Print</w:View><w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/>' +
        '</w:WordDocument></xml><![endif]-->\n' +
        '<style>\n' +
        '@page{size:A4;margin:' + margin + 'mm;}\n' +
